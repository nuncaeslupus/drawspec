e decides</text><rect x="236.021" y="328.25" width="215.114" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="248.021" y="349.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">The tool decides</text><rect x="475.135" y="24" width="215.114" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="487.135" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">What the diagram means</text><rect x="475.135" y="84.85" width="215.114" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="487.135" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Which semantic role each part has</text><rect x="475.135" y="145.7" width="215.114" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="487.135" y="166.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">What a role looks like</text><rect x="475.135" y="206.55" width="215.114" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="487.135" y="227.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Which size each level is set at</text><rect x="508.665" y="267.4" width="148.055" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="522.227" y="288.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every coordinate</text><rect x="508.665" y="328.25" width="148.055" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="522.227" y="349.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Where the lines break</text><rect x="508.665" y="389.1" width="148.055" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="522.227" y="410.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Whether it fits at all</text></svg>