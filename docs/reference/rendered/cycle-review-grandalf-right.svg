<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 1168.381 117.775" width="1168.381" height="117.775" role="img" aria-labelledby="ds56e2b0bebf-title ds56e2b0bebf-desc"><title id="ds56e2b0bebf-title">The review loop</title><desc id="ds56e2b0bebf-desc">A change is drafted, reviewed, revised and merged, and what is learned feeds the next draft.</desc><path d="M 228.146 69.165 L 242.146 69.165 L 242.146 42.425 L 256.146 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="256.146,42.425 250.146,44.825 250.146,40.025" fill="#1a1a1a" stroke="none"/><path d="M 460.293 42.425 L 488.293 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="488.293,42.425 482.293,44.825 482.293,40.025" fill="#1a1a1a" stroke="none"/><path d="M 692.439 42.425 L 720.439 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="720.439,42.425 714.439,44.825 714.439,40.025" fill="#1a1a1a" stroke="none"/><path d="M 924.586 42.425 L 938.586 42.425 L 938.586 69.165 L 952.586 69.165" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="952.586,69.165 946.586,71.565 946.586,66.765" fill="#1a1a1a" stroke="none"/><path d="M 952.586 76.535 L 228.146 76.535" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="228.146,76.535 234.146,74.135 234.146,78.935" fill="#1a1a1a" stroke="none"/><rect x="24" y="54.425" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="79.447" y="75.658" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Draft the change</text><rect x="256.146" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="286.749" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Review it against the plan</text><rect x="488.293" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.293" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Revise on what the review found</text><rect x="720.439" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="799.911" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Merge it</text><rect x="952.586" y="54.425" width="189.295" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="964.586" y="75.658" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record what the round taught</text></svg>