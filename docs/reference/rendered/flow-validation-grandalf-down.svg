<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720.29 535.6" width="720.29" height="535.6" role="img" aria-labelledby="ds10cb461313-title ds10cb461313-desc"><title id="ds10cb461313-title">Request validation</title><desc id="ds10cb461313-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 434.035 42.425 L 294.641 151.4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 294.641 151.4 L 153.877 308.5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 294.641 151.4 L 435.406 417.475" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 153.877 308.5 L 153.877 417.475" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 153.877 308.5 L 435.406 417.475" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 153.877 417.475 L 296.352 485.75" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 435.406 417.475 L 574.8 485.75" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M 296.352 485.75 L 434.035 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="377.555" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="391.118" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Request arrives</text><rect x="167.506" y="84.85" width="254.271" height="133.1" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="243.073" y="146.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the payload well</text><text x="243.073" y="161.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">formed?</text><rect x="26.741" y="241.95" width="254.271" height="133.1" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="102.309" y="296.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the caller</text><text x="102.309" y="311.308" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">authorised for this</text><text x="102.309" y="326.158" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">resource?</text><rect x="24" y="399.05" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="36" y="420.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Queue for processing</text><rect x="166.475" y="467.325" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="178.475" y="488.558" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record the outcome against the request id</text><rect x="307.753" y="399.05" width="255.305" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="321.316" y="420.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Reject with a reason the caller can act on</text><rect x="453.31" y="459.9" width="242.979" height="51.7" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/><text x="465.31" y="481.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every rejection is audited, including the</text><text x="465.31" y="495.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">reason given</text></svg>