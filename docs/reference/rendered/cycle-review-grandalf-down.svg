ans-serif" font-size="11" fill="#1a1a1a">Revise on what the review found</text><rect x="24" y="218.55" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="103.472" y="239.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Merge it</text><rect x="145.499" y="283.4" width="189.295" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="157.499" y="304.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record what the round taught</text></svg>