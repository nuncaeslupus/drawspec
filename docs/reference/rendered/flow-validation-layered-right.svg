<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1285.01 181.1" width="1285.01" height="181.1" role="img" aria-labelledby="ds393b94deae-title ds393b94deae-desc"><title id="ds393b94deae-title">Request validation</title><desc id="ds393b94deae-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 80.48 90.55 L 288.096 90.55" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 288.096 90.55 L 566.367 90.55" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 288.096 90.55 L 847.38 120.975" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 566.367 90.55 L 847.38 60.125" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 566.367 90.55 L 847.38 120.975" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 847.38 60.125 L 1131.133 52.7" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 847.38 120.975 L 1131.133 120.975" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M 1131.133 52.7 L 80.48 90.55" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="24" y="72.125" width="112.96" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="37.562" y="93.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Request arrives</text><polygon points="288.096,24 415.232,90.55 288.096,157.1 160.96,90.55" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="236.528" y="85.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the payload well</text><text x="265.478" y="100.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">formed?</text><polygon points="566.367,24 693.503,90.55 566.367,157.1 439.232,90.55" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="534.262" y="78.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the caller</text><text x="515.879" y="93.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">authorised for this</text><text x="539.66" y="108.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">resource?</text><rect x="717.503" y="41.7" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="788.612" y="62.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Queue for processing</text><rect x="1001.256" y="34.275" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="1013.256" y="55.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record the outcome against the request id</text><rect x="719.727" y="102.55" width="255.305" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="733.29" y="123.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Reject with a reason the caller can act on</text><rect x="1009.643" y="95.125" width="242.979" height="51.7" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/><text x="1021.643" y="116.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every rejection is audited, including the</text><text x="1095.63" y="131.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">reason given</text></svg>