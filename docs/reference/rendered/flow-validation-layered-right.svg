<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 1269.502 163.05" width="1269.502" height="163.05" role="img" aria-labelledby="dsa55e32ec16-title dsa55e32ec16-desc"><title id="dsa55e32ec16-title">Request validation</title><desc id="dsa55e32ec16-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 136.588 83.96 L 150.96 83.96 L 150.96 80.275 L 164.96 80.275" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="164.96,80.275 158.96,82.675 158.96,77.875" fill="#1a1a1a" stroke="none"/><path d="M 378.501 69.935 L 416.228 69.935 L 416.228 80.275 L 430.228 80.275" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="430.228,80.275 424.228,82.675 424.228,77.875" fill="#1a1a1a" stroke="none"/><path d="M 378.501 90.615 L 430.228 90.615 L 430.228 131.975 L 696.607 131.975 L 696.607 107.015 L 698.092 107.015" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="698.092,107.015 692.092,109.415 692.092,104.615" fill="#1a1a1a" stroke="none"/><path d="M 643.768 69.935 L 681.495 69.935 L 681.495 49.85 L 695.495 49.85" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="695.495,49.85 689.495,52.25 689.495,47.45" fill="#1a1a1a" stroke="none"/><path d="M 643.768 90.615 L 696.607 90.615 L 696.607 114.385 L 698.092 114.385" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="698.092,114.385 692.092,116.785 692.092,111.985" fill="#1a1a1a" stroke="none"/><path d="M 955.249 49.85 L 969.249 49.85 L 969.249 38.74 L 983.249 38.74" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="983.249,38.74 977.249,41.14 977.249,36.34" fill="#1a1a1a" stroke="none"/><path d="M 953.024 110.7 L 991.636 110.7" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M 983.249 46.11 L 955.249 46.11 L 955.249 28.575 L 150.96 28.575 L 150.96 76.59 L 136.588 76.59" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 142.588 74.19 L 136.588 76.59 L 142.588 78.99" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="24" y="61.85" width="112.96" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="37.562" y="83.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Request arrives</text><polygon points="283.594,28.575 402.228,80.275 283.594,131.975 164.96,80.275" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="207.66" y="83.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the payload well formed?</text><polygon points="548.861,28.575 667.495,80.275 548.861,131.975 430.228,80.275" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="476.303" y="75.658" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the caller authorised for</text><text x="510.369" y="90.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">this resource?</text><rect x="695.495" y="31.425" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="766.604" y="52.658" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Queue for processing</text><rect x="983.249" y="24" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="995.249" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record the outcome against the request id</text><rect x="697.719" y="92.275" width="255.305" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="711.282" y="113.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Reject with a reason the caller can act on</text><rect x="991.636" y="84.85" width="242.979" height="51.7" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/><text x="1003.636" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every rejection is audited, including the</text><text x="1077.622" y="120.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">reason given</text></svg>