<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 1168.381 87.35" width="1168.381" height="87.35" role="img" aria-labelledby="ds303fbf6b44-title ds303fbf6b44-desc"><title id="ds303fbf6b44-title">The review loop</title><desc id="ds303fbf6b44-desc">A change is drafted, reviewed, revised and merged, and what is learned feeds the next draft.</desc><path d="M 228.146 38.74 L 242.146 38.74 L 242.146 42.425 L 256.146 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="256.146,42.425 250.146,44.825 250.146,40.025" fill="#1a1a1a" stroke="none"/><path d="M 460.293 42.425 L 488.293 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="488.293,42.425 482.293,44.825 482.293,40.025" fill="#1a1a1a" stroke="none"/><path d="M 692.439 42.425 L 720.439 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="720.439,42.425 714.439,44.825 714.439,40.025" fill="#1a1a1a" stroke="none"/><path d="M 924.586 42.425 L 938.586 42.425 L 938.586 38.74 L 952.586 38.74" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="952.586,38.74 946.586,41.14 946.586,36.34" fill="#1a1a1a" stroke="none"/><path d="M 952.586 46.11 L 924.586 46.11 L 924.586 60.85 L 242.146 60.85 L 242.146 46.11 L 228.146 46.11" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="228.146,46.11 234.146,43.71 234.146,48.51" fill="#1a1a1a" stroke="none"/><rect x="24" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="79.447" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Draft the change</text><rect x="256.146" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="286.749" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Review it against the plan</text><rect x="488.293" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.293" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Revise on what the review found</text><rect x="720.439" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="799.911" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Merge it</text><rect x="952.586" y="24" width="189.295" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="964.586" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record what the round taught</text></svg>