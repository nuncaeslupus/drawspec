<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1149.881 84.85" width="1149.881" height="84.85" role="img" aria-labelledby="ds23de2adf7a-title ds23de2adf7a-desc"><title id="ds23de2adf7a-title">The review loop</title><desc id="ds23de2adf7a-desc">A change is drafted, reviewed, revised and merged, and what is learned feeds the next draft.</desc><path d="M 126.073 42.425 L 354.22 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 354.22 42.425 L 582.366 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 582.366 42.425 L 810.513 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 810.513 42.425 L 1031.234 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 1031.234 42.425 L 126.073 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><rect x="24" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="79.447" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Draft the change</text><rect x="252.146" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="282.749" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Review it against the plan</text><rect x="480.293" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="492.293" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Revise on what the review found</text><rect x="708.439" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="787.911" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Merge it</text><rect x="936.586" y="24" width="189.295" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="948.586" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record what the round taught</text></svg>