<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1285.01 303.863" width="1285.01" height="303.863" role="img" aria-labelledby="ds16ae866a9b-title ds16ae866a9b-desc"><title id="ds16ae866a9b-title">Request validation</title><desc id="ds16ae866a9b-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 80.48 199.525 L 288.096 145.038" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 288.096 145.038 L 566.367 90.55" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 288.096 145.038 L 847.38 199.525" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 566.367 90.55 L 847.38 90.55" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 566.367 90.55 L 847.38 199.525" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 847.38 90.55 L 1131.133 165.388" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 847.38 199.525 L 1131.133 254.013" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M 1131.133 165.388 L 80.48 199.525" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="24" y="181.1" width="112.96" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="37.562" y="202.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Request arrives</text><rect x="160.96" y="78.488" width="254.271" height="133.1" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="236.528" y="140.421" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the payload well</text><text x="236.528" y="155.271" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">formed?</text><rect x="439.232" y="24" width="254.271" height="133.1" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="514.799" y="78.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the caller</text><text x="514.799" y="93.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">authorised for this</text><text x="514.799" y="108.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">resource?</text><rect x="717.503" y="72.125" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="729.503" y="93.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Queue for processing</text><rect x="1001.256" y="146.963" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="1013.256" y="168.196" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record the outcome against the request id</text><rect x="719.727" y="181.1" width="255.305" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="733.29" y="202.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Reject with a reason the caller can act on</text><rect x="1009.643" y="228.163" width="242.979" height="51.7" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/><text x="1021.643" y="249.396" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every rejection is audited, including the</text><text x="1021.643" y="264.246" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">reason given</text></svg>