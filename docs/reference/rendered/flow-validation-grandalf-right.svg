<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 1280.926 269.238" width="1280.926" height="269.238" role="img" aria-labelledby="ds1889abc96e-title ds1889abc96e-desc"><title id="ds1889abc96e-title">Request validation</title><desc id="ds1889abc96e-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 136.588 166.14 L 152.388 166.14 L 152.388 122.763 L 167.816 122.763" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="167.816,122.763 161.816,125.163 161.816,120.362" fill="#1a1a1a" stroke="none"/><path d="M 381.357 112.422 L 421.94 112.422 L 421.94 75.7 L 438.796 75.7" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="438.796,75.7 432.796,78.1 432.796,73.3" fill="#1a1a1a" stroke="none"/><path d="M 381.357 133.102 L 708.031 133.102 L 708.031 173.51 L 709.516 173.51" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="709.516,173.51 703.516,175.91 703.516,171.11" fill="#1a1a1a" stroke="none"/><path d="M 652.336 65.36 L 691.491 65.36 L 691.491 75.7 L 706.919 75.7" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="706.919,75.7 700.919,78.1 700.919,73.3" fill="#1a1a1a" stroke="none"/><path d="M 652.336 86.04 L 706.919 86.04 L 706.919 166.14 L 709.516 166.14" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="709.516,166.14 703.516,168.54 703.516,163.74" fill="#1a1a1a" stroke="none"/><path d="M 966.672 75.7 L 980.672 75.7 L 980.672 132.002 L 994.672 132.002" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="994.672,132.002 988.672,134.403 988.672,129.602" fill="#1a1a1a" stroke="none"/><path d="M 964.448 169.825 L 998.866 169.825 L 998.866 216.887 L 1003.059 216.887" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M 994.672 139.373 L 421.94 139.373 L 421.94 174.463 L 152.388 174.463 L 152.388 173.51 L 136.588 173.51" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 142.588 171.11 L 136.588 173.51 L 142.588 175.91" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="24" y="151.4" width="112.96" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="37.562" y="172.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Request arrives</text><polygon points="286.45,71.062 405.084,122.762 286.45,174.462 167.816,122.762" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.516" y="125.571" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the payload well formed?</text><polygon points="557.429,24 676.063,75.7 557.429,127.4 438.796,75.7" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="484.871" y="71.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the caller authorised for</text><text x="518.937" y="85.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">this resource?</text><rect x="706.919" y="57.275" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="778.028" y="78.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Queue for processing</text><rect x="994.672" y="117.262" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="1006.672" y="138.496" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record the outcome against the request id</text><rect x="709.143" y="151.4" width="255.305" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="722.706" y="172.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Reject with a reason the caller can act on</text><rect x="1003.059" y="191.037" width="242.979" height="51.7" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/><text x="1015.059" y="212.271" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every rejection is audited, including the</text><text x="1089.046" y="227.121" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">reason given</text></svg>