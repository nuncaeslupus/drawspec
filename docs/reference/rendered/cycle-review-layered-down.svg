<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252.146 328.25" width="252.146" height="328.25" role="img" aria-labelledby="dsa00ff930a2-title dsa00ff930a2-desc"><title id="dsa00ff930a2-title">The review loop</title><desc id="dsa00ff930a2-desc">A change is drafted, reviewed, revised and merged, and what is learned feeds the next draft.</desc><path d="M 126.073 42.425 L 126.073 103.275" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 126.073 103.275 L 126.073 164.125" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 126.073 164.125 L 126.073 224.975" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 126.073 224.975 L 126.073 285.825" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 126.073 285.825 L 126.073 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><rect x="24" y="24" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="36" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Draft the change</text><rect x="24" y="84.85" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="36" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Review it against the plan</text><rect x="24" y="145.7" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="36" y="166.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Revise on what the review found</text><rect x="24" y="206.55" width="204.146" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="36" y="227.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Merge it</text><rect x="31.426" y="267.4" width="189.295" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="43.426" y="288.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record what the round taught</text></svg>