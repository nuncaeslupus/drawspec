<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 587.058 535.6" width="587.058" height="535.6" role="img" aria-labelledby="dsf21f18ac45-title dsf21f18ac45-desc"><title id="dsf21f18ac45-title">Request validation</title><desc id="dsf21f18ac45-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 293.529 42.425 L 293.529 151.4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 293.529 151.4 L 293.529 308.5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 293.529 151.4 L 435.406 417.475" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 293.529 308.5 L 153.877 417.475" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 293.529 308.5 L 435.406 417.475" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 153.877 417.475 L 160.039 485.75" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M 435.406 417.475 L 435.406 485.75" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M 160.039 485.75 L 293.529 42.425" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="237.049" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="250.611" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Request arrives</text><rect x="166.393" y="84.85" width="254.271" height="133.1" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="241.961" y="146.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the payload well</text><text x="241.961" y="161.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">formed?</text><rect x="166.393" y="241.95" width="254.271" height="133.1" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="241.961" y="296.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the caller</text><text x="241.961" y="311.308" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">authorised for this</text><text x="241.961" y="326.158" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">resource?</text><rect x="24" y="399.05" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="36" y="420.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Queue for processing</text><rect x="30.163" y="467.325" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="42.163" y="488.558" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record the outcome against the request id</text><rect x="307.753" y="399.05" width="255.305" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="321.316" y="420.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Reject with a reason the caller can act on</text><rect x="313.916" y="459.9" width="242.979" height="51.7" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/><text x="325.916" y="481.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every rejection is audited, including the</text><text x="325.916" y="495.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">reason given</text></svg>