<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 589.558 494.7" width="589.558" height="494.7" role="img" aria-labelledby="ds12ce29f0cb-title ds12ce29f0cb-desc"><title id="ds12ce29f0cb-title">Request validation</title><desc id="ds12ce29f0cb-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 304.825 60.85 L 304.825 74.85 L 293.529 74.85 L 293.529 88.85" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="293.529,88.85 291.129,82.85 295.929,82.85" fill="#1a1a1a" stroke="none"/><path d="M 269.802 181.91 L 269.802 206.25 L 293.529 206.25 L 293.529 220.25" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="293.529,220.25 291.129,214.25 295.929,214.25" fill="#1a1a1a" stroke="none"/><path d="M 317.256 181.91 L 317.256 220.25 L 412.163 220.25 L 412.163 337.65 L 409.875 337.65 L 409.875 351.65" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="409.875,351.65 407.475,345.65 412.275,345.65" fill="#1a1a1a" stroke="none"/><path d="M 269.802 313.31 L 269.802 337.65 L 153.877 337.65 L 153.877 351.65" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="153.877,351.65 151.477,345.65 156.277,345.65" fill="#1a1a1a" stroke="none"/><path d="M 317.256 313.31 L 317.256 337.65 L 460.936 337.65 L 460.936 351.65" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="460.936,351.65 458.536,345.65 463.336,345.65" fill="#1a1a1a" stroke="none"/><path d="M 153.877 388.5 L 153.877 420.212 L 134.064 420.212 L 134.064 423.925" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><polygon points="134.064,423.925 131.664,417.925 136.464,417.925" fill="#1a1a1a" stroke="none"/><path d="M 435.406 388.5 L 435.406 416.5" fill="none" stroke="#1a1a1a" stroke-width="1"/><path d="M 186.015 423.925 L 186.015 388.5 L 283.753 388.5 L 283.753 337.65 L 174.895 337.65 L 174.895 74.85 L 282.233 74.85 L 282.233 60.85" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 284.633 66.85 L 282.233 60.85 L 279.833 66.85" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="237.049" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="250.611" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Request arrives</text><polygon points="293.529,88.85 412.163,140.55 293.529,192.25 174.895,140.55" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="217.595" y="143.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the payload well formed?</text><polygon points="293.529,220.25 412.163,271.95 293.529,323.65 174.895,271.95" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="220.971" y="267.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Is the caller authorised for</text><text x="255.037" y="282.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">this resource?</text><rect x="24" y="351.65" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="95.109" y="372.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Queue for processing</text><rect x="30.163" y="423.925" width="259.753" height="36.85" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><text x="42.163" y="445.158" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Record the outcome against the request id</text><rect x="307.753" y="351.65" width="255.305" height="36.85" rx="18.425" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="321.316" y="372.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Reject with a reason the caller can act on</text><rect x="313.916" y="416.5" width="242.979" height="51.7" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 2"/><text x="325.916" y="437.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">Every rejection is audited, including the</text><text x="399.903" y="452.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="#1a1a1a">reason given</text></svg>