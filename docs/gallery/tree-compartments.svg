<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 352.15" role="img" aria-labelledby="ds3711806d56-title ds3711806d56-desc"><title id="ds3711806d56-title">A box that is a name over what belongs to it</title><desc id="ds3711806d56-desc">The same lead-and-detail every label may carry, separated by a rule instead of by weight. A blank-free newline in `text` is the author saying these are two things; `[box] lead` is the theme saying what separates them, and this theme says a line. It is what a class, a record or a component is drawn as by hand — a name, a rule, and the things under it — and it is also where who performs a step goes when that is not the kind of thing a role should carry.</desc><path d="M 342.205 103.4 L 342.205 127.4 L 219.145 127.4 L 219.145 151.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="219.145,151.4 215.545,147.4 219.145,143.4 222.745,147.4" fill="currentColor" stroke="none"/><path d="M 353.91 103.4 L 353.91 151.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="353.91,151.4 350.31,147.4 353.91,143.4 357.51,147.4" fill="currentColor" stroke="none"/><path d="M 365.615 103.4 L 365.615 127.4 L 488.674 127.4 L 488.674 151.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="488.674,151.4 485.074,147.4 488.674,143.4 492.274,147.4" fill="currentColor" stroke="none"/><path d="M 219.145 227.95 L 219.145 275.95" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 215.545 267.95 L 219.145 275.95 L 222.745 267.95" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="163.763" y="151.4" width="110.765" height="76.55" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 163.763 181.25 L 274.527 181.25" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.145" y="172.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Card payment</tspan></text><text x="219.145" y="197.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>last four digits</tspan></text><text x="219.145" y="212.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>scheme</tspan></text><rect x="314.893" y="12" width="78.033" height="91.4" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M 314.893 41.85 L 392.926 41.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="353.91" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Payment</tspan></text><text x="353.91" y="58.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>reference</tspan></text><text x="353.91" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>amount</tspan></text><text x="353.91" y="87.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>taken at</tspan></text><rect x="433.292" y="151.4" width="110.765" height="76.55" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 433.292 181.25 L 544.057 181.25" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="488.674" y="172.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Refund</tspan></text><text x="488.674" y="197.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>reverses</tspan></text><text x="488.674" y="212.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>reason</tspan></text><rect x="119.943" y="275.95" width="198.404" height="61.7" rx="30.85" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M 119.959 305.8 L 318.331 305.8" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="219.145" y="297.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Settled</tspan></text><text x="219.145" y="322.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>no further change is possible</tspan></text><rect x="298.527" y="151.4" width="110.765" height="76.55" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 298.527 181.25 L 409.292 181.25" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="353.91" y="172.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Bank transfer</tspan></text><text x="353.91" y="197.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>sort code</tspan></text><text x="353.91" y="212.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>cleared at</tspan></text></svg>