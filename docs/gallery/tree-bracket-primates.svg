<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 665 283.5" role="img" aria-labelledby="dsa638df8aa0-title dsa638df8aa0-desc"><title id="dsa638df8aa0-title">How the living primates are related</title><desc id="dsa638df8aa0-desc">A cladogram of ten living primate groups: lemurs and lorises on one branch, tarsiers, monkeys and apes on the other, with the apes and the great apes named at the splits they begin at.</desc><path d="M 188.369 60.196 L 176.369 60.196" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 357.719 31.1 L 188.369 31.1 L 188.369 60.196" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 202.369 89.293 L 188.369 89.293 L 188.369 60.196" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 216.369 112.46 L 202.369 112.46 L 202.369 89.293" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 230.369 135.445 L 216.369 135.445 L 216.369 112.46" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 263.375 158.066 L 230.369 158.066 L 230.369 135.445" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 329.719 179.956 L 263.375 179.956 L 263.375 158.066" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 343.719 200.388 L 329.719 200.388 L 329.719 179.956" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 357.719 217.9 L 343.719 217.9 L 343.719 200.388" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 19.425 L 357.719 19.425 L 357.719 31.1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 42.775 L 357.719 42.775 L 357.719 31.1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 66.125 L 202.369 66.125 L 202.369 89.293" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 89.475 L 216.369 89.475 L 216.369 112.46" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 112.825 L 230.369 112.825 L 230.369 135.445" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 136.175 L 263.375 136.175 L 263.375 158.066" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 159.525 L 329.719 159.525 L 329.719 179.956" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 182.875 L 343.719 182.875 L 343.719 200.388" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 206.225 L 357.719 206.225 L 357.719 217.9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 371.719 229.575 L 357.719 229.575 L 357.719 217.9" fill="none" stroke="currentColor" stroke-width="1"/><text x="260.375" y="151.949" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Apes</tspan></text><text x="326.719" y="173.839" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Great apes</tspan></text><text x="375.719" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Lemurs</tspan></text><text x="375.719" y="46.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Lorises</tspan></text><text x="375.719" y="69.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Tarsiers</tspan></text><text x="375.719" y="93.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>New World monkeys</tspan></text><text x="375.719" y="116.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Old World monkeys</tspan></text><text x="375.719" y="139.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Gibbons</tspan></text><text x="375.719" y="163.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Orangutans</tspan></text><text x="375.719" y="186.683" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Gorillas</tspan></text><text x="375.719" y="210.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Chimpanzees</tspan></text><text x="375.719" y="233.383" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Humans</tspan></text><text x="332" y="257.212" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Each split is a common ancestor. The order down the page ranks nothing.</tspan></text></svg>