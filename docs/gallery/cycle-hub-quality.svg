<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 474.523" role="img" aria-labelledby="ds13c81d22e3-title ds13c81d22e3-desc"><title id="ds13c81d22e3-title">Plan, do, check, act</title><desc id="ds13c81d22e3-desc">The improvement cycle of a quality standard: four steps that come round again, turning around the management system they improve. The system is not a fifth step, so it sits in the middle rather than on the ring.</desc><path d="M 422.492 51.412 L 436.913 59.209 L 450.667 68.131 L 463.667 78.12 L 475.829 89.113 L 487.076 101.041 L 497.338 113.826 L 506.548 127.389 L 514.648 141.642 L 521.587 156.496 L 527.32 171.855 L 531.811 187.622 L 535.031 203.696" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="536.135,211.619 538.981,203.068 531.081,204.325" fill="currentColor" stroke="none"/><path d="M 536.135 260.404 L 533.542 276.592 L 529.668 292.521 L 524.536 308.092 L 518.181 323.204 L 510.642 337.762 L 501.966 351.672 L 492.21 364.847 L 481.435 377.203 L 469.71 388.661 L 457.109 399.149 L 443.712 408.599 L 429.605 416.951" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="422.492,420.611 431.504,420.472 427.706,413.431" fill="currentColor" stroke="none"/><path d="M 241.508 420.611 L 227.087 412.814 L 213.333 403.892 L 200.333 393.903 L 188.171 382.91 L 176.924 370.983 L 166.662 358.197 L 157.452 344.634 L 149.352 330.381 L 142.413 315.528 L 136.68 300.169 L 132.189 284.402 L 128.969 268.327" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="127.865,260.404 125.019,268.956 132.919,267.698" fill="currentColor" stroke="none"/><path d="M 127.865 211.619 L 130.458 195.432 L 134.332 179.502 L 139.464 163.931 L 145.819 148.819 L 153.358 134.262 L 162.034 120.351 L 171.79 107.176 L 182.565 94.82 L 194.29 83.362 L 206.891 72.875 L 220.288 63.425 L 234.395 55.072" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="241.508,51.412 232.496,51.552 236.294,58.593" fill="currentColor" stroke="none"/><rect x="221.365" y="12" width="221.27" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Plan: set objectives and targets</tspan></text><rect x="426.952" y="217.587" width="221.27" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="537.587" y="238.82" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Do: run the processes as planned</tspan></text><rect x="221.365" y="423.173" width="221.27" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="444.406" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Check: measure against the targets</tspan></text><rect x="15.779" y="217.587" width="221.27" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="126.413" y="238.82" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Act: correct and standardise</tspan></text><rect x="261.525" y="210.162" width="140.95" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="332" y="231.395" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The quality</tspan></text><text x="332" y="246.245" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>management system</tspan></text></svg>