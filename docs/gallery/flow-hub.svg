<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 233.05" role="img" aria-labelledby="dsf63d6f884b-title dsf63d6f884b-desc"><title id="dsf63d6f884b-title">What a post is defined by</title><desc id="dsf63d6f884b-desc">A post is the subject: the unit that contains it, the function that describes it, the cost centre it is charged to and the person who holds it are all defined by their relation to it. There is no sequence between them and no hierarchy — the four relations are peers, and the reading starts in the middle.</desc><path d="M 332 48.85 L 332 96.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,96.85 328.4,88.85 335.6,88.85" fill="currentColor" stroke="none"/><path d="M 370.931 115.275 L 418.931 115.275" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="418.931,115.275 410.931,118.875 410.931,111.675" fill="currentColor" stroke="none"/><path d="M 396.69 200.125 L 407.811 200.125 L 407.811 118.96 L 370.931 118.96" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="370.931,118.96 378.931,115.36 378.931,122.56" fill="currentColor" stroke="none"/><path d="M 245.069 115.275 L 293.069 115.275" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="293.069,115.275 285.069,118.875 285.069,111.675" fill="currentColor" stroke="none"/><rect x="418.931" y="96.85" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="483.621" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The cost centre</tspan></text><rect x="267.31" y="181.7" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="202.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The person</tspan></text><rect x="293.069" y="96.85" width="77.861" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="332" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The post</tspan></text><rect x="115.688" y="96.85" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="180.379" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The job description</tspan></text><rect x="267.31" y="12" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The unit</tspan></text><text x="336.75" y="76.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">contains</text><text x="382.348" y="89.167" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">charged to</text><text x="412.561" y="163.004" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">holds</text><text x="245.166" y="89.167" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">describes</text></svg>