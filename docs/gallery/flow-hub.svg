<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 257.05" role="img" aria-labelledby="dsad14b0b929-title dsad14b0b929-desc"><title id="dsad14b0b929-title">What a post is defined by</title><desc id="dsad14b0b929-desc">A post is the subject: the unit that contains it, the function that describes it, the cost centre it is charged to and the person who holds it are all defined by their relation to it. There is no sequence between them and no hierarchy — the four relations are peers, and the reading starts in the middle.</desc><path d="M 320 60.85 L 320 108.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="320,108.85 316.4,100.85 323.6,100.85" fill="currentColor" stroke="none"/><path d="M 358.931 127.275 L 406.931 127.275" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="406.931,127.275 398.931,130.875 398.931,123.675" fill="currentColor" stroke="none"/><path d="M 384.69 212.125 L 395.811 212.125 L 395.811 130.96 L 358.931 130.96" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="358.931,130.96 366.931,127.36 366.931,134.56" fill="currentColor" stroke="none"/><path d="M 233.069 127.275 L 281.069 127.275" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="281.069,127.275 273.069,130.875 273.069,123.675" fill="currentColor" stroke="none"/><rect x="406.931" y="108.85" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="471.621" y="130.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The cost centre</tspan></text><rect x="255.31" y="193.7" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="214.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The person</tspan></text><rect x="281.069" y="108.85" width="77.861" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="320" y="130.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The post</tspan></text><rect x="103.688" y="108.85" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="168.379" y="130.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The job description</tspan></text><rect x="255.31" y="24" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The unit</tspan></text><text x="324.75" y="88.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">contains</text><text x="370.348" y="101.167" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">charged to</text><text x="400.561" y="175.004" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">holds</text><text x="233.166" y="101.167" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">describes</text></svg>