<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 250.842" role="img" aria-labelledby="ds9e97cc2a5d-title ds9e97cc2a5d-desc"><title id="ds9e97cc2a5d-title">An incident, and what runs alongside it</title><desc id="ds9e97cc2a5d-desc">Four steps read across the page, with two continuous activities beside them: keeping the reporter informed, which runs above, and recording what was done, which runs below. Neither contains the steps and neither contains the other — they are peers, and a band is how that is said. A group could not: a box sits inside one container or none, so two groups over the same four boxes would have to nest, which draws a hierarchy that is not there.</desc><path d="M 172.283 102.251 L 220.283 102.251" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="220.283,102.251 212.283,105.851 212.283,98.651" fill="currentColor" stroke="none"/><path d="M 296 102.251 L 344 102.251" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="344,102.251 336,105.851 336,98.651" fill="currentColor" stroke="none"/><path d="M 419.717 102.251 L 467.717 102.251" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="467.717,102.251 459.717,105.851 459.717,98.651" fill="currentColor" stroke="none"/><rect x="467.717" y="84.42" width="75.717" height="35.662" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="505.575" y="104.754" font-family="'DejaVu Sans', sans-serif" font-size="10.12" fill="currentColor" text-anchor="middle"><tspan>Closed</tspan></text><rect x="344" y="84.42" width="75.717" height="35.662" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="381.858" y="104.754" font-family="'DejaVu Sans', sans-serif" font-size="10.12" fill="currentColor" text-anchor="middle"><tspan>Contained</tspan></text><rect x="96.566" y="84.42" width="75.717" height="35.662" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="134.425" y="104.754" font-family="'DejaVu Sans', sans-serif" font-size="10.12" fill="currentColor" text-anchor="middle"><tspan>Detected</tspan></text><rect x="220.283" y="84.42" width="75.717" height="35.662" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="258.142" y="104.754" font-family="'DejaVu Sans', sans-serif" font-size="10.12" fill="currentColor" text-anchor="middle"><tspan>Triaged</tspan></text><path d="M 96.566 60.42 L 543.434 60.42" fill="none" stroke="currentColor" stroke-width="1"/><text x="320" y="33.395" font-family="'DejaVu Sans', sans-serif" font-size="9.2" fill="currentColor" text-anchor="middle"><tspan>Keeping the reporter informed</tspan></text><path d="M 96.566 144.082 L 543.434 144.082" fill="none" stroke="currentColor" stroke-width="1"/><text x="320" y="177.477" font-family="'DejaVu Sans', sans-serif" font-size="9.2" fill="currentColor" text-anchor="middle"><tspan>Recording what was done</tspan></text><text x="320" y="223.897" font-family="'DejaVu Sans', sans-serif" font-size="9.2" fill="currentColor" text-anchor="middle"><tspan>A band accompanies its members; a group contains them. The bar spans what it names and the words sit outside it, so a long name</tspan></text><text x="320" y="236.317" font-family="'DejaVu Sans', sans-serif" font-size="9.2" fill="currentColor" text-anchor="middle"><tspan>never reaches back over the boxes.</tspan></text></svg>