<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 237.914" role="img" aria-labelledby="dsc9afd94d98-title dsc9afd94d98-desc"><title id="dsc9afd94d98-title">An incident, and what runs alongside it</title><desc id="dsc9afd94d98-desc">Four steps read across the page, with two continuous activities beside them: keeping the reporter informed, which runs above, and recording what was done, which runs below. Neither contains the steps and neither contains the other — they are peers, and a band is how that is said. A group could not: a box sits inside one container or none, so two groups over the same four boxes would have to nest, which draws a hierarchy that is not there.</desc><path d="M 167.786 99.707 L 215.786 99.707" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="215.786,99.707 207.786,103.307 207.786,96.107" fill="currentColor" stroke="none"/><path d="M 296 99.707 L 344 99.707" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="344,99.707 336,103.307 336,96.107" fill="currentColor" stroke="none"/><path d="M 424.214 99.707 L 472.214 99.707" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="472.214,99.707 464.214,103.307 464.214,96.107" fill="currentColor" stroke="none"/><rect x="472.214" y="81.282" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="512.321" y="102.515" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Closed</tspan></text><rect x="344" y="81.282" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="384.107" y="102.515" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Contained</tspan></text><rect x="87.572" y="81.282" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="127.679" y="102.515" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Detected</tspan></text><rect x="215.786" y="81.282" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="255.893" y="102.515" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Triaged</tspan></text><path d="M 87.572 57.282 L 552.428 57.282" fill="none" stroke="currentColor" stroke-width="1"/><text x="320" y="24" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Keeping the reporter informed</text><path d="M 87.572 142.132 L 552.428 142.132" fill="none" stroke="currentColor" stroke-width="1"/><text x="320" y="175.414" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Recording what was done</text><text x="320" y="219.626" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A band accompanies its members; a group contains them. The bar spans what it names and the words sit outside it, so a long</tspan></text><text x="320" y="233.126" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>name never reaches back over the boxes.</tspan></text></svg>