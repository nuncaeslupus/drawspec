<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 283.45" role="img" aria-labelledby="ds0f8de6bf48-title ds0f8de6bf48-desc"><title id="ds0f8de6bf48-title">Library refit: highlight report, period 7</title><desc id="ds0f8de6bf48-desc">Five workstreams of a library refit, each rated red, amber or green with its direction of travel since period 6 and a sentence saying why.</desc><polygon points="152.398,13.753 158.218,23.647 146.578,23.647" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M 230.333 13.543 L 230.333 17.571" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="230.333,25.571 235.133,17.571 225.533,17.571" fill="currentColor" stroke="none"/><path d="M 12 51.7 L 652 51.7" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="152.398" cy="69.257" rx="4.85" ry="4.85" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M 224.319 69.257 L 228.347 69.257" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="236.347,69.257 228.347,64.457 228.347,74.057" fill="currentColor" stroke="none"/><path d="M 12 100.05 L 652 100.05" fill="none" stroke="currentColor" stroke-width="1"/><polygon points="148.13,113.339 156.666,113.339 156.666,121.875 148.13,121.875" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M 230.333 111.593 L 230.333 115.621" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="230.333,123.621 235.133,115.621 225.533,115.621" fill="currentColor" stroke="none"/><path d="M 12 149.75 L 652 149.75" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="152.398" cy="167.307" rx="4.85" ry="4.85" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M 230.333 173.321 L 230.333 169.293" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="230.333,161.293 225.533,169.293 235.133,169.293" fill="currentColor" stroke="none"/><path d="M 12 198.1 L 652 198.1" fill="none" stroke="currentColor" stroke-width="1"/><polygon points="152.398,209.853 158.218,219.747 146.578,219.747" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M 224.319 215.657 L 228.347 215.657" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="236.347,215.657 228.347,210.857 228.347,220.457" fill="currentColor" stroke="none"/><text x="12" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Building</tspan><tspan font-weight="bold"> works</tspan></text><text x="12" y="37.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>Lead: estates</tspan></text><text x="164.748" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Amber</tspan></text><text x="242.683" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>worsening</tspan></text><text x="315.119" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>The asbestos survey added two weeks; the contractor is</tspan></text><text x="315.119" y="38.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>re-sequencing the ground floor to hold the opening date.</tspan></text><text x="12" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Self-service</tspan><tspan font-weight="bold"> kiosks</tspan></text><text x="12" y="86.762" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>Lead: digital</tspan></text><text x="164.748" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Green</tspan></text><text x="242.683" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>no change</tspan></text><text x="315.119" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>All six installed and tested with the new catalogue.</tspan></text><text x="12" y="121.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Staff</tspan><tspan font-weight="bold"> training</tspan></text><text x="12" y="135.112" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>Lead: people team</tspan></text><text x="164.748" y="121.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Red</tspan></text><text x="242.683" y="121.283" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>worsening</tspan></text><text x="315.119" y="121.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>No trainer is booked yet.</tspan><tspan font-weight="bold"> Decision needed:</tspan><tspan> approve the</tspan></text><text x="315.119" y="136.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>supplier's quote by Friday.</tspan></text><text x="12" y="170.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Stock</tspan><tspan font-weight="bold"> move</tspan></text><text x="12" y="184.812" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>Lead: collections</tspan></text><text x="164.748" y="170.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Green</tspan></text><text x="242.683" y="170.983" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>improving</tspan></text><text x="315.119" y="170.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>The temporary store is ready, a week early.</tspan></text><text x="12" y="219.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Reopening</tspan><tspan font-weight="bold"> event</tspan></text><text x="12" y="233.162" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>Lead: communications</tspan></text><text x="164.748" y="219.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Amber</tspan></text><text x="242.683" y="219.333" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>no change</tspan></text><text x="315.119" y="219.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Date held; the guest speaker has not yet confirmed.</tspan></text><text x="332" y="256.662" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Ratings as at the end of period 7; the trend is the change since period 6.</tspan></text></svg>