eight="bold">Measurement</tspan></text><text x="106.303" y="51.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Pricing link</tspan></text><text x="106.303" y="65.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>removed from</tspan></text><text x="106.303" y="80.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>the header</tspan></text><text x="138.086" y="106.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Customer</tspan></text><text x="138.086" y="120.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>logos dropped</tspan></text><text x="106.684" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Trust</tspan></text><text x="569.175" y="179.108" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Weekly sign-ups</tspan></text><text x="569.175" y="193.958" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>down 18 % since the</tspan></text><text x="569.175" y="208.808" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>new landing page</tspan></text><text x="332" y="390.512" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Dashed: investigated and ruled out. Bold: confirmed by the A/B rerun.</tspan></text></svg>