<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 236.391" role="img" aria-labelledby="ds5a9e70d33a-title ds5a9e70d33a-desc"><title id="ds5a9e70d33a-title">How a stripe is laid out across four disks</title><desc id="ds5a9e70d33a-desc">One row per RAID level, one column per disk. A cell says what that disk holds for one stripe: a block of data, a copy of one, or a parity block computed from the others. The fills say which kind, so the drawing still says it in black and white.</desc><defs><pattern id="ds5a9e70d33a-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="currentColor" fill-opacity="0.4"/></pattern><pattern id="ds5a9e70d33a-grid" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M 0 0 L 0 9 M 0 0 L 9 0" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/></pattern><pattern id="ds5a9e70d33a-hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M 0 5 L 5 0" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/></pattern></defs><text x="145.315" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 1</tspan></text><text x="290.082" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 2</tspan></text><text x="434.849" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 3</tspan></text><text x="579.616" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 4</tspan></text><text x="42.466" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 0</tspan></text><text x="42.466" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 1</tspan></text><text x="42.466" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 5</tspan></text><text x="42.466" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 6</tspan></text><polygon points="72.932,48.85 217.699,48.85 217.699,85.7 72.932,85.7" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="145.315" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="217.699,48.85 362.466,48.85 362.466,85.7 217.699,85.7" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="290.082" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="362.466,48.85 507.233,48.85 507.233,85.7 362.466,85.7" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="434.849" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>C</tspan></text><polygon points="507.233,48.85 652,48.85 652,85.7 507.233,85.7" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="579.616" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>D</tspan></text><polygon points="72.932,85.7 217.699,85.7 217.699,122.55 72.932,122.55" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="145.315" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="217.699,85.7 362.466,85.7 362.466,122.55 217.699,122.55" fill="url(#ds5a9e70d33a-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="290.082" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="362.466,85.7 507.233,85.7 507.233,122.55 362.466,122.55" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="434.849" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="507.233,85.7 652,85.7 652,122.55 507.233,122.55" fill="url(#ds5a9e70d33a-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="579.616" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="72.932,122.55 217.699,122.55 217.699,159.4 72.932,159.4" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="145.315" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="217.699,122.55 362.466,122.55 362.466,159.4 217.699,159.4" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="290.082" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="362.466,122.55 507.233,122.55 507.233,159.4 362.466,159.4" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="434.849" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>C</tspan></text><polygon points="507.233,122.55 652,122.55 652,159.4 507.233,159.4" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="579.616" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>P</tspan></text><polygon points="72.932,159.4 217.699,159.4 217.699,196.25 72.932,196.25" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="145.315" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="217.699,159.4 362.466,159.4 362.466,196.25 217.699,196.25" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="290.082" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="362.466,159.4 507.233,159.4 507.233,196.25 362.466,196.25" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="434.849" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>P</tspan></text><polygon points="507.233,159.4 652,159.4 652,196.25 507.233,196.25" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="579.616" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Q</tspan></text><polygon points="12,206.832 30.858,206.832 30.858,217.309 12,217.309" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="35.858" y="215.532" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">A block of this stripe's data</text><polygon points="182.015,206.832 200.873,206.832 200.873,217.309 182.015,217.309" fill="url(#ds5a9e70d33a-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="205.873" y="215.532" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">A copy of a block on another disk</text><polygon points="382.836,206.832 401.694,206.832 401.694,217.309 382.836,217.309" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="406.694" y="215.532" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Parity, computed from the blocks beside it</text></svg>