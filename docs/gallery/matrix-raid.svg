<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 212.391" role="img" aria-labelledby="ds934025e8fe-title ds934025e8fe-desc"><title id="ds934025e8fe-title">How a stripe is laid out across four disks</title><desc id="ds934025e8fe-desc">One row per RAID level, one column per disk. A cell says what that disk holds for one stripe: a block of data, a copy of one, or a parity block computed from the others. The fills say which kind, so the drawing still says it in black and white.</desc><defs><pattern id="ds934025e8fe-cross" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M 0 4 L 4 0 M 0 0 L 4 4" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.3"/></pattern><pattern id="ds934025e8fe-dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.6" fill="currentColor" fill-opacity="0.35"/></pattern><pattern id="ds934025e8fe-hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M 0 4 L 4 0" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/></pattern></defs><text x="133.315" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 1</tspan></text><text x="278.082" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 2</tspan></text><text x="422.849" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 3</tspan></text><text x="567.616" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Disk 4</tspan></text><text x="30.466" y="58.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 0</tspan></text><text x="30.466" y="94.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 1</tspan></text><text x="30.466" y="131.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 5</tspan></text><text x="30.466" y="168.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>RAID 6</tspan></text><polygon points="60.932,36.85 205.699,36.85 205.699,73.7 60.932,73.7" fill="url(#ds934025e8fe-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="133.315" y="58.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="205.699,36.85 350.466,36.85 350.466,73.7 205.699,73.7" fill="url(#ds934025e8fe-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="278.082" y="58.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="350.466,36.85 495.233,36.85 495.233,73.7 350.466,73.7" fill="url(#ds934025e8fe-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="422.849" y="58.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>C</tspan></text><polygon points="495.233,36.85 640,36.85 640,73.7 495.233,73.7" fill="url(#ds934025e8fe-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="567.616" y="58.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>D</tspan></text><polygon points="60.932,73.7 205.699,73.7 205.699,110.55 60.932,110.55" fill="url(#ds934025e8fe-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="133.315" y="94.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="205.699,73.7 350.466,73.7 350.466,110.55 205.699,110.55" fill="url(#ds934025e8fe-dots)" stroke="currentColor" stroke-width="1.5"/><text x="278.082" y="94.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="mid