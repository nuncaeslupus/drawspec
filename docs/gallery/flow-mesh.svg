<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 194.7" role="img" aria-labelledby="ds6bb93a7728-title ds6bb93a7728-desc"><title id="ds6bb93a7728-title">Every leaf reaches every spine</title><desc id="ds6bb93a7728-desc">A spine-leaf fabric: three spine switches across the top, four leaf switches under them, and a link from each leaf to each of the spines. The crossings are the content — twelve links is what 'every leaf reaches every spine' looks like.</desc><path d="M 195.808 60.85 L 221.054 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 215.189 60.85 L 290.928 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 195.905 60.85 L 195.905 78.85 L 397.509 78.85 L 397.509 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 265.682 60.85 L 240.435 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 285.063 60.85 L 310.309 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 304.445 60.85 L 380.183 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 335.555 60.85 L 259.817 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 354.937 60.85 L 329.691 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 374.318 60.85 L 399.565 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 444.095 60.85 L 444.095 90.85 L 242.491 90.85 L 242.491 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 424.811 60.85 L 349.072 108.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 444.192 60.85 L 418.946 108.85" fill="none" stroke="currentColor" stroke-width="1"/><rect x="153.489" y="24" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="186.117" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 1</tspan></text><rect x="242.745" y="24" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="275.372" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 2</tspan></text><rect x="332" y="24" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="364.628" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 3</tspan></text><rect x="421.255" y="24" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="453.883" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 4</tspan></text><rect x="198.117" y="108.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230.745" y="130.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 1</tspan></text><rect x="287.372" y="108.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="130.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 2</tspan></text><rect x="376.628" y="108.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="409.255" y="130.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 3</tspan></text><text x="320" y="189.912" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A link has no head and no direction, so the theme draws it as a chord rather than routing it.</tspan></text></svg>