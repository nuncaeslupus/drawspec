<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 180.7" role="img" aria-labelledby="dsc95d4ccce0-title dsc95d4ccce0-desc"><title id="dsc95d4ccce0-title">Every leaf reaches every spine</title><desc id="dsc95d4ccce0-desc">A spine-leaf fabric: three spine switches across the top, four leaf switches under them, and a link from each leaf to each of the spines. The crossings are the content — twelve links is what 'every leaf reaches every spine' looks like.</desc><path d="M 207.808 48.85 L 233.054 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 227.189 48.85 L 302.928 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 207.905 48.85 L 207.905 66.85 L 409.509 66.85 L 409.509 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 277.682 48.85 L 252.435 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 297.063 48.85 L 322.309 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 316.445 48.85 L 392.183 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 347.555 48.85 L 271.817 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 366.937 48.85 L 341.691 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 386.318 48.85 L 411.565 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 456.095 48.85 L 456.095 78.85 L 254.491 78.85 L 254.491 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 436.811 48.85 L 361.072 96.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 456.192 48.85 L 430.946 96.85" fill="none" stroke="currentColor" stroke-width="1"/><rect x="165.489" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="198.117" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 1</tspan></text><rect x="254.745" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="287.372" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 2</tspan></text><rect x="344" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="376.628" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 3</tspan></text><rect x="433.255" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="465.883" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 4</tspan></text><rect x="210.117" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="242.745" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 1</tspan></text><rect x="299.372" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 2</tspan></text><rect x="388.628" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="421.255" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 3</tspan></text><text x="332" y="153.912" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A link has no head and no direction, so the theme draws it as a chord rather than routing it.</tspan></text></svg>