<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.04 -1.04 666.08 687.205" role="img" aria-labelledby="dsdfb57cadf2-title dsdfb57cadf2-desc"><title id="dsdfb57cadf2-title">What a tide station can be doing</title><desc id="dsdfb57cadf2-desc">A state machine in a theme derived from a brand. The brand's accent marks the state that needs a person; the group frame and its dashes take the brand's muted grey, which they could lose in print and still be a group.</desc><rect x="73.862" y="196.281" width="432.037" height="176.781" rx="6" fill="currentColor" fill-opacity="0.05" stroke="#6b7a86" stroke-width="0.83" stroke-dasharray="6 3"/><text x="139.508" y="218.339" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Readings held back</tspan></text><path d="M 289.88 22 L 289.88 70" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="289.88,70 286.28,62 293.48,62" fill="currentColor" stroke="none"/><path d="M 277.691 125 L 277.691 270.422 L 181.871 270.422 L 181.871 306.062" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="181.871,306.062 178.271,298.062 185.471,298.062" fill="currentColor" stroke="none"/><path d="M 302.07 125 L 302.07 270.422 L 397.89 270.422 L 397.89 306.062" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="397.89,306.062 394.29,298.062 401.49,298.062" fill="currentColor" stroke="none"/><path d="M 289.88 373.062 L 289.88 444.344" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="289.88,444.344 286.28,436.344 293.48,436.344" fill="currentColor" stroke="none"/><path d="M 289.88 499.344 L 289.88 570.625" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="289.88,570.625 286.28,562.625 293.48,562.625" fill="currentColor" stroke="none"/><path d="M 289.88 609.125 L 289.88 657.125" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="289.88,657.125 286.28,649.125 293.48,649.125" fill="currentColor" stroke="none"/><path d="M 363.447 471.844 L 505.899 471.844 L 505.899 97.5 L 350.827 97.5" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="350.827,97.5 358.827,93.9 358.827,101.1" fill="currentColor" stroke="none"/><ellipse cx="289.88" cy="665.125" rx="8" ry="8" fill="none" stroke="currentColor" stroke-width="1.25"/><ellipse cx="289.88" cy="665.125" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.25"/><ellipse cx="289.88" cy="17" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.25"/><rect x="301.88" y="306.062" width="192.019" height="55" rx="6" fill="none" stroke="currentColor" stroke-width="1.25"/><text x="397.89" y="328.121" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Drifting</tspan></text><text x="397.89" y="344.621" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>out of step with its neighbours</tspan></text><rect x="85.862" y="306.062" width="192.019" height="55" rx="6" fill="none" stroke="currentColor" stroke-width="1.25"/><text x="181.871" y="328.121" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Gap</tspan></text><text x="181.871" y="344.621" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>no reading for an hour</tspan></text><rect x="228.934" y="70" width="121.894" height="55" rx="6" fill="none" stroke="currentColor" stroke-width="1.25"/><text x="289.88" y="92.058" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Reporting</tspan></text><text x="289.88" y="108.558" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>every six minutes</tspan></text><rect x="228.934" y="570.625" width="121.894" height="38.5" rx="6" fill="none" stroke="currentColor" stroke-width="1.25"/><text x="289.88" y="592.683" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Retired</tspan></text><rect x="216.314" y="444.344" width="147.132" height="55" rx="6" fill="none" stroke="#0f7b8a" stroke-width="2.08"/><text x="289.88" y="466.402" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Awaiting a visit</tspan></text><text x="289.88" y="482.902" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a technician is booked</tspan></text><text x="175.991" y="179.36" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">a reading is missed</text><text x="306.695" y="173.539" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">check fails</text><text x="306.695" y="185.18" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">[10 cm off]</text><text x="294.505" y="412.165" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">24 hours suspect</text><text x="294.505" y="538.446" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">site lost</text><text x="510.524" y="394.617" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">sensor replaced</text><text x="510.524" y="406.257" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-si