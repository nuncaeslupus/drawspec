<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.04 -1.04 666.08 687.205" role="img" aria-labelledby="ds822e0b0b48-title ds822e0b0b48-desc"><title id="ds822e0b0b48-title">What a tide station can be doing</title><desc id="ds822e0b0b48-desc">A state machine in a theme derived from a brand. The brand's accent marks the state that needs a person; the group frame and its dashes take the brand's muted grey, which they could lose in print and still be a group.</desc><rect x="67.862" y="196.281" width="432.037" height="176.781" rx="6" fill="currentColor" fill-opacity="0.05" stroke="#6b7a86" stroke-width="0.83" stroke-dasharray="6 3"/><text x="133.508" y="218.339" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Readings held back</tspan></text><path d="M 283.88 22 L 283.88 70" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="283.88,70 280.28,62 287.48,62" fill="currentColor" stroke="none"/><path d="M 271.691 125 L 271.691 270.422 L 175.871 270.422 L 175.871 306.062" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="175.871,306.062 172.271,298.062 179.471,298.062" fill="currentColor" stroke="none"/><path d="M 296.07 125 L 296.07 270.422 L 391.89 270.422 L 391.89 306.062" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="391.89,306.062 388.29,298.062 395.49,298.062" fill="currentColor" stroke="none"/><path d="M 283.88 373.062 L 283.88 444.344" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="283.88,444.344 280.28,436.344 287.48,436.344" fill="currentColor" stroke="none"/><path d="M 283.88 499.344 L 283.88 570.625" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="283.88,570.625 280.28,562.625 287.48,562.625" fill="currentColor" stroke="none"/><path d="M 283.88 609.125 L 283.88 657.125" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="283.88,657.125 280.28,649.125 287.48,649.125" fill="currentColor" stroke="none"/><path d="M 357.447 471.844 L 511.899 471.844 L 511.899 97.5 L 344.827 97.5" fill="none" stroke="currentColor" stroke-width="1.25"/><polygon points="344.827,97.5 352.827,93.9 352.827,101.1" fill="currentColor" stroke="none"/><ellipse cx="283.88" cy="665.125" rx="8" ry="8" fill="none" stroke="currentColor" stroke-width="1.25"/><ellipse cx="283.88" cy="665.125" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.25"/><ellipse cx="283.88" cy="17" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.25"/><rect x="295.88" y="306.062" width="192.019" height="55" rx="6" fill="none" stroke="currentColor" stroke-width="1.25"/><text x="391.89" y="328.121" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Drifting</tspan></text><text x="391.89" y="344.621" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>out of step with its neighbours</tspan></text><rect x="79.862" y="306.062" width="192.019" height="55" rx="6" fill="none" stroke="currentColor" stroke-width="1.25"/><text x="175.871" y="328.121" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Gap</tspan></text><text x="175.871" y="344.621" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>no reading for an hour</tspan></text><rect x="222.934" y="70" width="121.894" height="55" rx="6" fill="none" stroke="currentColor" stroke-width="1.25"/><text x="283.88" y="92.058" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Reporting</tspan></text><text x="283.88" y="108.558" font-family="