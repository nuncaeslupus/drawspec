<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 659.55" role="img" aria-labelledby="ds7971220924-title ds7971220924-desc"><title id="ds7971220924-title">From report to disclosure</title><desc id="ds7971220924-desc">A runbook for a privately reported vulnerability: the reporter, the security team and engineering each hold their own steps, and the hand-offs between them are the arrows that cross a lane. The fix goes back to engineering while the reporter still finds it exploitable.</desc><polygon points="228.761,12 422.221,12 422.221,645.05 228.761,645.05" fill="currentColor" fill-opacity="0.04" stroke="none"/><path d="M 42.67 48.85 L 621.33 48.85" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 228.761 12 L 228.761 645.05" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 422.221 12 L 422.221 645.05" fill="none" stroke="currentColor" stroke-width="1"/><text x="135.716" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Reporter</tspan></text><text x="325.491" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Security team</tspan></text><text x="518.951" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Engineering</tspan></text><path d="M 135.716 109.7 L 135.716 137.033 L 325.491 137.033 L 325.491 157.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="325.491,157.7 321.891,149.7 329.091,149.7" fill="currentColor" stroke="none"/><path d="M 325.491 209.4 L 325.491 257.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="325.491,257.4 321.891,249.4 329.091,249.4" fill="currentColor" stroke="none"/><path d="M 325.491 360.8 L 325.491 416.225" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="325.491,416.225 321.891,408.225 329.091,408.225" fill="currentColor" stroke="none"/><path d="M 339.29 350.46 L 339.29 381.467 L 518.951 381.467 L 518.951 408.8" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="518.951,408.8 515.351,400.8 522.551,400.8" fill="currentColor" stroke="none"/><path d="M 518.951 460.5 L 518.951 481.167 L 135.716 481.167 L 135.716 508.5" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="135.716,508.5 132.116,500.5 139.316,500.5" fill="currentColor" stroke="none"/><path d="M 135.716 545.35 L 135.716 566.017 L 518.951 566.017 L 518.951 593.35" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="518.951,593.35 515.351,585.35 522.551,585.35" fill="currentColor" stroke="none"/><path d="M 210.761 526.925 L 621.33 526.925 L 621.33 434.65 L 593.997 434.65" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 601.997 431.05 L 593.997 434.65 L 601.997 438.25" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="250.445" y="157.7" width="150.092" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="325.491" y="178.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Acknowledges within 2</tspan></text><text x="325.491" y="193.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>working days</tspan></text><rect x="246.761" y="416.225" width="157.46" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="325.491" y="437.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Explains why not</tspan></text><rect x="443.905" y="408.8" width="150.092" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="518.951" y="430.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Prepares a fix in a</tspan></text><text x="518.951" y="444.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>private branch</tspan></text><rect x="440.221" y="593.35" width="157.46" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="518.951" y="614.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Releases and</tspan></text><text x="518.951" y="629.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>publishes the advisory</tspan></text><rect x="75.078" y="72.85" width="121.275" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="135.716" y="94.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reports privately</tspan></text><polygon points="325.491,257.4 394.485,309.1 325.491,360.8 256.498,309.1" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="325.491" y="304.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is it a</tspan></text><text x="325.491" y="319.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>vulnerability?</tspan></text><rect x="60.67" y="508.5" width="150.092" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="135.716" y="529.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Confirms the fix</tspan></text><text x="308.285" y="391.974" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">no</text><text x="393.531" y="374.358" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">yes</text><text x="316.516" y="519.817" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">still exploitable</text></svg>