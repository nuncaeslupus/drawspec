olor" text-anchor="middle"><tspan>R/W</tspan></text><text x="452" y="48.874" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>N</tspan></text><text x="452" y="62.773" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="currentColor" text-anchor="middle"><tspan>R/W</tspan></text><text x="532" y="48.874" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Z</tspan></text><text x="532" y="62.773" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="currentColor" text-anchor="middle"><tspan>R/W</tspan></text><text x="612" y="48.874" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>C</tspan></text><text x="612" y="62.773" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="currentColor" text-anchor="middle"><tspan>R/W</tspan></text><text x="12" y="96.364" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">I</tspan></text><text x="31.206" y="96.364" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Global Interrupt Enable: set by SEI, cleared by CLI.</tspan></text><text x="12" y="114.214" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">T</tspan></text><text x="31.206" y="114.214" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Bit Copy Storage: the source and destination of BST and BLD.</tspan></text><text x="12" y="132.064" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">H</tspan></text><text x="31.206" y="132.064" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Half Carry Flag.</tspan></text><text x="12" y="149.914" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">S</tspan></text><text x="31.206" y="149.914" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Sign Bit: N exclusive-or V.</tspan></text><text x="12" y="167.764" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">V</tspan></text><text x="31.206" y="167.764" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Two's Complement Overflow Flag.</tspan></text><text x="12" y="185.614" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">N</tspan></text><text x="31.206" y="185.614" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Negative Flag.</tspan></text><text x="12" y="203.464" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Z</tspan></text><text x="31.206" y="203.464" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Zero Flag.</tspan></text><text x="12" y="221.314" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">C</tspan></text><text x="31.206" y="221.314" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Carry Flag.</tspan></text><text x="332" y="245.143" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>After the ATmega328P datasheet's status register (SREG). Every bit is 0 at reset.</tspan></text></svg>