<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 438.643" role="img" aria-labelledby="dseaba1c0fe3-title dseaba1c0fe3-desc"><title id="dseaba1c0fe3-title">The review loop</title><desc id="dseaba1c0fe3-desc">A change is drafted, reviewed, revised and merged, and what is learned feeds the next draft. One dashed shortcut goes back early: a revision that changed the shape of the thing is reviewed again rather than merged.</desc><path d="M 420.559 51.467 L 429.504 56.265 L 438.19 61.518 L 446.594 67.211 L 454.693 73.331 L 462.466 79.859 L 469.892 86.779 L 476.952 94.073 L 483.626 101.722 L 489.897 109.704 L 495.749 117.998 L 501.165 126.583 L 506.131 135.436" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="509.72,142.586 509.669,133.57 502.594,137.303" fill="currentColor" stroke="none"/><path d="M 525.46 190.768 L 527.677 205.575 L 528.762 220.508 L 528.71 235.48 L 527.52 250.405 L 525.199 265.196 L 524.053 270.054" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 519.817 285.884 L 517.225 294.037 L 511.618 307.92 L 504.973 321.336 L 497.327 334.209 L 488.725 346.464 L 479.216 358.029" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="473.784,363.901 482.207,360.685 476.225,355.373" fill="currentColor" stroke="none"/><path d="M 411.298 407.508 L 399.295 412.326 L 387.002 416.345 L 374.471 419.548 L 361.757 421.922 L 348.915 423.456 L 336 424.143 L 323.067 423.981 L 310.173 422.97 L 297.373 421.115 L 284.723 418.423 L 272.277 414.907 L 260.088 410.581" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="252.702,407.508 258.627,414.304 261.549,406.857" fill="currentColor" stroke="none"/><path d="M 190.216 363.901 L 180.245 352.732 L 171.153 340.837 L 162.99 328.285 L 155.805 315.15 L 149.639 301.506 L 144.527 287.434 L 140.5 273.013 L 137.58 258.329 L 135.785 243.464 L 135.124 228.507 L 135.602 213.542 L 137.216 198.657" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="138.54,190.768 133.258,198.075 141.173,199.239" fill="currentColor" stroke="none"/><path d="M 154.28 142.586 L 158.883 133.538 L 163.946 124.74 L 169.456 116.215 L 175.398 107.985 L 181.756 100.072 L 188.513 92.497 L 195.652 85.281 L 203.153 78.442 L 210.997 71.999 L 219.163 65.968 L 227.628 60.367 L 236.371 55.209" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="243.441,51.467 234.429,51.713 238.314,58.706" fill="currentColor" stroke="none"/><path d="M 453.709 368.158 L 480.492 285.73" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 485.822 269.325 L 510.785 192.499" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" stroke-dashoffset="103.92"/><polygon points="513.257,184.89 514.589,193.735 506.98,191.263" fill="currentColor" stroke="none"/><text x="498.017" y="281.247" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">if it changed shape</text><rect x="229.927" y="12" width="204.146" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Draft the change</tspan></text><rect x="417.17" y="148.04" width="204.146" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="519.243" y="169.273" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Review it against the plan</tspan></text><rect x="345.65" y="368.158" width="204.146" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="447.723" y="389.391" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Revise on what the review found</tspan></text><rect x="114.204" y="368.158" width="204.146" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="216.277" y="389.391" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Merge it</tspan></text><rect x="42.683" y="148.04" width="204.146" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="144.757" y="169.273" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Record what the round taught</tspan></text></svg>