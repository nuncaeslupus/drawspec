<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 433.35" role="img" aria-labelledby="ds5b94068e43-title ds5b94068e43-desc"><title id="ds5b94068e43-title">Every node role, drawn</title><desc id="ds5b94068e43-desc">The eleven roles a node may take, each drawn as the bundled default theme draws it: start and terminal are pills, with the terminal in a heavier line; a step is a plain rectangle; a decision is a diamond; emphasis is a rectangle at the heavier weight; a note has no outline at all; a group is a dashed rectangle; and the three flowchart symbols are a parallelogram for data in or out, a box with doubled sides for a process defined elsewhere, and a drum for where data rests; a person — a body under a round head — is a human, as against a system. An author names the role and the theme decides the shape, so a different theme draws this same document differently.</desc><polygon points="157.6,87.7 300.182,139.4 157.6,191.1 15.018,139.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="157.6" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">decision</tspan></text><text x="157.6" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a question with named ways out</tspan></text><rect x="456.163" y="113.55" width="192.819" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="552.572" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">emphasis</tspan></text><text x="552.572" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the one box that matters most</tspan></text><rect x="249.31" y="222.525" width="208.271" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="353.446" y="243.758" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">group</tspan></text><text x="353.446" y="258.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a container, drawn around others</tspan></text><polygon points="491.582,222.525 595.888,222.525 585.888,274.225 481.582,274.225" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="538.735" y="243.758" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">io</tspan></text><text x="538.735" y="258.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>data in or out</tspan></text><text x="146.711" y="236.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">note</tspan></text><text x="146.711" y="251.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>an aside, not part of the</tspan></text><text x="146.711" y="266.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>argument</tspan></text><polygon points="521.276,333.65 564.251,333.65 565.69,333.697 567.123,333.838 568.543,334.073 569.945,334.4 571.323,334.818 572.671,335.325 573.982,335.919 575.251,336.597 576.474,337.358 577.644,338.196 578.757,339.11 579.808,340.094 580.792,341.144 581.705,342.257 582.544,343.427 583.304,344.65 583.983,345.92 584.577,347.231 585.084,348.578 585.502,349.956 585.829,351.358 586.063,352.778 586.204,354.211 586.251,355.65 586.251,381.35 586.243,381.612 586.217,381.872 586.175,382.13 586.115,382.385 586.039,382.636 585.947,382.881 585.839,383.119 585.716,383.35 585.577,383.572 585.425,383.785 585.259,383.987 585.08,384.178 584.889,384.357 584.687,384.523 584.474,384.676 584.251,384.814 584