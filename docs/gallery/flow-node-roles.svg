<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 419.35" role="img" aria-labelledby="ds1f20ed5a67-title ds1f20ed5a67-desc"><title id="ds1f20ed5a67-title">Every node role, drawn</title><desc id="ds1f20ed5a67-desc">The seven roles a node may take, each drawn as the bundled default theme draws it: start and terminal are pills, with the terminal in a heavier line; a step is a plain rectangle; a decision is a diamond; emphasis is a rectangle at the heavier weight; a note has no outline at all; and a group is a dashed rectangle. An author names the role and the theme decides the shape, so a different theme draws this same document differently.</desc><polygon points="254.009,99.7 396.591,151.4 254.009,203.1 111.428,151.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="254.009" y="146.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">decision</tspan></text><text x="254.009" y="161.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a question with named ways out</tspan></text><rect x="132.992" y="234.525" width="192.819" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="229.401" y="255.758" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">emphasis</tspan></text><text x="229.401" y="270.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the one box that matters most</tspan></text><rect x="215.864" y="317.65" width="208.271" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="320" y="338.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">group</tspan></text><text x="320" y="353.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a container, drawn around others</tspan></text><text x="428.409" y="248.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">note</tspan></text><text x="428.409" y="263.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>an aside, not part of the</tspan></text><text x="428.409" y="278.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>argument</tspan></text><rect x="115.926" y="24" width="177.94" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="204.896" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">start</tspan></text><text x="204.896" y="60.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>where the diagram begins</tspan></text><rect x="317.865" y="24" width="206.209" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.97" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">step</tspan></text><text x="420.97" y="60.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the ordinary box, and the default</tspan></text><rect x="420.591" y="125.55" width="107.981" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="474.582" y="146.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">terminal</tspan></text><text x="474.582" y="161.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>where it ends</tspan></text><text x="320" y="413.562" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Say what the box is, not what it looks like — the shape follows.</tspan></text></svg>