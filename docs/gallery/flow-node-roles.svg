<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 423.35" role="img" aria-labelledby="ds3a6b4e87f0-title ds3a6b4e87f0-desc"><title id="ds3a6b4e87f0-title">Every node role, drawn</title><desc id="ds3a6b4e87f0-desc">The ten roles a node may take, each drawn as the bundled default theme draws it: start and terminal are pills, with the terminal in a heavier line; a step is a plain rectangle; a decision is a diamond; emphasis is a rectangle at the heavier weight; a note has no outline at all; a group is a dashed rectangle; and the three flowchart symbols are a parallelogram for data in or out, a box with doubled sides for a process defined elsewhere, and a drum for where data rests. An author names the role and the theme decides the shape, so a different theme draws this same document differently.</desc><polygon points="157.6,87.7 300.182,139.4 157.6,191.1 15.018,139.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="157.6" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">decision</tspan></text><text x="157.6" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a question with named ways out</tspan></text><rect x="456.163" y="113.55" width="192.819" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="552.572" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">emphasis</tspan></text><text x="552.572" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the one box that matters most</tspan></text><rect x="249.31" y="222.525" width="208.271" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="353.446" y="243.758" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">group</tspan></text><text x="353.446" y="258.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a container, drawn around others</tspan></text><polygon points="491.582,222.525 595.888,222.525 585.888,274.225 481.582,274.225" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="538.735" y="243.758" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">io</tspan></text><text x="538.735" y="258.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>data in or out</tspan></text><text x="146.711" y="236.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">note</tspan></text><text x="146.711" y="251.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>an aside, not part of the</tspan></text><text x="146.711" y="266.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>argument</tspan></text><rect x="127.926" y="12" width="177.94" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="216.896" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">start</tspan></text><text x="216.896" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>where the diagram begins</tspan></text><rect x="329.865" y="12" width="206.209" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.97" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">step</tspan></text><text x="432.97" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the ordinary box, and the default</tspan></text><polygon points="382.315,311.65 382.813,310.867 384.298,310.097 386.745,309.354 390.111,308.65 394.34,307.997 399.358,307.407 405.081,306.89 411.41,306.454 418.236,306.107 425.444,305.854 432.909,305.701 440.504,305.65 448.099,305.701 455.564,305.854 462.772,306.107 469.598,306.454 475.927,306.89 481.65,307.407 486.668,307.997 490.897,308.65 494.263,309.354 496.71,310.097 498.195,310.867 498.693,311.65 498.693,369.35 498.195,370.133 496.71,370.903 494.263,371.646 490.897,372.35 486.668,373.003 481.65,373.593 475.927,374.11 469.598,374.546 462.772,374.893 455.564,375.146 448.099,375.299 440.504,375.35 432.909,375.299 425.444,375.146 418.236,374.893 411.41,374.546 405.081,374.11 399.358,373.593 394.34,373.003 390.111,372.35 386.745,371.646 384.298,370.903 382.813,370.133 382.315,369.35" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 498.693 311.65 L 498.195 312.433 L 496.71 313.203 L 494.263 313.946 L 490.897 314.65 L 486.668 315.303 L 481.65 315.893 L 475.927 316.41 L 469.598 316.846 L 462.772 317.193 L 455.564 317.446 L 448.099 317.599 L 440.504 317.65 L 432.909 317.599 L 425.444 317.446 L 418.236 317.193 L 411.41 316.846 L 405.081 316.41 L 399.358 315.893 L 394.34 315.303 L 390.111 314.65 L 386.745 313.946 L 384.298 313.203 L 382.813 312.433 L 382.315 311.65" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="440.504" y="338.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">store</tspan></text><text x="440.504" y="353.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>where data rests</tspan></text><rect x="165.307" y="314.65" width="193.008" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 171.307 314.65 L 171.307 366.35" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 352.315 314.65 L 352.315 366.35" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="261.811" y="335.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">subroutine</tspan></text><text x="261.811" y="350.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a process defined elsewhere</tspan></text><rect x="324.182" y="113.55" width="107.981" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="378.172" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">terminal</tspan></text><text x="378.172" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>where it ends</tspan></text><text x="332" y="395.562" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Say what the box is, not what it looks like — the shape follows.</tspan></text></svg>