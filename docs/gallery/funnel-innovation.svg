<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 266.82" role="img" aria-labelledby="dsb3d50ee989-title dsb3d50ee989-desc"><title id="dsb3d50ee989-title">The innovation funnel</title><desc id="dsb3d50ee989-desc">Many ideas go in at the throat and few deployed solutions come out at the mouth. The dashed dividers are the gates each idea has to pass.</desc><polygon points="0,0 640,0 448,265.32 192,265.32" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 48 66.33 L 592 66.33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 96 132.66 L 544 132.66" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 144 198.99 L 496 198.99" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="320" y="35.973" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Many</tspan><tspan font-weight="bold"> ideas</tspan></text><text x="320" y="102.303" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Assessed and chosen</tspan></text><text x="320" y="168.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Validated</tspan></text><text x="320" y="234.963" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Deployed</tspan></text></svg>