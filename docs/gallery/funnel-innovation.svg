<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 266.82" role="img" aria-labelledby="dse9b9e5ead1-title dse9b9e5ead1-desc"><title id="dse9b9e5ead1-title">The innovation funnel</title><desc id="dse9b9e5ead1-desc">Many ideas go in at the throat and few deployed solutions come out at the mouth. Between each pair of stages is a gate, where an idea is carried on, sent back, or stopped.</desc><polygon points="0,0 640,0 448,265.32 192,265.32" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 48 66.33 L 295.598 66.33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 344.402 66.33 L 592 66.33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="320" y="70.138" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><path d="M 96 132.66 L 295.598 132.66" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 344.402 132.66 L 544 132.66" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="320" y="136.468" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><path d="M 144 198.99 L 295.598 198.99" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 344.402 198.99 L 496 198.99" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="320" y="202.798" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><text x="320" y="35.973" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Many</tspan><tspan font-weight="bold"> ideas</tspan></text><text x="320" y="102.303" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Assessed and chosen</tspan></text><text x="320" y="168.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Validated</tspan></text><text x="320" y="234.963" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Deployed</tspan></text></svg>