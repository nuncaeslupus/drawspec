<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 290.82" role="img" aria-labelledby="dsc689f04694-title dsc689f04694-desc"><title id="dsc689f04694-title">The innovation funnel</title><desc id="dsc689f04694-desc">Many ideas go in at the throat and few deployed solutions come out at the mouth. Between each pair of stages is a gate, where an idea is carried on, sent back, or stopped.</desc><polygon points="12,12 652,12 460,277.32 204,277.32" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 60 78.33 L 307.598 78.33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 356.402 78.33 L 604 78.33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="332" y="82.138" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><path d="M 108 144.66 L 307.598 144.66" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 356.402 144.66 L 556 144.66" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="332" y="148.468" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><path d="M 156 210.99 L 307.598 210.99" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 356.402 210.99 L 508 210.99" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="332" y="214.798" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><text x="332" y="47.973" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Many</tspan><tspan font-weight="bold"> ideas</tspan></text><text x="332" y="114.303" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Assessed and chosen</tspan></text><text x="332" y="180.633" font-family="'