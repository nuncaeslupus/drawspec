<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 148.625" role="img" aria-labelledby="ds00794c4670-title ds00794c4670-desc"><title id="ds00794c4670-title">The innovation funnel</title><desc id="ds00794c4670-desc">Many ideas go in at the throat and few deployed solutions come out at the mouth. The dashed dividers are the gates each idea has to pass.</desc><polygon points="0,0 640,44.138 640,102.987 0,147.125" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 160 11.034 L 160 136.091" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 320 22.069 L 320 125.056" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 480 33.103 L 480 114.022" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="80" y="76.371" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Many</tspan><tspan font-weight="bold"> ideas</tspan></text><text x="240" y="68.946" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Assessed and</tspan></text><text x="240" y="83.796" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>chosen</tspan></text><text x="400" y="76.371" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Validated</tspan></text><text x="560" y="76.371" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Deployed</tspan></text></svg>