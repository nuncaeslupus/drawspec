<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 208.1" role="img" aria-labelledby="ds4a70708e8e-title ds4a70708e8e-desc"><title id="ds4a70708e8e-title">Delivery confidence: the department's major projects</title><desc id="ds4a70708e8e-desc">Four projects, each with a delivery confidence rating and the reason for it, drawn in the accent theme so the marks are coloured as well as shaped and named.</desc><polygon points="228.85,13.753 234.67,23.647 223.03,23.647" fill="#d9a21b" stroke="currentColor" stroke-width="1.5"/><path d="M 12 51.7 L 652 51.7" fill="none" stroke="#7c8794" stroke-width="1"/><ellipse cx="228.85" cy="69.257" rx="4.85" ry="4.85" fill="#3e7a4a" stroke="currentColor" stroke-width="1.5"/><path d="M 12 86.55 L 652 86.55" fill="none" stroke="#7c8794" stroke-width="1"/><polygon points="224.582,99.839 233.118,99.839 233.118,108.375 224.582,108.375" fill="#c0452a" stroke="currentColor" stroke-width="1.5"/><path d="M 12 136.25 L 652 136.25" fill="none" stroke="#7c8794" stroke-width="1"/><ellipse cx="228.85" cy="153.807" rx="4.85" ry="4.85" fill="#3e7a4a" stroke="currentColor" stroke-width="1.5"/><text x="12" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">New</tspan><tspan font-weight="bold"> case</tspan><tspan font-weight="bold"> management</tspan></text><text x="12" y="38.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">system</tspan></text><text x="241.2" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Amber</tspan></text><text x="301.934" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Supplier testing is three months behind; the go-live window is</tspan></text><text x="301.934" y="38.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>still held.</tspan></text><text x="12" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Regional</tspan><tspan font-weight="bold"> offices</tspan><tspan font-weight="bold"> consolidation</tspan></text><text x="241.2" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Green</tspan></text><text x="301.934" y="72.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Two of three sites closed, on budget.</tspan></text><text x="12" y="107.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Apprenticeship</tspan><tspan font-weight="bold"> levy</tspan><tspan font-weight="bold"> portal</tspan></text><text x="241.2" y="107.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Red</tspan></text><text x="301.934" y="107.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Scope doubled after the policy change; a reset is going to the</tspan></text><text x="301.934" y="122.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>board in March.</tspan></text><text x="12" y="157.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Grants</tspan><tspan font-weight="bold"> payment</tspan><tspan font-weight="bold"> service</tspan></text><text x="241.2" y="157.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Green</tspan></text><text x="301.934" y="157.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>Live since June; benefits are being tracked.</tspan></text><text x="332" y="181.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Green: delivery highly likely. Amber: feasible, with significant issues to manage. Red: unachievable without major change.</tspan></text></svg>