<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 117.541" role="img" aria-labelledby="ds0484af4666-title ds0484af4666-desc"><title id="ds0484af4666-title">“I have worked here for three years”</title><desc id="ds0484af4666-desc">A tense line for a language class: a past action that is finished, and the present perfect running from three years ago up to now.</desc><path d="M 258.5 40.85 L 479 40.85" fill="none" stroke="currentColor" stroke-width="2.5"/><ellipse cx="258.5" cy="40.85" rx="4" ry="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><ellipse cx="479" cy="40.85" rx="4" ry="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M 12 76.9 L 652 76.9" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="12,76.9 20,73.3 20,80.5" fill="currentColor" stroke="none"/><polygon points="652,76.9 644,80.5 644,73.3" fill="currentColor" stroke="none"/><ellipse cx="479" cy="76.9" rx="5.2" ry="5.2" fill="currentColor" stroke="currentColor" stroke-width="2.5"/><ellipse cx="111.5" cy="76.9" rx="4" ry="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><text x="12" y="95.682" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor"><tspan>past</tspan></text><text x="652" y="95.682" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="end"><tspan>future</tspan></text><text x="111.5" y="63.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>“I worked in a shop”</tspan></text><text x="479" y="63.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">now</tspan></text><text x="368.75" y="28.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>“I have worked here”</tspan></text></svg>