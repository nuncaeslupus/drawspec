<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 355.95" role="img" aria-labelledby="ds8b9af5c57d-title ds8b9af5c57d-desc"><title id="ds8b9af5c57d-title">Should primary schools set homework?</title><desc id="ds8b9af5c57d-desc">A debating club's map: a hidden premise stated as a co-premise, an objection to it, and the evidence for each side.</desc><defs><pattern id="ds8b9af5c57d-hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M 0 5 L 5 0" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/></pattern></defs><path d="M 52.769 84.85 L 52.769 74.85 L 419.988 74.85 L 419.988 84.85" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 236.379 74.85 L 236.379 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="236.379,48.85 239.979,56.85 232.779,56.85" fill="currentColor" stroke="none"/><path d="M 465.981 84.85 L 465.981 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="465.981,48.85 469.581,56.85 462.381,56.85" fill="currentColor" stroke="none"/><path d="M 129.562 187.05 L 129.562 157.85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="129.562,153.05 133.162,161.05 125.962,161.05" fill="currentColor" stroke="none"/><path d="M 330.582 179.05 L 330.582 157.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="330.582,153.05 334.182,161.05 326.982,161.05" fill="currentColor" stroke="none"/><path d="M 536.02 179.05 L 536.02 157.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="536.02,153.05 539.62,161.05 532.42,161.05" fill="currentColor" stroke="none"/><path d="M 330.582 273.25 L 330.582 252.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="330.582,247.25 334.182,255.25 326.982,255.25" fill="currentColor" stroke="none"/><rect x="188.019" y="12" width="287.962" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="42.769" y="84.85" width="173.585" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="231.175" y="84.85" width="198.813" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="443.988" y="84.85" width="184.064" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="257.233" y="179.05" width="146.697" height="68.2" rx="4" fill="url(#ds8b9af5c57d-hatch)" stroke="currentColor" stroke-width="1.5"/><rect x="464.919" y="179.05" width="142.202" height="68.2" rx="4" fill="url(#ds8b9af5c57d-hatch)" stroke="currentColor" stroke-width="1.5"/><rect x="242.863" y="273.25" width="175.438" height="68.2" rx="4" fill="url(#ds8b9af5c57d-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Primary schools should set no homework</tspan></text><text x="54.769" y="105.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="129.562" y="122.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Studies find little gain from</tspan></text><text x="129.562" y="137.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>homework before age 11</tspan></text><text x="243.175" y="105.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="330.582" y="122.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Homework is only worth setting</tspan></text><text x="330.582" y="137.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>for what it adds to learning</tspan></text><text x="455.988" y="105.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="536.02" y="122.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>It widens gaps between</tspan></text><text x="536.02" y="137.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>homes with and without help</tspan></text><text x="47.948" y="199.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="129.562" y="216.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A review of primary-age trials</tspan></text><text x="269.233" y="199.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="330.582" y="216.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>It also builds the habit</tspan></text><text x="330.582" y="231.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>of working alone</tspan></text><text x="476.919" y="199.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="536.02" y="216.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Homework clubs give</tspan></text><text x="536.02" y="231.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>every child that help</tspan></text><text x="254.863" y="293.462" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="330.582" y="310.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reading at home builds</tspan></text><text x="330.582" y="325.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>that habit without set tasks</tspan></text></svg>