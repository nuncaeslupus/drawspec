dle"><tspan>Two anchor days</tspan></text><text x="361.4" y="95.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Team chooses</tspan></text><text x="567.2" y="60.683" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Office by default</tspan></text><text x="302.6" y="28.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>what the staff survey would accept</tspan></text></svg>