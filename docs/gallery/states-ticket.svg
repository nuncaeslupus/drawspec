<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 787.706" role="img" aria-labelledby="ds8b784d2123-title ds8b784d2123-desc"><title id="ds8b784d2123-title">The life of a support ticket</title><desc id="ds8b784d2123-desc">A ticket is opened, worked until it is resolved, and closed once the customer agrees or a week passes; while it is being worked it is either under investigation or waiting on the customer.</desc><rect x="85.913" y="192.981" width="412.69" height="285.113" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="135.312" y="214.214" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Being worked</tspan></text><path d="M 292.258 22 L 292.258 70" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="292.258,70 288.658,62 295.858,62" fill="currentColor" stroke="none"/><path d="M 292.258 273.113 L 292.258 321.113" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="292.258,321.113 288.658,313.113 295.858,313.113" fill="currentColor" stroke="none"/><path d="M 292.258 121.7 L 292.258 192.981" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="292.258,192.981 286.258,179.648 298.258,179.648" fill="currentColor" stroke="none"/><path d="M 292.258 357.962 L 292.258 429.244" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="292.258,429.244 288.658,421.244 295.858,421.244" fill="currentColor" stroke="none"/><path d="M 292.258 478.094 L 292.258 549.375" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="292.258,549.375 286.258,536.042 298.258,536.042" fill="currentColor" stroke="none"/><path d="M 279.38 601.075 L 279.38 672.356" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="279.38,672.356 273.38,659.023 285.38,659.023" fill="currentColor" stroke="none"/><path d="M 305.137 601.075 L 305.137 672.356" fill="none" stro