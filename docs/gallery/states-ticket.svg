ll="currentColor" text-anchor="middle"><tspan>Investigating</tspan></text><rect x="227.866" y="70" width="128.785" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="292.258" y="91.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Open</tspan></text><text x="292.258" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>nobody owns it yet</tspan></text><rect x="227.866" y="549.375" width="128.785" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="292.258" y="570.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Resolved</tspan></text><text x="292.258" y="585.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a fix is offered</tspan></text><rect x="212.59" y="429.244" width="159.335" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="292.258" y="450.477" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Waiting on the customer</tspan></text><text x="297.008" y="160.803" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">an agent takes it</text><text x="297.008" y="397.065" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">a question is sent</text><text x="297.008" y="517.196" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">a fix is found</text><text x="170.889" y="640.178" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">the customer agrees</text><text x="309.887" y="640.178" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">7 days pass</text><text x="333.121" y="313.429" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">the customer replies</text><text x="522.686" y="458.843" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">the fix fails</text><text x="97.913" y="445.31" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">3 days pass</text><text x="97.913" y="456.951" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">/ send a reminder</text></svg>