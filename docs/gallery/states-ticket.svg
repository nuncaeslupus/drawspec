<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 787.706" role="img" aria-labelledby="ds2f179c3730-title ds2f179c3730-desc"><title id="ds2f179c3730-title">The life of a support ticket</title><desc id="ds2f179c3730-desc">A ticket is opened, worked until it is resolved, and closed once the customer agrees or a week passes; while it is being worked it is either under investigation or waiting on the customer.</desc><rect x="81.913" y="192.981" width="412.69" height="285.113" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="131.312" y="214.214" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Being worked</tspan></text><path d="M 288.258 22 L 288.258 70" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="288.258,70 284.658,62 291.858,62" fill="currentColor" stroke="none"/><path d="M 288.258 273.113 L 288.258 321.113" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="288.258,321.113 284.658,313.113 291.858,313.113" fill="currentColor" stroke="none"/><path d="M 288.258 121.7 L 288.258 192.981" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="288.258,192.981 282.258,179.648 294.258,179.648" fill="currentColor" stroke="none"/><path d="M 288.258 357.962 L 288.258 429.244" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="288.258,429.244 284.658,421.244 291.858,421.244" fill="currentColor" stroke="none"/><path d="M 288.258 478.094 L 288.258 549.375" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="288.258,549.375 282.258,536.042 294.258,536.042" fill="currentColor" stroke="none"/><path d="M 275.38 601.075 L 275.38 672.356" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="275.38,672.356 269.38,659.023 281.38,659.023" fill="currentColor" stroke="none"/><path d="M 301.137 601.075 L 301.137 672.356" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="301.137,672.356 297.537,664.356 304.737,664.356" fill="currentColor" stroke="none"/><path d="M 288.258 709.206 L 288.258 757.206" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="288.258,757.206 284.658,749.206 291.858,749.206" fill="currentColor" stroke="none"/><path d="M 367.926 447.669 L 395.259 447.669 L 395.259 339.538 L 367.926 339.538" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="367.926,339.538 375.926,335.938 375.926,343.138" fill="currentColor" stroke="none"/><path d="M 352.65 575.225 L 521.936 575.225 L 521.936 335.538 L 494.603 335.538" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 502.603 331.938 L 494.603 335.538 L 502.603 339.138" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 208.59 456.881 L 187.257 456.881 L 187.257 438.456 L 208.59 438.456" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="208.59,438.456 200.59,442.056 200.59,434.856" fill="currentColor" stroke="none"/><ellipse cx="288.258" cy="765.206" rx="8" ry="8" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="288.258" cy="765.206" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><ellipse cx="288.258" cy="268.112" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><ellipse cx="288.258" cy="17" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><rect x="223.866" y="672.356" width="128.785" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="288.258" y="693.589" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Closed</tspan></text><rect x="208.59" y="321.112" width="159.335" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="288.258" y="342.346" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Investigating</tspan></text><rect x="223.866" y="70" width="128.785" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="288.258" y="91.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Open</tspan></text><text x="288.258" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>nobody owns it yet</tspan></text><rect x="223.866" y="549.375" width="128.785" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="288.258" y="570.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Resolved</tspan></text><text x="288.258" y="585.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a fix is offered</tspan></text><rect x="208.59" y="429.244" width="159.335" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="288.258" y="450.477" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Waiting on the customer</tspan></text><text x="293.008" y="160.803" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">an agent takes it</text><text x="293.008" y="397.065" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">a question is sent</text><text x="293.008" y="517.196" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">a fix is found</text><text x="166.889" y="640.178" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">the customer agrees</text><text x="305.887" y="640.178" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">7 days pass</text><text x="330.008" y="313.429" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">the customer replies</text><text x="526.686" y="458.843" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">the fix fails</text><text x="93.913" y="445.31" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">3 days pass</text><text x="93.913" y="456.951" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">/ send a reminder</text></svg>