<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 413.677" role="img" aria-labelledby="dsaa4d494fd8-title dsaa4d494fd8-desc"><title id="dsaa4d494fd8-title">Every click trains tomorrow's ranking</title><desc id="dsaa4d494fd8-desc">A recommender's feedback loop. Items are ranked, shown, clicked or skipped, and the model is retrained nightly. The interaction log is what the loop turns around: the clicks are written to it and the retraining reads from it, so both are spokes to the middle rather than steps.</desc><path d="M 415.642 51.616 L 426.855 58.237 L 437.547 65.67 L 447.659 73.874 L 457.135 82.805 L 465.924 92.413 L 473.977 102.647 L 481.249 113.448 L 487.702 124.759 L 493.299 136.516 L 498.009 148.656 L 501.808 161.111 L 504.673 173.814" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="505.963,181.708 508.605,173.079 500.741,174.549" fill="currentColor" stroke="none"/><path d="M 505.963 230.468 L 503.679 243.288 L 500.452 255.904 L 496.299 268.245 L 491.243 280.245 L 485.312 291.838 L 478.539 302.959 L 470.96 313.548 L 462.618 323.547 L 453.558 332.9 L 443.83 341.557 L 433.488 349.468 L 422.588 356.592" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="415.642,360.561 424.651,360.02 420.525,353.165" fill="currentColor" stroke="none"/><path d="M 248.358 360.561 L 237.145 353.94 L 226.453 346.507 L 216.341 338.303 L 206.865 329.372 L 198.076 319.763 L 190.023 309.53 L 182.751 298.729 L 176.298 287.418 L 170.701 275.661 L 165.991 263.521 L 162.192 251.065 L 159.327 238.363" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="158.037,230.468 155.395,239.098 163.259,237.628" fill="currentColor" stroke="none"/><path d="M 158.037 181.708 L 160.321 168.889 L 163.548 156.273 L 167.701 143.932 L 172.757 131.931 L 178.688 120.339 L 185.461 109.217 L 193.04 98.628 L 201.382 88.63 L 210.442 79.277 L 220.17 70.62 L 230.512 62.708 L 241.412 55.584" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="248.358,51.616 239.349,52.157 243.475,59.011" fill="currentColor" stroke="none"/><path d="M 332 363.327 L 332 232.513" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="332,224.513 336,232.513 328,232.513" fill="currentColor" stroke="none"/><text x="355.7" y="297.382" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">written</text><path d="M 280.028 206.088 L 246.942 206.088" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="238.942,206.088 246.942,202.088 246.942,210.088" fill="currentColor" stroke="none"/><text x="259.485" y="197.73" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">read</text><rect x="249.394" y="12" width="165.211" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Rank the candidate items</tspan></text><rect x="425.058" y="187.663" width="165.211" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="507.663" y="208.896" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Show the top ten</tspan></text><rect x="249.394" y="363.327" width="165.211" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="384.56" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>User clicks or skips</tspan></text><rect x="73.731" y="187.663" width="165.211" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="156.337" y="208.896" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Retrain the model nightly</tspan></text><rect x="280.028" y="187.663" width="103.943" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="208.896" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Interaction log</tspan></text></svg>