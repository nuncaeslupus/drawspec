<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 514.5" role="img" aria-labelledby="ds572e40f5a2-title ds572e40f5a2-desc"><title id="ds572e40f5a2-title">Five ways to handle a disagreement</title><desc id="ds572e40f5a2-desc">Thomas and Kilmann's grid: how much you press your own concern against how much you accommodate the other's. No ticks — the directions are the point, not the numbers.</desc><path d="M 21.641 21.641 L 21.641 480.359" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 21.641 480.359 L 618.359 480.359" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 21.641 251 L 618.359 251" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 320 21.641 L 320 480.359" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="320" y="499.642" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">How firmly you press your own concern</text><text x="9.282" y="251" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle" transform="rotate(-90 9.282 251)">How far you go to meet theirs</text><ellipse cx="127.51" cy="103.026" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="127.51" y="90.668" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Give way</text><ellipse cx="512.49" cy="103.026" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="512.49" y="90.668" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Work it out together</text><ellipse cx="320" cy="251" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="330" y="238.642" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Split the difference</text><ellipse cx="127.51" cy="398.974" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="127.51" y="386.615" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Step away</text><ellipse cx="512.49" cy="398.974" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="512.49" y="386.615" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Insist</text></svg>