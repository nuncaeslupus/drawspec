ographer reviews</tspan></text><text x="333.59" y="348.558" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the station</tspan></text><text x="226.41" y="340.962" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">yes</text><text x="358.715" y="273.612" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">no</text><text x="338.215" y="380.462" font-family="'Tidemark Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="10" fill="currentColor">constants corrected</text></svg>