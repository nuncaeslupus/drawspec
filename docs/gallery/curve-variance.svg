<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 456.8" role="img" aria-labelledby="ds3806e21234-title ds3806e21234-desc"><title id="ds3806e21234-title">Where a project has got to</title><desc id="ds3806e21234-desc">Three curves at one moment: what was planned to have been spent by now, what has been spent, and what has actually been earned. The two gaps are the point of the drawing — how far under the earned value is against what was spent, and how far behind it is against the plan — and neither of them is a point on the diagram.</desc><path d="M 33.641 33.641 L 33.641 377.159" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 33.641 377.159 L 591.888 377.159" fill="none" stroke="currentColor" stroke-width="1"/><text x="312.764" y="396.442" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Time</text><text x="21.282" y="205.4" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle" transform="rotate(-90 21.282 205.4)">Cost</text><path d="M 87.665 343.916 L 96.422 339.599 L 107.075 334.487 L 119.41 328.652 L 133.212 322.164 L 148.267 315.095 L 164.361 307.515 L 181.279 299.495 L 198.807 291.107 L 216.731 282.421 L 234.837 273.508 L 252.909 264.44 L 270.734 255.287 L 288.097 246.121 L 304.785 237.012 L 320.582 228.032 L 325.479 225.105" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><path d="M 328.744 223.154 L 335.274 219.252 L 349.543 210.211 L 364.137 200.49 L 378.939 190.221 L 393.835 179.537 L 408.709 168.568 L 423.445 157.447 L 430.285 152.186" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><path d="M 450.431 136.537 L 452.045 135.276 L 465.676 124.49 L 478.709 114.08 L 491.028 104.176 L 502.516 94.912 L 513.059 86.419 L 522.542 78.829 L 530.849 72.273 L 537.864 66.884" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><text x="547.864" y="70.346" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Planned</text><path d="M 87.665 343.916 L 92.297 341.065 L 97.715 337.731 L 103.858 333.951 L 110.667 329.761 L 118.083 325.198 L 126.046 320.298 L 134.497 315.097 L 143.377 309.633 L 152.626 303.942 L 162.185 298.059 L 171.994 292.023 L 181.995 285.869 L 192.128 279.634 L 202.333 273.354 L 212.552 267.066 L 222.724 260.806 L 233.404 254.234 L 245.067 247.057 L 257.535 239.386 L 270.628 231.328 L 284.171 222.995 L 297.983 214.495 L 311.888 205.939 L 325.707 197.435 L 339.263 189.094 L 352.376 181.024 L 364.87 173.336 L 376.566 166.139 L 387.286 159.543 L 396.851 153.657 L 405.085 148.59 L 411.808 144.453" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="421.808" y="147.915" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Spent</text><path d="M 87.665 343.916 L 92.297 342 L 97.715 339.736 L 103.858 337.154 L 110.667 334.284 L 118.083 331.158 L 126.046 327.805 L 134.497 324.256 L 143.377 320.541 L 152.626 316.691 L 162.185 312.736 L 171.994 308.707 L 181.995 304.633 L 192.128 300.547 L 202.333 296.477 L 212.552 292.454 L 222.724 288.509 L 233.404 284.434 L 245.067 280.042 L 257.535 275.392 L 270.628 270.546 L 284.171 265.564 L 297.983 260.509 L 311.888 255.439 L 325.707 250.418 L 339.263 245.504 L 352.376 240.759 L 355.601 239.594" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M 403.026 222.45 L 405.085 221.703 L 411.808 219.252" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="421.808" y="222.713" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Earned</text><path d="M 411.808 144.453 L 411.808 219.252" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 415.008 144.453 L 408.608 144.453" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 415.008 219.252 L 408.608 219.252" fill="none" stroke="currentColor" stroke-width="1"/><text x="452.039" y="184.385" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Cost variance</tspan></text><path d="M 411.808 219.252 L 335.274 219.252" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 411.808 222.452 L 411.808 216.052" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 335.274 222.452 L 335.274 216.052" fill="none" stroke="currentColor" stroke-width="1"/><text x="373.541" y="234.534" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Schedule variance</tspan></text><text x="332" y="429.012" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>One gap is measured down and the other along, which is why a span runs between two points rather than along an axis.</tspan></text></svg>