<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 422.8" role="img" aria-labelledby="ds535e0fa060-title ds535e0fa060-desc"><title id="ds535e0fa060-title">Where a project has got to</title><desc id="ds535e0fa060-desc">Three curves at one moment: what was planned to have been spent by now, what has been spent, and what has actually been earned. The two gaps are the point of the drawing — how far under the earned value is against what was spent, and how far behind it is against the plan — and neither of them is a point on the diagram.</desc><path d="M 21.641 21.641 L 21.641 365.159" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 21.641 365.159 L 579.888 365.159" fill="none" stroke="currentColor" stroke-width="1"/><text x="300.764" y="384.442" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Time</text><text x="9.282" y="193.4" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle" transform="rotate(-90 9.282 193.4)">Cost</text><path d="M 75.665 331.916 L 84.422 327.599 L 95.075 322.487 L 107.41 316.652 L 121.212 310.164 L 136.267 303.095 L 152.361 295.515 L 169.279 287.495 L 186.807 279.107 L 204.731 270.421 L 222.837 261.508 L 240.909 252.44 L 258.734 243.287 L 276.097 234.121 L 292.785 225.012 L 308.582 216.032 L 313.479 213.105" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><path d="M 316.744 211.154 L 323.274 207.252 L 337.543 198.211 L 352.137 188.49 L 366.939 178.221 L 381.835 167.537 L 396.709 156.568 L 411.445 145.447 L 418.285 140.186" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><path d="M 438.431 124.537 L 440.045 123.276 L 453.676 112.49 L 466.709 102.08 L 479.028 92.176 L 490.516 82.912 L 501.059 74.419 L 510.542 66.829 L 518.849 60.273 L 525.864 54.884" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><text x="535.864" y="58.346" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Planned</text><path d="M 75.665 331.916 L 80.297 329.065 L 85.715 325.731 L 91.858 321.951 L 98.667 317.761 L 106.083 313.198 L 114.046 308.298 L 122.497 303.097 L 131.377 297.633 L 140.626 291.942 L 150.185 286.059 L 159.994 280.023 L 169.995 273.869 L 180.128 267.634 L 190.333 261.354 L 200.552 255.066 L 210.724 248.806 L 221.404 242.234 L 233.067 235.057 L 245.535 227.386 L 258.628 219.328 L 272.171 210.995 L 285.983 202.495 L 299.888 193.939 L 313.707 185.435 L 327.263 177.094 L 340.376 169.024 L 352.87 161.336 L 364.566 154.139 L 375.286 147.543 L 384.851 141.657 L 393.085 136.59 L 399.808 132.453" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="409.808" y="135.915" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Spent</text><path d="M 75.665 331.916 L 80.297 330 L 85.715 327.736 L 91.858 325.154 L 98.667 322.284 L 106.083 319.158 L 114.046 315.805 L 122.497 312.256 L 131.377 308.541 L 140.626 304.691 L 150.185 300.736 L 159.994 296.707 L 169.995 292.633 L 180.128 288.547 L 190.333 284.477 L 200.552 280.454 L 210.724 276.509 L 221.404 272.434 L 233.067 268.042 L 245.535 263.392 L 258.628 258.546 L 272.171 253.564 L 285.983 248.509 L 299.888 243.439 L 313.707 238.418 L 327.263 233.504 L 340.376 228.759 L 343.601 227.594" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M 391.026 210.45 L 393.085 209.703 L 399.808 207.252" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="409.808" y="210.713" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Earned</text><path d="M 399.808 132.453 L 399.808 207.252" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 403.008 132.453 L 396.608 132.453" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 403.008 207.252 L 396.608 207.252" fill="none" stroke="currentColor" stroke-width="1"/><text x="440.039" y="172.385" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Cost variance</tspan></text><path d="M 399.808 207.252 L 323.274 207.252" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 399.808 210.452 L 399.808 204.052" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 323.274 210.452 L 323.274 204.052" fill="none" stroke="currentColor" stroke-width="1"/><text x="361.541" y="222.534" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Schedule variance</tspan></text><text x="320" y="417.012" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>One gap is measured down and the other along, which is why a span runs between two points rather than along an axis.</tspan></text></svg>