<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 192.1" role="img" aria-labelledby="ds79b6ad3915-title ds79b6ad3915-desc"><title id="ds79b6ad3915-title">The five stars of open data</title><desc id="ds79b6ad3915-desc">Tim Berners-Lee's scale: each star adds a condition to the one before it.</desc><rect x="12" y="78.55" width="108.8" height="66.55" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="66.4" y="107.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">★</tspan></text><text x="66.4" y="122.058" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>open licence</tspan></text><rect x="144.8" y="61.913" width="108.8" height="83.188" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="199.2" y="98.889" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">★★</tspan></text><text x="199.2" y="113.739" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>structured</tspan></text><rect x="277.6" y="45.275" width="108.8" height="99.825" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="83.146" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">★★★</tspan></text><text x="332" y="97.996" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>non-</tspan></text><text x="332" y="112.846" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>proprietary</tspan></text><rect x="410.4" y="28.638" width="108.8" height="116.463" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="464.8" y="82.252" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">★★★★</tspan></text><text x="464.8" y="97.102" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>URIs</tspan></text><rect x="543.2" y="12" width="108.8" height="133.1" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="597.6" y="73.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">★★★★★</tspan></text><text x="597.6" y="88.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>linked</tspan></text><text x="332" y="165.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Each star keeps everything the ones to its left require.</tspan></text></svg>