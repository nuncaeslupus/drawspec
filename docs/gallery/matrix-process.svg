<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 165.75" role="img" aria-labelledby="ds9e436b9fb4-title ds9e436b9fb4-desc"><title id="ds9e436b9fb4-title">What each phase produces</title><desc id="ds9e436b9fb4-desc">Four phases across the top, each with the thing it hands on underneath it. The phases run left to right; each phase produces the output below it; and the last one returns to the first. The grid places the cells and the arrows say how they are related, which is what a table on its own cannot.</desc><defs><pattern id="ds9e436b9fb4-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="currentColor" fill-opacity="0.4"/></pattern></defs><text x="195.127" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Plan</tspan></text><text x="325.662" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Do</tspan></text><text x="456.197" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Check</tspan></text><text x="586.732" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Act</tspan></text><text x="70.93" y="77.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The work</tspan></text><text x="70.93" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>What it hands on</tspan></text><polygon points="135.86,54.85 254.395,54.85 254.395,94.55 135.86,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="195.127" y="76.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Agree what good</tspan></text><text x="195.127" y="90.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>looks like</tspan></text><polygon points="266.395,54.85 384.93,54.85 384.93,94.55 266.395,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="325.662" y="77.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Make the change</tspan></text><polygon points="396.93,54.85 515.465,54.85 515.465,94.55 396.93,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="456.197" y="76.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Measure what</tspan></text><text x="456.197" y="90.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>happened</tspan></text><polygon points="527.465,54.85 646,54.85 646,94.55 527.465,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="586.873" y="77.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Keep it or undo it</tspan></text><polygon points="135.86,106.55 254.395,106.55 254.395,146.25 135.86,146.25" fill="url(#ds9e436b9fb4-dots)" stroke="currentColor" stroke-width="1.5"/><text x="195.127" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Criteria</tspan></text><polygon points="266.395,106.55 384.93,106.55 384.93,146.25 266.395,146.25" fill="url(#ds9e436b9fb4-dots)" stroke="currentColor" stroke-width="1.5"/><text x="325.662" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A change</tspan></text><polygon points="396.93,106.55 515.465,106.55 515.465,146.25 396.93,146.25" fill="url(#ds9e436b9fb4-dots)" stroke="currentColor" stroke-width="1.5"/><text x="456.197" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A number</tspan></text><p