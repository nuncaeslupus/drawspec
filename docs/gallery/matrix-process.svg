<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 141.75" role="img" aria-labelledby="ds0c89e01d7f-title ds0c89e01d7f-desc"><title id="ds0c89e01d7f-title">What each phase produces</title><desc id="ds0c89e01d7f-desc">Four phases across the top, each with the thing it hands on underneath it. The phases run left to right; each phase produces the output below it; and the last one returns to the first. The grid places the cells and the arrows say how they are related, which is what a table on its own cannot.</desc><defs><pattern id="ds0c89e01d7f-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="currentColor" fill-opacity="0.4"/></pattern></defs><text x="183.127" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Plan</tspan></text><text x="313.662" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Do</tspan></text><text x="444.197" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Check</tspan></text><text x="574.732" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Act</tspan></text><text x="58.93" y="65.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The work</tspan></text><text x="58.93" y="117.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>What it hands on</tspan></text><polygon points="123.86,42.85 242.395,42.85 242.395,82.55 123.86,82.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="183.127" y="64.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Agree what good</tspan></text><text x="183.127" y="78.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>looks like</tspan></text><polygon points="254.395,42.85 372.93,42.85 372.93,82.55 254.395,82.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="313.662" y="65.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Make the change</tspan></text><polygon points="384.93,42.85 503.465,42.85 503.465,82.55 384.93,82.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="444.197" y="64.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Measure what</tspan></text><text x="444.197" y="78.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>happened</tspan></text><polygon points="515.465,42.85 634,42.85 634,82.55 515.465,82.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="574.873" y="65.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Keep it or undo it</tspan></text><polygon points="123.86,94.55 242.395,94.55 242.395,134.25 123.86,134.25" fill="url(#ds0c89e01d7f-dots)" stroke="currentColor" stroke-width="1.5"/><text x="183.127" y="117.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Criteria</tspan></text><polygon points="254.395,94.55 372.93,94.55 372.93,134.25 254.395,134.25" fill="url(#ds0c89e01d7f-dots)" stroke="currentColor" stroke-width="1.5"/><text x="313.662" y="117.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A change</tspan></text><polygon points="384.93,94.55 503.465,94.55 503.465,134.25 384.93,134.25" fill="url(#ds0c89e01d7f-dots)" stroke="currentColor" stroke-width="1.5"/><text x="444.197" y="117.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A number</tspan></text><polygon