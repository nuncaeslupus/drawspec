<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 556.3" role="img" aria-labelledby="dsa7013b43b5-title dsa7013b43b5-desc"><title id="dsa7013b43b5-title">What is in scope</title><desc id="dsa7013b43b5-desc">The centre is fixed; the outer rings are where the arguments happen. The outermost ring names what it is and then says what that means; the two inside it only need naming, and are named the same way.</desc><ellipse cx="320" cy="265.65" rx="265.65" ry="265.65" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="320" cy="265.65" rx="177.1" ry="177.1" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="320" cy="265.65" rx="88.55" ry="88.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="32.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Everything a theme can</tspan></text><text x="320" y="47.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">express</tspan></text><text x="320" y="61.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>type, weight, shape, dash, fill</tspan></text><text x="320" y="128.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The nine diagram</tspan></text><text x="320" y="143.058" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">kinds</tspan></text><text x="320" y="261.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">One document, one</tspan></text><text x="320" y="275.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">SVG</tspan></text><text x="320" y="551.512" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Continuous consultation and review sit outside every ring.</tspan></text></svg>