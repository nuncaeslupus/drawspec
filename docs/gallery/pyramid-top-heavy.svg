<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 353.5" role="img" aria-labelledby="ds8dc3aff438-title ds8dc3aff438-desc"><title id="ds8dc3aff438-title">What a claim has to survive</title><desc id="ds8dc3aff438-desc">The apex is the narrowest level and carries the longest sentence, which is the case the sizing has to answer.</desc><polygon points="256,0 384,0 448,88 192,88" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="24.533" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A finding nobody</tspan></text><text x="320" y="39.383" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>has managed to</tspan></text><text x="320" y="54.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>refute after trying</tspan></text><text x="320" y="69.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>hard to</tspan></text><polygon points="192,88 448,88 512,176 128,176" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="134.808" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reviewed</tspan></text><polygon points="128,176 512,176 576,264 64,264" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="222.808" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Measured</tspan></text><polygon points="64,264 576,264 640,352 0,352" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="310.808" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Noticed</tspan></text></svg>