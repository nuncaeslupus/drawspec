<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 486.15" role="img" aria-labelledby="ds56c941c76c-title ds56c941c76c-desc"><title id="ds56c941c76c-title">The same critical path, with colour doing the pointing</title><desc id="ds56c941c76c-desc">The accent theme. Colour marks the run with no slack in it and the box that ends the job; it says nothing a black-and-white printer would lose, because the weight already said it.</desc><path d="M 292.74 75.7 L 292.74 99.7 L 241.787 99.7 L 241.787 123.7" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="241.787,123.7 235.787,110.367 247.787,110.367" fill="#c0452a" stroke="none"/><path d="M 318.261 75.7 L 318.261 99.7 L 369.215 99.7 L 369.215 123.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="369.215,123.7 365.615,115.7 372.815,115.7" fill="currentColor" stroke="none"/><path d="M 241.787 175.4 L 241.787 223.4" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="241.787,223.4 235.787,210.067 247.787,210.067" fill="#c0452a" stroke="none"/><path d="M 241.787 275.1 L 241.787 299.1 L 295.785 299.1 L 295.785 323.1" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="295.785,323.1 289.785,309.767 301.785,309.767" fill="#c0452a" stroke="none"/><path d="M 369.215 175.4 L 369.215 299.1 L 315.217 299.1 L 315.217 323.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="315.217,323.1 311.617,315.1 318.817,315.1" fill="currentColor" stroke="none"/><path d="M 305.501 374.8 L 305.501 422.8" fill="none" stroke="#7c8794" stroke-width="1"/><text x="305.501" y="444.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every hand-over is signed off</tspan></text><rect x="204.572" y="223.4" width="74.429" height="51.7" rx="4" fill="none" stroke="#c0452a" stroke-width="2.5"/><text x="241.787" y="244.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-ancho