<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 229.6" role="img" aria-labelledby="ds1e90c20ecf-title ds1e90c20ecf-desc"><title id="ds1e90c20ecf-title">Three degrees of going digital, by how deep the change cuts</title><desc id="ds1e90c20ecf-desc">The axis grows to the right: each degree changes more than the one before it. Above the line, what changes; below it, an example.</desc><path d="M 12 155.1 L 652 155.1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 110.667 145.1 L 110.667 159.1" fill="none" stroke="currentColor" stroke-width="1"/><rect x="12" y="78.55" width="197.333" height="66.55" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="110.667" y="107.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Digitising</tspan></text><text x="110.667" y="122.058" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>changes the medium</tspan></text><path d="M 332 145.1 L 332 159.1" fill="none" stroke="currentColor" stroke-width="1"/><rect x="233.333" y="45.275" width="197.333" height="99.825" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="83.146" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Digitalising</tspan></text><text x="332" y="97.996" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>changes the channel of the</tspan></text><text x="332" y="112.846" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>process</tspan></text><path d="M 553.333 145.1 L 553.333 159.1" fill="none" stroke="currentColor" stroke-width="1"/><rect x="454.667" y="12" width="197.333" height="133.1" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="553.333" y="66.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Digital transformation</tspan></text><text x="553.333" y="81.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>changes the service model,</tspan></text><text x="553.333" y="96.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the structure and the culture</tspan></text><text x="110.667" y="178.382" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>paper → file</tspan></text><text x="332" y="178.382" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>counter → online</tspan></text><text x="553.333" y="178.382" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>the errand disappears</tspan></text><text x="332" y="202.812" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>depth of the change to the organisation</tspan></text></svg>