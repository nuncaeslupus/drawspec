<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 420.1" role="img" aria-labelledby="dsb2c89201ce-title dsb2c89201ce-desc"><title id="dsb2c89201ce-title">What lives where</title><desc id="dsb2c89201ce-desc">Two racks and what is in each. Nothing happens after anything else here: the only relation is that a thing sits inside a container, and the drawing exists to show what belongs where.</desc><rect x="87.431" y="24" width="465.138" height="156.55" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="147.481" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The control plane</tspan></text><rect x="97.147" y="204.55" width="445.705" height="156.55" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="160.758" y="225.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every worker node</tspan></text><rect x="99.431" y="70.85" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="164.954" y="92.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>API server</tspan></text><rect x="332" y="131.7" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="397.523" y="152.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Cloud controller</tspan></text><rect x="183.432" y="312.25" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245.716" y="333.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Network plugin</tspan></text><rect x="176.954" y="131.7" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="242.477" y="152.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Controller manager</tspan></text><rect x="332" y="312.25" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="394.284" y="333.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Storage plugin</tspan></text><rect x="109.147" y="251.4" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="171.432" y="272.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Node agent</tspan></text><rect x="257.716" y="251.4" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="272.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Network proxy</tspan></text><rect x="406.284" y="251.4" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="468.568" y="272.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Container runtime</tspan></text><rect x="409.523" y="70.85" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="475.046" y="92.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Scheduler</tspan></text><rect x="254.477" y="70.85" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="92.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Key-value store</tspan></text><text x="320" y="405.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A set with no order is a shape, not a sequence — so it packs rather than ranks.</tspan></text></svg>