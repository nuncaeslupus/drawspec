<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 396.1" role="img" aria-labelledby="dsc75fb6cbf7-title dsc75fb6cbf7-desc"><title id="dsc75fb6cbf7-title">What lives where</title><desc id="dsc75fb6cbf7-desc">Two racks and what is in each. Nothing happens after anything else here: the only relation is that a thing sits inside a container, and the drawing exists to show what belongs where.</desc><rect x="99.431" y="12" width="465.138" height="156.55" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="159.481" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The control plane</tspan></text><rect x="34.863" y="192.55" width="594.273" height="156.55" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="98.474" y="213.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every worker node</tspan></text><rect x="111.431" y="58.85" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="176.954" y="80.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>API server</tspan></text><rect x="344" y="119.7" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="409.523" y="140.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Cloud controller</tspan></text><rect x="492.568" y="239.4" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="554.853" y="260.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Network plugin</tspan></text><rect x="188.954" y="119.7" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="254.477" y=