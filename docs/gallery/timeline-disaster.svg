<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 170.319" role="img" aria-labelledby="dsac1b402e2d-title dsac1b402e2d-desc"><title id="dsac1b402e2d-title">What an outage costs</title><desc id="dsac1b402e2d-desc">The same four moments, spaced by when they happened rather than evenly: the gap between the last backup and the failure is the data you lose, and the long stretch after it is the time you spend getting back. The clock runs under the line, and the named intervals under that — the maximum tolerable downtime is the recovery time and the work-recovery time together, which is what the two bars over one bar say.</desc><path d="M 0 57.839 L 640 57.839" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 32.4 47.839 L 32.4 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0" y="0" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="32.4" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Last</tspan></text><text x="32.4" y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>backup</tspan></text><path d="M 110.836 47.839 L 110.836 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="78.436" y="0" width="64.8" height="34.919" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="110.836" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">It fails</tspan></text><path d="M 424.582 47.839 L 424.582 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="392.182" y="0" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="424.582" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Systems</tspan></text><text x="424.582" y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>back</tspan></text><path d="M 607.6 47.839 L 607.6 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="575.2" y="0" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="607.6" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Working</tspan></text><text x="607.6" y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>again</tspan></text><text x="32.4" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>02:00</tspan></text><text x="110.836" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="424.582" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="424.582" y="91.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="607.6" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="607.6" y="91.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>22:00</tspan></text><path d="M 32.4 122.074 L 110.836 122.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 32.4 118.074 L 32.4 126.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 110.836 118.074 L 110.836 126.074" fill="none" stroke="currentColor" stroke-width="1"/><text x="71.618" y="113.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Data lost</tspan></text><path d="M 110.836 122.074 L 424.582 122.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 110.836 118.074 L 110.836 126.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 424.582 118.074 L 424.582 126.074" fill="none" stroke="currentColor" stroke-width="1"/><text x="267.709" y="113.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Recovery time</tspan></text><path d="M 424.582 122.074 L 607.6 122.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 424.582 118.074 L 424.582 126.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 607.6 118.074 L 607.6 126.074" fill="none" stroke="currentColor" stroke-width="1"/><text x="516.091" y="113.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Work recovery</tspan></text><path d="M 110.836 153.819 L 607.6 153.819" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 110.836 149.819 L 110.836 157.819" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 607.6 149.819 L 607.6 157.819" fill="none" stroke="currentColor" stroke-width="1"/><text x="359.218" y="145.15" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Maximum tolerable downtime</tspan></text></svg>