<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 194.319" role="img" aria-labelledby="ds1fa0adb744-title ds1fa0adb744-desc"><title id="ds1fa0adb744-title">What an outage costs</title><desc id="ds1fa0adb744-desc">The same four moments, spaced by when they happened rather than evenly: the gap between the last backup and the failure is the data you lose, and the long stretch after it is the time you spend getting back. The clock runs under the line, and the named intervals under that — the maximum tolerable downtime is the recovery time and the work-recovery time together, which is what the two bars over one bar say.</desc><path d="M 12 69.839 L 652 69.839" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 44.4 59.839 L 44.4 73.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="12" y="12" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="44.4" y="31.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Last</tspan></text><text x="44.4" y="44.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>backup</tspan></text><path d="M 122.836 59.839 L 122.836 73.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="90.436" y="12" width="64.8" height="34.919" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="122.836" y="31.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">It fails</tspan></text><path d="M 436.582 59.839 L 436.582 73.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="404.182" y="12" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="436.582" y="31.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Systems</tspan></text><text x="436.582" y="44.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>back</tspan></text><path d="M 619.6 59.839 L 619.6 73.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="587.2" y="12" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="619.6" y="31.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Working</tspan></text><text x="619.6" y="44.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>again</tspan></text><text x="44.4" y="91.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>02:00</tspan></text><text x="122.836" y="91.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="436.582" y="91.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="436.582" y="103.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="619.6" y="91.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="619.6" y="103.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>22:00</tspan></text><path d="M 44.4 134.074 L 122.836 134.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 44.4 130.074 L 44.4 138.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 122.836 130.074 L 122.836 138.074" fill="none" stroke="currentColor" stroke-width="1"/><text x="83.618" y="125.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Data lost</tspan></text><path d="M 122.836 134.074 L 436.582 134.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 122.836 130.074 L 122.836 138.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 436.582 130.074 L 436.582 138.074" fill="none" stroke="currentColor" stroke-width="1"/><text x="279.709" y="125.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Recovery time</tspan></text><path d="M 436.582 134.074 L 619.6 134.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 436.582 130.074 L 436.582 138.074" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 619.6 130.074 L 619.6 138.074" fill="none" stroke="currentColor" stroke-width="1"/><text x="528.091" y="125.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Work recovery</tspan></text><path d="M 122.836 165.819 L 619.6 165.819" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 122.836 161.819 L 122.836 169.819" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 619.6 161.819 L 619.6 169.819" fill="none" stroke="currentColor" stroke-width="1"/><text x="371.218" y="157.15" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Maximum tolerable downtime</tspan></text></svg>