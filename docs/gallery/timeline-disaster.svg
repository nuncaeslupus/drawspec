<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 96.829" role="img" aria-labelledby="ds5c201ce506-title ds5c201ce506-desc"><title id="ds5c201ce506-title">What an outage costs</title><desc id="ds5c201ce506-desc">The same four moments, spaced by when they happened rather than evenly: the gap between the last backup and the failure is the data you lose, and the long stretch after it is the time you spend getting back. The clock runs under the line.</desc><path d="M 0 57.839 L 640 57.839" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 32.4 47.839 L 32.4 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0" y="0" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="32.4" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Last</tspan></text><text x="32.4" y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>backup</tspan></text><path d="M 110.836 47.839 L 110.836 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="78.436" y="0" width="64.8" height="34.919" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="110.836" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">It fails</tspan></text><path d="M 424.582 47.839 L 424.582 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="392.182" y="0" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="424.582" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Systems</tspan></text><text x="424.582" y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>back</tspan></text><path d="M 607.6 47.839 L 607.6 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="575.2" y="0" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="607.6" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Working</tspan></text><text x="607.6" y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>again</tspan></text><text x="32.4" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>02:00</tspan></text><text x="110.836" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="424.582" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="424.582" y="91.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="607.6" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="607.6" y="91.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>22:00</tspan></text></svg>