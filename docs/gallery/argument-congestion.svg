<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 268.6" role="img" aria-labelledby="dsef648d475b-title dsef648d475b-desc"><title id="dsef648d475b-title">Should the city centre have a congestion charge?</title><desc id="dsef648d475b-desc">A policy brief's argument map: two reasons for a weekday charge, two objections, a reply to one, and the evidence under a reason.</desc><defs><pattern id="dsef648d475b-hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M 0 5 L 5 0" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/></pattern></defs><path d="M 99.626 76.85 L 99.626 62.85 L 192.753 62.85 L 192.753 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="192.753,48.85 196.353,56.85 189.153,56.85" fill="currentColor" stroke="none"/><path d="M 271.068 76.85 L 271.068 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="271.068,48.85 274.668,56.85 267.468,56.85" fill="currentColor" stroke="none"/><path d="M 442.019 76.85 L 442.019 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="442.019,48.85 445.619,56.85 438.419,56.85" fill="currentColor" stroke="none"/><path d="M 585.813 76.85 L 585.813 62.85 L 471.247 62.85 L 471.247 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="471.247,48.85 474.847,56.85 467.647,56.85" fill="currentColor" stroke="none"/><path d="M 99.626 179.05 L 99.626 149.85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="99.626,145.05 103.226,153.05 96.026,153.05" fill="currentColor" stroke="none"/><path d="M 442.019 171.05 L 442.019 149.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="442.019,145.05 445.619,153.05 438.419,153.05" fill="currentColor" stroke="none"/><rect x="182.753" y="12" width="298.494" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="38.308" y="76.85" width="122.635" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="189.488" y="76.85" width="163.16" height="53.35" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="377.704" y="76.85" width="128.629" height="68.2" rx="4" fill="url(#dsef648d475b-hatch)" stroke="currentColor" stroke-width="1.5"/><rect x="531.389" y="76.85" width="108.847" height="68.2" rx="4" fill="url(#dsef648d475b-hatch)" stroke="currentColor" stroke-width="1.5"/><rect x="366.648" y="171.05" width="150.742" height="83.05" rx="4" fill="url(#dsef648d475b-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Introduce a weekday charge for the centre</tspan></text><text x="50.308" y="97.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="99.626" y="114.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Cuts traffic and</tspan></text><text x="99.626" y="129.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>roadside pollution</tspan></text><text x="201.488" y="97.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="271.068" y="114.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Revenue funds the buses</tspan></text><text x="389.704" y="97.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="442.019" y="114.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Falls hardest on</tspan></text><text x="442.019" y="129.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>low-income drivers</tspan></text><text x="543.389" y="97.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="585.813" y="114.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Shops in the</tspan></text><text x="585.813" y="129.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>zone lose trade</tspan></text><text x="35.763" y="191.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="99.626" y="208.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Comparable cities saw</tspan></text><text x="99.626" y="223.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>double-digit traffic falls</tspan></text><text x="378.648" y="191.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="442.019" y="208.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Discounts for residents</tspan></text><text x="442.019" y="223.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>and care workers</tspan></text><text x="442.019" y="238.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>answer most of it</tspan></text></svg>