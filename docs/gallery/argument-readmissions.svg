<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 345.95" role="img" aria-labelledby="dsd759240e87-title dsd759240e87-desc"><title id="dsd759240e87-title">Does the follow-up call reduce readmissions?</title><desc id="dsd759240e87-desc">A research paper's discussion as an argument map: the trial result for the claim, two objections to it, a rebuttal of one, and a mechanism.</desc><defs><pattern id="dsd759240e87-hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M 0 5 L 5 0" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/></pattern></defs><path d="M 221.646 74.85 L 221.646 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="221.646,48.85 225.246,56.85 218.046,56.85" fill="currentColor" stroke="none"/><path d="M 490.897 74.85 L 490.897 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="490.897,48.85 494.497,56.85 487.297,56.85" fill="currentColor" stroke="none"/><path d="M 142.023 169.05 L 142.023 147.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="142.023,143.05 145.623,151.05 138.423,151.05" fill="currentColor" stroke="none"/><path d="M 301.269 169.05 L 301.269 147.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="301.269,143.05 304.869,151.05 297.669,151.05" fill="currentColor" stroke="none"/><path d="M 310.199 263.25 L 310.199 242.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="310.199,237.25 313.799,245.25 306.599,245.25" fill="currentColor" stroke="none"/><rect x="163.103" y="12" width="337.795" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="132.023" y="74.85" width="179.246" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="429.769" y="74.85" width="206.708" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="27.523" y="169.05" width="163.106" height="53.35" rx="4" fill="url(#dsd759240e87-hatch)" stroke="currentColor" stroke-width="1.5"/><rect x="244.641" y="169.05" width="131.116" height="68.2" rx="4" fill="url(#dsd759240e87-hatch)" stroke="currentColor" stroke-width="1.5"/><rect x="204.629" y="263.25" width="211.14" height="68.2" rx="4" fill="url(#dsd759240e87-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">A nurse call at 48 h reduces 30-day readmissions</tspan></text><text x="144.023" y="95.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="221.646" y="112.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Randomised trial: fewer</tspan></text><text x="221.646" y="127.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>readmissions in the call arm</tspan></text><text x="441.769" y="95.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="533.123" y="112.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Most avoided readmissions were</tspan></text><text x="533.123" y="127.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>medication errors the call caught</tspan></text><text x="39.523" y="189.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="109.076" y="206.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>One hospital, one season</tspan></text><text x="256.641" y="189.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="310.199" y="206.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Outcome assessors</tspan></text><text x="310.199" y="221.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>were not blinded</tspan></text><text x="216.629" y="283.462" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="310.199" y="300.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Readmission is read from records,</tspan></text><text x="310.199" y="315.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>not judged by an assessor</tspan></text></svg>