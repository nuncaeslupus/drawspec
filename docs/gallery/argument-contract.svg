<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 355.95" role="img" aria-labelledby="ds2e9d61bf8a-title ds2e9d61bf8a-desc"><title id="ds2e9d61bf8a-title">Did the email of 3 May form a contract?</title><desc id="ds2e9d61bf8a-desc">Law course notes: whether a contract was formed, with offer and acceptance as co-premises, an objection to the acceptance and its rebuttal.</desc><defs><pattern id="ds2e9d61bf8a-hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M 0 5 L 5 0" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.4"/></pattern></defs><path d="M 90.463 84.85 L 90.463 74.85 L 422.029 74.85 L 422.029 84.85" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 256.246 74.85 L 256.246 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="256.246,48.85 259.846,56.85 252.646,56.85" fill="currentColor" stroke="none"/><path d="M 463.894 84.85 L 463.894 53.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="463.894,48.85 467.494,56.85 460.294,56.85" fill="currentColor" stroke="none"/><path d="M 338.375 179.05 L 338.375 143" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="338.375,138.2 341.975,146.2 334.775,146.2" fill="currentColor" stroke="none"/><path d="M 338.375 273.25 L 338.375 255.25" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="338.375,247.25 344.375,260.583 332.375,260.583" fill="currentColor" stroke="none"/><rect x="190.106" y="12" width="283.788" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="80.463" y="84.85" width="151.155" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="244.721" y="84.85" width="187.308" height="53.35" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="451.132" y="84.85" width="132.405" height="68.2" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="245.64" y="179.05" width="185.471" height="68.2" rx="4" fill="url(#ds2e9d61bf8a-hatch)" stroke="currentColor" stroke-width="1.5"/><rect x="239.619" y="273.25" width="197.513" height="68.2" rx="4" fill="url(#ds2e9d61bf8a-hatch)" stroke="currentColor" stroke-width="2.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">A binding contract was formed on 3 May</tspan></text><text x="92.463" y="105.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="156.041" y="122.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The quote was an offer</tspan></text><text x="156.041" y="137.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>capable of acceptance</tspan></text><text x="256.721" y="105.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="338.375" y="122.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The buyer's email accepted it</tspan></text><text x="463.132" y="105.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">because</text><text x="517.334" y="122.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Price was agreed:</tspan></text><text x="517.334" y="137.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>consideration given</tspan></text><text x="257.64" y="199.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="338.375" y="216.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The email asked for a later</tspan></text><text x="338.375" y="231.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>delivery date: a counter-offer</tspan></text><text x="251.619" y="293.462" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">but</text><text x="338.375" y="310.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">It asked whether the date</tspan></text><text x="338.375" y="325.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">could move: a mere enquiry</tspan></text></svg>