<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 462.15" role="img" aria-labelledby="dsa917d6fc4a-title dsa917d6fc4a-desc"><title id="dsa917d6fc4a-title">The same critical path, with colour doing the pointing</title><desc id="dsa917d6fc4a-desc">The accent theme. Colour marks the run with no slack in it and the box that ends the job; it says nothing a black-and-white printer would lose, because the weight already said it.</desc><path d="M 304.74 63.7 L 304.74 87.7 L 253.787 87.7 L 253.787 111.7" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="253.787,111.7 247.787,98.367 259.787,98.367" fill="#c0452a" stroke="none"/><path d="M 330.261 63.7 L 330.261 87.7 L 381.215 87.7 L 381.215 111.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="381.215,111.7 377.615,103.7 384.815,103.7" fill="currentColor" stroke="none"/><path d="M 253.787 163.4 L 253.787 211.4" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="253.787,211.4 247.787,198.067 259.787,198.067" fill="#c0452a" stroke="none"/><path d="M 253.787 263.1 L 253.787 287.1 L 307.785 287.1 L 307.785 311.1" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="307.785,311.1 301.785,297.767 313.785,297.767" fill="#c0452a" stroke="none"/><path d="M 381.215 163.4 L 381.215 287.1 L 327.217 287.1 L 327.217 311.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="327.217,311.1 323.617,303.1 330.817,303.1" fill="currentColor" stroke="none"/><path d="M 317.501 362.8 L 317.501 410.8" fill="none" stroke="#7c8794" stroke-width="1"/><text x="317.501" y="432.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every hand-over is signed off</tspan></text><rect x="216.572" y="211.4" width="74.429" height="51.7" rx="4" fill="none" stroke="#c0452a" stroke-width="2.5"/><text x="253.787" y="232.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor= ill="currentColor" text-anchor="middle"><tspan font-weight="bold">3 weeks</tspan></text><text x="294.143" y="101.732" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">5 weeks of slack</text></svg>

<figcaption><b>flow-actor-handover</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 424.3" role="img" aria-labelledby="dsa00462311a-title dsa00462311a-desc"><title id="dsa00462311a-title">An incident, and whose each step is</title><desc id="dsa00462311a-desc">The same four steps `flow-bands` draws, said the other way round. There a band names something running *alongside* the steps and does not attribute any of them; here `actor` names who performs each one. The difference is not decoration: a band's bar spans its members' extent, so an owner holding the first, second and fourth step would draw a bar straight across the third — claiming a step it does not perform. Ownership is a property of one box, not a span over several, which is why it is a field on the node.</desc><path d="M 332 63.7 L 332 111.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,111.7 328.4,103.7 335.6,103.7" fill="currentColor" stroke="none"/><path d="M 332 163.4 L 332 211.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,211.4 328.4,203.4 335.6,203.4" fill="currentColor" stroke="none"/><path d="M 332 263.1 L 332 311.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,311.1 328.4,303.1 335.6,303.1" fill="currentColor" stroke="none"/><rect x="255.706" y="311.1" width="152.588" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="332" y="332.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The incident owner</tspan></text><text x="332" y="347.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Closed</tspan></text><rect x="256.498" y="211.4" width="151.005" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="232.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The on-call engineer</tspan></text><text x="332" y="247.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Contained</tspan></text><rect x="281.399" y="12" width="101.203" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Monitoring</tspan></text><text x="332" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Detected</tspan></text><rect x="256.498" y="111.7" width="151.005" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The on-call engineer</tspan></text><text x="332" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Triaged</tspan></text><text x="332" y="383.012" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Three owners across four steps, and the handovers are the two places the lead changes. Compare</tspan><tspan font-family="'DejaVu Sans Mono', monospace"> flow-bands</tspan><tspan> , where the</tspan></text><text x="332" y="396.512" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>bars accompany all four and attribute none.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-actors</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 523" role="img" aria-labelledby="dse5060e60f5-title dse5060e60f5-desc"><title id="dse5060e60f5-title">A release pipeline, and where it waits for a person</title><desc id="dse5060e60f5-desc">Five steps, four of them automatic and one not, and that distinction is the whole reason to draw it. `actor` says who performs a step and is orthogonal to `role`: every box here is a plain `step`, because they are all the same kind of step — what differs is whose. Encoding ownership as a role would have cost the role, which is what made `decision` (a diamond, implying a branch that is not there) and `emphasis` (this matters, which is a different fact) both wrong.</desc><path d="M 332 63.7 L 332 111.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,111.7 328.4,103.7 335.6,103.7" fill="currentColor" stroke="none"/><path d="M 332 163.4 L 332 211.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,211.4 328.4,203.4 335.6,203.4" fill="currentColor" stroke="none"/><path d="M 332 263.1 L 332 311.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,311.1 328.4,303.1 335.6,303.1" fill="currentColor" stroke="none"/><path d="M 332 362.8 L 332 410.8" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,410.8 328.4,402.8 335.6,402.8" fill="currentColor" stroke="none"/><rect x="261.691" y="311.1" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="332.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">A release manager</tspan></text><text x="332" y="347.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Sign off the release</tspan></text><rect x="261.691" y="12" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Build the artefact</tspan></text><rect x="261.691" y="410.8" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="432.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="446.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Deploy to production</tspan></text><rect x="261.691" y="211.4" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="232.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="247.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Deploy to staging</tspan></text><rect x="261.691" y="111.7" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Run the suite</tspan></text><text x="332" y="482.712" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>The actor is the box's lead, so the same words sit in the same place in every box and the odd one out is found by scanning one</tspan></text><text x="332" y="496.212" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>column rather than by reading five labels.</tspan></text></svg>

<figcaption><b>flow-bands</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 232.35" role="img" aria-labelledby="dsd69e897c72-title dsd69e897c72-desc"><title id="dsd69e897c72-title">An incident, and what runs alongside it</title><desc id="dsd69e897c72-desc">Four steps read across the page, with two continuous activities beside them: keeping the reporter informed, which runs above, and recording what was done, which runs below. Neither contains the steps and neither contains the other — they are peers, and a band is how that is said. A group could not: a box sits inside one container or none, so two groups over the same four boxes would have to nest, which draws a hierarchy that is not there.</desc><path d="M 179.786 91.925 L 227.786 91.925" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="227.786,91.925 219.786,95.525 219.786,88.325" fill="currentColor" stroke="none"/><path d="M 308 91.925 L 356 91.925" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,91.925 348,95.525 348,88.325" fill="currentColor" stroke="none"/><path d="M 436.214 91.925 L 484.214 91.925" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="484.214,91.925 476.214,95.525 476.214,88.325" fill="currentColor" stroke="none"/><rect x="484.214" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="524.321" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Closed</tspan></text><rect x="356" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="396.107" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Contained</tspan></text><rect x="99.572" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="139.679" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Detected</tspan></text><rect x="227.786" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="267.893" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Triaged</tspan></text><path d="M 99.572 49.5 L 564.428 49.5" fill="none" stroke="currentColor" stroke-width="1"/><text x="332" y="22.212" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Keeping the reporter informed</tspan></text><path d="M 99.572 134.35 L 564.428 134.35" fill="none" stroke="currentColor" stroke-width="1"/><text x="332" y="168.562" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Recording what was done</tspan></text><text x="332" y="192.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A band accompanies its members; a group contains them. The bar spans what it names and the words sit outside it, so a long</tspan></text><text x="332" y="205.562" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>name never reaches back over the boxes.</tspan></text></svg>
</figure><figure>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 233.05" role="img" aria-labelledby="dsd71276514e-title dsd71276514e-desc"><title id="dsd71276514e-title">What a post is defined by</title><desc id="dsd71276514e-desc">A post is the subject: the unit that contains it, the function that describes it, the cost centre it is charged to and the person who holds it are all defined by their relation to it. There is no sequence between them and no hierarchy — the four relations are peers, and the reading starts in the middle.</desc><path d="M 332 48.85 L 332 96.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,96.85 328.4,88.85 335.6,88.85" fill="currentColor" stroke="none"/><path d="M 370.931 115.275 L 418.931 115.275" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="418.931,115.275 410.931,118.875 410.931,111.675" fill="currentColor" stroke="none"/><path d="M 396.69 200.125 L 407.811 200.125 L 407.811 118.96 L 370.931 118.96" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="370.931,118.96 378.931,115.36 378.931,122.56" fill="currentColor" stroke="none"/><path d="M 245.069 115.275 L 293.069 115.275" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="293.069,115.275 285.069,118.875 285.069,111.675" fill="currentColor" stroke="none"/><rect x="418.931" y="96.85" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="483.621" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The cost centre</tspan></text><rect x="267.31" y="181.7" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="202.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The person</tspan></text><rect x="293.069" y="96.85" width="77.861" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="332" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The post</tspan></text><rect x="115.688" y="96.85" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="180.379" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The job description</tspan></text><rect x="267.31" y="12" width="129.381" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The unit</tspan></text><text x="336.75" y="76.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">contains</text><text x="382.348" y="89.167" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">charged to</text><text x="412.561" y="163.004" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">holds</text><text x="245.166" y="89.167" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">describes</text></svg>
</figure><figure>

"140.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Controller manager</tspan></text><rect x="269.716" y="300.25" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="321.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Storage plugin</tspan></text><rect x="46.863" y="239.4" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="109.147" y="260.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Node agent</tspan></text><rect x="195.432" y="239.4" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="257.716" y="260.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Network proxy</tspan></text><rect x="344" y="239.4" width="124.568" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="406.284" y="260.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Container runtime</tspan></text><rect x="421.523" y="58.85" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="487.046" y="80.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Scheduler</tspan></text><rect x="266.477" y="58.85" width="131.046" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="80.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Key-value store</tspan></text><text x="332" y="369.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A set with no order is a shape, not a sequence — so it packs rather than ranks.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-mesh</b> <span>flow</span></figcaption>

="287.372" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 2</tspan></text><rect x="344" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="376.628" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 3</tspan></text><rect x="433.255" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="465.883" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 4</tspan></text><rect x="210.117" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="242.745" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 1</tspan></text><rect x="299.372" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 2</tspan></text><rect x="388.628" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="421.255" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 3</tspan></text><text x="332" y="153.912" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A link has no head and no direction, so the theme draws it as a chord rather than routing it.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-node-roles</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 329.65" role="img" aria-labelledby="dsba72e0025e-title dsba72e0025e-desc"><title id="dsba72e0025e-title">Every node role, drawn</title><desc id="dsba72e0025e-desc">The seven roles a node may take, each drawn as the bundled default theme draws it: start and terminal are pills, with the terminal in a heavier line; a step is a plain rectangle; a decision is a diamond; emphasis is a rectangle at the heavier weight; a note has no outline at all; and a group is a dashed rectangle. An author names the role and the theme decides the shape, so a different theme draws this same document differently.</desc><polygon points="157.6,87.7 300.182,139.4 157.6,191.1 15.018,139.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="157.6" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">decision</tspan></text><text x="157.6" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a question with named ways out</tspan></text><rect x="456.163" y="113.55" width="192.819" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="552.572" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">emphasis</tspan></text><text x="552.572" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the one box that matters most</tspan></text><rect x="318.463" y="222.525" width="208.271" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="422.599" y="243.758" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">group</tspan></text><text x="422.599" y="258.608" font-family="'DejaVu Sans', sans-serif" fon "332" y="301.862" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Say what the box is, not what it looks like — the shape follows.</tspan></text></svg>
</figure><figure>

-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Continuous consultation and review sit outside every ring.</tspan></text></svg>
</figure><figure>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 352.15" role="img" aria-labelledby="ds4a042cedad-title ds4a042cedad-desc"><title id="ds4a042cedad-title">A box that is a name over what belongs to it</title><desc id="ds4a042cedad-desc">The same lead-and-detail every label may carry, separated by a rule instead of by weight. A blank-free newline in `text` is the author saying these are two things; `[box] lead` is the theme saying what separates them, and this theme says a line. It is what a class, a record or a component is drawn as by hand — a name, a rule, and the things under it. Who performs a step is the same shape and has its own field: see `actor` and `flow-actors`, which puts the name in the lead so a document does not have to write it into the label.</desc><path d="M 342.205 103.4 L 342.205 127.4 L 219.145 127.4 L 219.145 151.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="219.145,151.4 215.545,147.4 219.145,143.4 222.745,147.4" fill="currentColor" stroke="none"/><path d="M 353.91 103.4 L 353.91 151.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="353.91,151.4 350.31,147.4 353.91,143.4 357.51,147.4" fill="currentColor" stroke="none"/><path d="M 365.615 103.4 L 365.615 127.4 L 488.674 127.4 L 488.674 151.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="488.674,151.4 485.074,147.4 488.674,143.4 492.274,147.4" fill="currentColor" stroke="none"/><path d="M 219.145 227.95 L 219.145 275.95" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 215.545 267.95 L 219.145 275.95 L 222.745 267.95" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="163.763" y="151.4" width="110.765" height="76.55" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 163.763 181.25 L 274.527 181.25" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.145" y="172.633" font-family="'DejaVu Sans', sans-serif" font-size="
