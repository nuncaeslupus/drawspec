<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 462.15" role="img" aria-labelledby="ds882016b813-title ds882016b813-desc"><title id="ds882016b813-title">The same critical path, with colour doing the pointing</title><desc id="ds882016b813-desc">The accent theme. Colour marks the run with no slack in it and the box that ends the job; it says nothing a black-and-white printer would lose, because the weight already said it.</desc><path d="M 304.74 63.7 L 304.74 87.7 L 253.787 87.7 L 253.787 111.7" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="253.787,111.7 247.787,98.367 259.787,98.367" fill="#c0452a" stroke="none"/><path d="M 330.261 63.7 L 330.261 87.7 L 381.215 87.7 L 381.215 111.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="381.215,111.7 377.615,103.7 384.815,103.7" fill="currentColor" stroke="none"/><path d="M 253.787 163.4 L 253.787 211.4" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="253.787,211.4 247.787,198.067 259.787,198.067" fill="#c0452a" stroke="none"/><path d="M 253.787 263.1 L 253.787 287.1 L 307.785 287.1 L 307.785 311.1" fill="none" stroke="#c0452a" stroke-width="2.5"/><polygon points="307.785,311.1 301.785,297.767 313.785,297.767" fill="#c0452a" stroke="none"/><path d="M 381.215 163.4 L 381.215 287.1 L 327.217 287.1 L 327.217 311.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="327.217,311.1 323.617,303.1 330.817,303.1" fill="currentColor" stroke="none"/><path d="M 317.501 362.8 L 317.501 410.8" fill="none" stroke="#7c8794" stroke-width="1"/><text x="317.501" y="432.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every hand-over is signed off</tspan></text><rect x="216.572" y="211.4" width="74.429" height="51.7" rx="4" fill="none" stroke="#c0452a" stroke-width="2.5"/><text x="253.787" y="232.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Build</tspan></text><text x="253.787" y="247.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">8 weeks</tspan></text><rect x="216.572" y="111.7" width="74.429" height="51.7" rx="4" fill="none" stroke="#c0452a" stroke-width="2.5"/><text x="253.787" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Design</tspan></text><text x="253.787" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">3 weeks</tspan></text><rect x="268.921" y="311.1" width="97.159" height="51.7" rx="25.85" fill="none" stroke="#c0452a" stroke-width="2.5"/><text x="317.501" y="332.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Hand over</tspan></text><text x="317.501" y="347.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">4 weeks</tspan></text><rect x="315.001" y="111.7" width="132.426" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="381.215" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Apply for permits</tspan></text><text x="381.215" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>6 weeks</tspan></text><rect x="253.697" y="12" width="127.607" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="317.501" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Survey the site</tspan></text><text x="317.501" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">3 weeks</tspan></text><text x="294.143" y="101.732" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">5 weeks of slack</text></svg>
</figure><figure>
<figcaption><b>flow-actor-handover</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 424.3" role="img" aria-labelledby="ds4546847484-title ds4546847484-desc"><title id="ds4546847484-title">An incident, and whose each step is</title><desc id="ds4546847484-desc">The same four steps `flow-bands` draws, said the other way round. There a band names something running *alongside* the steps and does not attribute any of them; here `actor` names who performs each one. The difference is not decoration: a band's bar spans its members' extent, so an owner holding the first, second and fourth step would draw a bar straight across the third — claiming a step it does not perform. Ownership is a property of one box, not a span over several, which is why it is a field on the node.</desc><path d="M 332 63.7 L 332 111.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,111.7 328.4,103.7 335.6,103.7" fill="currentColor" stroke="none"/><path d="M 332 163.4 L 332 211.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,211.4 328.4,203.4 335.6,203.4" fill="currentColor" stroke="none"/><path d="M 332 263.1 L 332 311.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,311.1 328.4,303.1 335.6,303.1" fill="currentColor" stroke="none"/><rect x="255.706" y="311.1" width="152.588" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="332" y="332.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The incident owner</tspan></text><text x="332" y="347.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Closed</tspan></text><rect x="256.498" y="211.4" width="151.005" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="232.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The on-call engineer</tspan></text><text x="332" y="247.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Contained</tspan></text><rect x="281.399" y="12" width="101.203" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Monitoring</tspan></text><text x="332" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Detected</tspan></text><rect x="256.498" y="111.7" width="151.005" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The on-call engineer</tspan></text><text x="332" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Triaged</tspan></text><text x="332" y="383.012" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Three owners across four steps, and the handovers are the two places the lead changes. Compare</tspan><tspan font-family="'DejaVu Sans Mono', monospace"> flow-bands</tspan><tspan> , where the</tspan></text><text x="332" y="396.512" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>bars accompany all four and attribute none.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-actors</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 523" role="img" aria-labelledby="dsc148355210-title dsc148355210-desc"><title id="dsc148355210-title">A release pipeline, and where it waits for a person</title><desc id="dsc148355210-desc">Five steps, four of them automatic and one not, and that distinction is the whole reason to draw it. `actor` says who performs a step and is orthogonal to `role`: every box here is a plain `step`, because they are all the same kind of step — what differs is whose. Encoding ownership as a role would have cost the role, which is what made `decision` (a diamond, implying a branch that is not there) and `emphasis` (this matters, which is a different fact) both wrong.</desc><path d="M 332 63.7 L 332 111.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,111.7 328.4,103.7 335.6,103.7" fill="currentColor" stroke="none"/><path d="M 332 163.4 L 332 211.4" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,211.4 328.4,203.4 335.6,203.4" fill="currentColor" stroke="none"/><path d="M 332 263.1 L 332 311.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,311.1 328.4,303.1 335.6,303.1" fill="currentColor" stroke="none"/><path d="M 332 362.8 L 332 410.8" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="332,410.8 328.4,402.8 335.6,402.8" fill="currentColor" stroke="none"/><rect x="261.691" y="311.1" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="332.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">A release manager</tspan></text><text x="332" y="347.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Sign off the release</tspan></text><rect x="261.691" y="12" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Build the artefact</tspan></text><rect x="261.691" y="410.8" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="432.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="446.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Deploy to production</tspan></text><rect x="261.691" y="211.4" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="232.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="247.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Deploy to staging</tspan></text><rect x="261.691" y="111.7" width="140.617" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">CI</tspan></text><text x="332" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Run the suite</tspan></text><text x="332" y="482.712" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>The actor is the box's lead, so the same words sit in the same place in every box and the odd one out is found by scanning one</tspan></text><text x="332" y="496.212" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>column rather than by reading five labels.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-bands</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 232.35" role="img" aria-labelledby="dsfdadb28dd7-title dsfdadb28dd7-desc"><title id="dsfdadb28dd7-title">An incident, and what runs alongside it</title><desc id="dsfdadb28dd7-desc">Four steps read across the page, with two continuous activities beside them: keeping the reporter informed, which runs above, and recording what was done, which runs below. Neither contains the steps and neither contains the other — they are peers, and a band is how that is said. A group could not: a box sits inside one container or none, so two groups over the same four boxes would have to nest, which draws a hierarchy that is not there.</desc><path d="M 179.786 91.925 L 227.786 91.925" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="227.786,91.925 219.786,95.525 219.786,88.325" fill="currentColor" stroke="none"/><path d="M 308 91.925 L 356 91.925" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,91.925 348,95.525 348,88.325" fill="currentColor" stroke="none"/><path d="M 436.214 91.925 L 484.214 91.925" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="484.214,91.925 476.214,95.525 476.214,88.325" fill="currentColor" stroke="none"/><rect x="484.214" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="524.321" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Closed</tspan></text><rect x="356" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="396.107" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Contained</tspan></text><rect x="99.572" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="139.679" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Detected</tspan></text><rect x="227.786" y="73.5" width="80.214" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="267.893" y="94.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Triaged</tspan></text><path d="M 99.572 49.5 L 564.428 49.5" fill="none" stroke="currentColor" stroke-width="1"/><text x="332" y="22.212" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Keeping the reporter informed</tspan></text><path d="M 99.572 134.35 L 564.428 134.35" fill="none" stroke="currentColor" stroke-width="1"/><text x="332" y="168.562" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Recording what was done</tspan></text><text x="332" y="192.062" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A band accompanies its members; a group contains them. The bar spans what it names and the words sit outside it, so a long</tspan></text><text x="332" y="205.562" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>name never reaches back over the boxes.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-critical-path</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 377.3" role="img" aria-labelledby="ds4a7360dfc4-title ds4a7360dfc4-desc"><title id="ds4a7360dfc4-title">The path that decides the date</title><desc id="ds4a7360dfc4-desc">A small project network. The heavy arrows are the critical path — the run of tasks with no slack, where a day lost is a day lost on the whole project.</desc><path d="M 304.74 63.7 L 304.74 87.7 L 253.787 87.7 L 253.787 111.7" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="253.787,111.7 247.787,98.367 259.787,98.367" fill="currentColor" stroke="none"/><path d="M 253.787 163.4 L 253.787 211.4" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="253.787,211.4 247.787,198.067 259.787,198.067" fill="currentColor" stroke="none"/><path d="M 253.787 263.1 L 253.787 287.1 L 307.785 287.1 L 307.785 311.1" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="307.785,311.1 301.785,297.767 313.785,297.767" fill="currentColor" stroke="none"/><path d="M 330.261 63.7 L 330.261 87.7 L 381.215 87.7 L 381.215 111.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="381.215,111.7 377.615,103.7 384.815,103.7" fill="currentColor" stroke="none"/><path d="M 381.215 163.4 L 381.215 287.1 L 327.217 287.1 L 327.217 311.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="327.217,311.1 323.617,303.1 330.817,303.1" fill="currentColor" stroke="none"/><rect x="216.572" y="211.4" width="74.429" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="253.787" y="232.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Build</tspan></text><text x="253.787" y="247.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">8 weeks</tspan></text><rect x="216.572" y="111.7" width="74.429" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="253.787" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Design</tspan></text><text x="253.787" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">3 weeks</tspan></text><rect x="268.921" y="311.1" width="97.159" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="317.501" y="332.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Hand over</tspan></text><text x="317.501" y="347.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">4 weeks</tspan></text><rect x="315.001" y="111.7" width="132.426" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="381.215" y="132.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Apply for permits</tspan></text><text x="381.215" y="147.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>6 weeks</tspan></text><rect x="253.697" y="12" width="127.607" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="317.501" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Survey the site</tspan></text><text x="317.501" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">3 weeks</tspan></text><text x="294.143" y="101.732" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">5 weeks of slack</text></svg>
</figure><figure>
<figcaption><b>flow-edge-roles</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 461.95" role="img" aria-labelledby="ds988cb29f77-title ds988cb29f77-desc"><title id="ds988cb29f77-title">Every edge role, drawn</title><desc id="ds988cb29f77-desc">The seven roles a connector may take, each drawn between a pair of boxes: flow is the ordinary arrow; strong is the same relation at a heavier weight; link has no head at all and is the one role the default theme draws as a straight chord rather than routing; exchange has a head at both ends; weak is dashed with an open head; owns carries a diamond; and aside is dashed with no head, which is the pairing none of the other six could make. The head, the weight, the dash and the routing all follow from the role.</desc><path d="M 308 30.425 L 356 30.425" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,30.425 348,34.025 348,26.825" fill="currentColor" stroke="none"/><path d="M 308 91.275 L 356 91.275" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="356,91.275 342.667,97.275 342.667,85.275" fill="currentColor" stroke="none"/><path d="M 308 152.125 L 356 152.125" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 308 212.975 L 356 212.975" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,212.975 348,216.575 348,209.375" fill="currentColor" stroke="none"/><polygon points="308,212.975 316,209.375 316,216.575" fill="currentColor" stroke="none"/><path d="M 308 273.825 L 356 273.825" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 348 277.425 L 356 273.825 L 348 270.225" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 308 334.675 L 356 334.675" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,334.675 352,338.275 348,334.675 352,331.075" fill="currentColor" stroke="none"/><path d="M 308 395.525 L 356 395.525" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><r 4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="287.372" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 2</tspan></text><rect x="344" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="376.628" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 3</tspan></text><rect x="433.255" y="12" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="465.883" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Leaf 4</tspan></text><rect x="210.117" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="242.745" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 1</tspan></text><rect x="299.372" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 2</tspan></text><rect x="388.628" y="96.85" width="65.255" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="421.255" y="118.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Spine 3</tspan></text><text x="332" y="153.912" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>A link has no head and no direction, so the theme draws it as a chord rather than routing it.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-node-roles</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 329.65" role="img" aria-labelledby="ds67f50b8ae0-title ds67f50b8ae0-desc"><title id="ds67f50b8ae0-title">Every node role, drawn</title><desc id="ds67f50b8ae0-desc">The seven roles a node may take, each drawn as the bundled default theme draws it: start and terminal are pills, with the terminal in a heavier line; a step is a plain rectangle; a decision is a diamond; emphasis is a rectangle at the heavier weight; a note has no outline at all; and a group is a dashed rectangle. An author names the role and the theme decides the shape, so a different theme draws this same document differently.</desc><polygon points="157.6,87.7 300.182,139.4 157.6,191.1 15.018,139.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="157.6" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">decision</tspan></text><text x="157.6" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a question with named ways out</tspan></text><rect x="456.163" y="113.55" width="192.819" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="552.572" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">emphasis</tspan></text><text x="552.572" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the one box that matters most</tspan></text><rect x="318.463" y="222.525" width="208.271" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/><text x="422.599" y="243.758" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">group</tspan></text><text x="422.599" y="258.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a container, drawn around others</tspan></text><text x="215.864" y="236.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">note</tspan></text><text x="215.864" y="251.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>an aside, not part of the</tspan></text><text x="215.864" y="266.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>argument</tspan></text><rect x="127.926" y="12" width="177.94" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="216.896" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">start</tspan></text><text x="216.896" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>where the diagram begins</tspan></text><rect x="329.865" y="12" width="206.209" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.97" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">step</tspan></text><text x="432.97" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the ordinary box, and the default</tspan></text><rect x="324.182" y="113.55" width="107.981" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="378.172" y="134.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">terminal</tspan></text><text x="378.172" y="149.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>where it ends</tspan></text><text x="332" y="301.862" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Say what the box is, not what it looks like — the shape follows.</tspan></text></svg>
</figure><figure>
<figcaption><b>flow-triage</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 269.9" role="img" aria-labelledby="dsc4a39eb74a-title dsc4a39eb74a-desc"><title id="dsc4a39eb74a-title">Triaging a report</title><desc id="dsc4a39eb74a-desc">The smallest flow that is still a flow: something arrives, one question is asked about it, and it goes one of two ways. The reference set's other flows are large on purpose — this one exists to be read whole.</desc><path d="M 320.951 48.85 L 320.951 96.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="320.951,96.85 317.351,88.85 324.551,88.85" fill="currentColor" stroke="none"/><path d="M 304.957 163.18 L 304.957 194.55 L 247.041 194.55 L 247.041 218.55" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="247.041,218.55 243.441,210.55 250.641,210.55" fill="currentColor" stroke="none"/><path d="M 336.944 163.18 L 336.944 194.55 L 394.86 194.55 L 394.86 218.55" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="394.86,218.55 391.26,210.55 398.46,210.55" fill="currentColor" stroke="none"/><rect x="264.503" y="12" width="112.896" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320.951" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A report arrives</tspan></text><rect x="321.901" y="218.55" width="145.917" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="394.86" y="239.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Ask for the document</tspan></text><rect x="196.182" y="218.55" width="101.72" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="247.041" y="239.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Schedule a fix</tspan></text><polygon points="320.951,96.85 400.919,133.7 320.951,170.55 240.982,133.7" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320.951" y="136.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Does it reproduce?</tspan></text><text x="267.359" y="187.442" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">yes</text><text x="359.674" y="187.442" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">no</text></svg>
</figure><figure>
<figcaption><b>flow-validation</b> <span>flow</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 535.85" role="img" aria-labelledby="dsf91c26bfa2-title dsf91c26bfa2-desc"><title id="dsf91c26bfa2-title">Request validation</title><desc id="dsf91c26bfa2-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 308.89 48.85 L 308.89 96.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="308.89,96.85 305.29,88.85 312.49,88.85" fill="currentColor" stroke="none"/><path d="M 285.163 163.18 L 285.163 194.55 L 308.89 194.55 L 308.89 218.55" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="308.89,218.55 305.29,210.55 312.49,210.55" fill="currentColor" stroke="none"/><path d="M 332.617 163.18 L 332.617 194.55 L 453.139 194.55 L 453.139 345.95 L 379.049 345.95 L 379.049 369.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="379.049,369.95 375.449,361.95 382.649,361.95" fill="currentColor" stroke="none"/><path d="M 285.163 311.61 L 285.163 349.663 L 224.114 349.663 L 224.114 377.375" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="224.114,377.375 220.514,369.375 227.714,369.375" fill="currentColor" stroke="none"/><path d="M 332.617 311.61 L 332.617 357.95 L 408.284 357.95 L 408.284 369.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="408.284,369.95 404.684,361.95 411.884,361.95" fill="currentColor" stroke="none"/><path d="M 239.315 414.225 L 239.315 469.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="239.315,469.65 235.715,461.65 242.915,461.65" fill="currentColor" stroke="none"/><path d="M 400.715 421.65 L 413.804 469.65" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 311.78 495.5 L 323.78 495.5 L 323.78 441.938 L 311.78 441.938 L 311.78 333.95 L 441.139 333.95 L 441.139 30.425 L 365.37 30.425" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 373.37 26.825 L 365.37 30.425 L 373.37 34.025" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="252.41" y="12" width="112.96" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="308.89" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Request arrives</tspan></text><text x="420.853" y="490.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every rejection is audited,</tspan></text><text x="420.853" y="505.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>including the reason given</tspan></text><polygon points="308.89,218.55 427.524,270.25 308.89,321.95 190.256,270.25" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="308.89" y="265.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the caller authorised for</tspan></text><text x="308.89" y="280.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>this resource?</tspan></text><rect x="151.648" y="377.375" width="144.93" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="224.114" y="398.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Queue for processing</tspan></text><rect x="166.849" y="469.65" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="239.315" y="490.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Record the outcome</tspan></text><text x="239.315" y="505.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>against the request id</tspan></text><rect x="320.579" y="369.95" width="146.175" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="393.666" y="391.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reject with a reason</tspan></text><text x="393.666" y="406.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the caller can act on</tspan></text><polygon points="308.89,96.85 427.524,133.7 308.89,170.55 190.256,133.7" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="308.89" y="136.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the payload well formed?</tspan></text><text x="221.531" y="182.327" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">well formed</text><text x="457.889" y="273.712" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">malformed</text><text x="227.917" y="342.554" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">authorised</text><text x="337.367" y="352.144" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">refused</text><text x="445.889" y="140.121" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">next request</text></svg>
</figure><figure>
<figcaption><b>funnel-innovation</b> <span>funnel</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 290.82" role="img" aria-labelledby="dsc689f04694-title dsc689f04694-desc"><title id="dsc689f04694-title">The innovation funnel</title><desc id="dsc689f04694-desc">Many ideas go in at the throat and few deployed solutions come out at the mouth. Between each pair of stages is a gate, where an idea is carried on, sent back, or stopped.</desc><polygon points="12,12 652,12 460,277.32 204,277.32" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 60 78.33 L 307.598 78.33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 356.402 78.33 L 604 78.33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="332" y="82.138" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><path d="M 108 144.66 L 307.598 144.66" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 356.402 144.66 L 556 144.66" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="332" y="148.468" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><path d="M 156 210.99 L 307.598 210.99" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 356.402 210.99 L 508 210.99" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="332" y="214.798" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle">gate</text><text x="332" y="47.973" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Many</tspan><tspan font-weight="bold"> ideas</tspan></text><text x="332" y="114.303" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Assessed and chosen</tspan></text><text x="332" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Validated</tspan></text><text x="332" y="246.963" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Deployed</tspan></text></svg>
</figure><figure>
<figcaption><b>matrix-process</b> <span>matrix</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 165.75" role="img" aria-labelledby="ds9e436b9fb4-title ds9e436b9fb4-desc"><title id="ds9e436b9fb4-title">What each phase produces</title><desc id="ds9e436b9fb4-desc">Four phases across the top, each with the thing it hands on underneath it. The phases run left to right; each phase produces the output below it; and the last one returns to the first. The grid places the cells and the arrows say how they are related, which is what a table on its own cannot.</desc><defs><pattern id="ds9e436b9fb4-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="currentColor" fill-opacity="0.4"/></pattern></defs><text x="195.127" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Plan</tspan></text><text x="325.662" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Do</tspan></text><text x="456.197" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Check</tspan></text><text x="586.732" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Act</tspan></text><text x="70.93" y="77.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The work</tspan></text><text x="70.93" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>What it hands on</tspan></text><polygon points="135.86,54.85 254.395,54.85 254.395,94.55 135.86,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="195.127" y="76.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Agree what good</tspan></text><text x="195.127" y="90.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>looks like</tspan></text><polygon points="266.395,54.85 384.93,54.85 384.93,94.55 266.395,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="325.662" y="77.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Make the change</tspan></text><polygon points="396.93,54.85 515.465,54.85 515.465,94.55 396.93,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="456.197" y="76.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Measure what</tspan></text><text x="456.197" y="90.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>happened</tspan></text><polygon points="527.465,54.85 646,54.85 646,94.55 527.465,94.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="586.873" y="77.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Keep it or undo it</tspan></text><polygon points="135.86,106.55 254.395,106.55 254.395,146.25 135.86,146.25" fill="url(#ds9e436b9fb4-dots)" stroke="currentColor" stroke-width="1.5"/><text x="195.127" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Criteria</tspan></text><polygon points="266.395,106.55 384.93,106.55 384.93,146.25 266.395,146.25" fill="url(#ds9e436b9fb4-dots)" stroke="currentColor" stroke-width="1.5"/><text x="325.662" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A change</tspan></text><polygon points="396.93,106.55 515.465,106.55 515.465,146.25 396.93,146.25" fill="url(#ds9e436b9fb4-dots)" stroke="currentColor" stroke-width="1.5"/><text x="456.197" y="129.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A number</tspan></text><p "><tspan>A</tspan></text><polygon points="362.466,85.7 507.233,85.7 507.233,122.55 362.466,122.55" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="434.849" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="507.233,85.7 652,85.7 652,122.55 507.233,122.55" fill="url(#ds5a9e70d33a-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="579.616" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="72.932,122.55 217.699,122.55 217.699,159.4 72.932,159.4" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="145.315" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="217.699,122.55 362.466,122.55 362.466,159.4 217.699,159.4" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="290.082" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="362.466,122.55 507.233,122.55 507.233,159.4 362.466,159.4" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="434.849" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>C</tspan></text><polygon points="507.233,122.55 652,122.55 652,159.4 507.233,159.4" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="579.616" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>P</tspan></text><polygon points="72.932,159.4 217.699,159.4 217.699,196.25 72.932,196.25" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="145.315" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="217.699,159.4 362.466,159.4 362.466,196.25 217.699,196.25" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="290.082" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="362.466,159.4 507.233,159.4 507.233,196.25 362.466,196.25" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="434.849" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>P</tspan></text><polygon points="507.233,159.4 652,159.4 652,196.25 507.233,196.25" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="579.616" y="180.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Q</tspan></text><polygon points="12,206.832 30.858,206.832 30.858,217.309 12,217.309" fill="url(#ds5a9e70d33a-dots)" stroke="currentColor" stroke-width="1.5"/><text x="35.858" y="215.532" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">A block of this stripe's data</text><polygon points="182.015,206.832 200.873,206.832 200.873,217.309 182.015,217.309" fill="url(#ds5a9e70d33a-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="205.873" y="215.532" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">A copy of a block on another disk</text><polygon points="382.836,206.832 401.694,206.832 401.694,217.309 382.836,217.309" fill="url(#ds5a9e70d33a-grid)" stroke="currentColor" stroke-width="1.5"/><text x="406.694" y="215.532" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Parity, computed from the blocks beside it</text></svg>

<figcaption><b>pyramid-evidence</b> <span>pyramid</span></figcaption>

</figure><figure>
<figcaption><b>pyramid-top-heavy</b> <span>pyramid</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 377.5" role="img" aria-labelledby="dsd44352a4d9-title dsd44352a4d9-desc"><title id="dsd44352a4d9-title">What a claim has to survive</title><desc id="dsd44352a4d9-desc">The apex is the narrowest level and carries the longest sentence, which is the case the sizing has to answer.</desc><polygon points="268,12 396,12 460,100 204,100" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="36.533" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A finding nobody</tspan></text><text x="332" y="51.383" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>has managed to</tspan></text><text x="332" y="66.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>refute after trying</tspan></text><text x="332" y="81.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>hard to</tspan></text><polygon points="204,100 460,100 524,188 140,188" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="146.808" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reviewed</tspan></text><polygon points="140,188 524,188 588,276 76,276" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="234.808" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Measured</tspan></text><polygon points="76,276 588,276 652,364 12,364" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="322.808" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Noticed</tspan></text></svg>
</figure><figure>
<figcaption><b>quadrant-conflict</b> <span>quadrant</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 538.5" role="img" aria-labelledby="dsa2a17f6761-title dsa2a17f6761-desc"><title id="dsa2a17f6761-title">Five ways to handle a disagreement</title><desc id="dsa2a17f6761-desc">Thomas and Kilmann's grid: how much you press your own concern against how much you accommodate the other's. No ticks — the directions are the point, not the numbers.</desc><path d="M 33.641 33.641 L 33.641 492.359" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 33.641 492.359 L 630.359 492.359" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 33.641 263 L 630.359 263" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 332 33.641 L 332 492.359" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="332" y="511.642" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">How firmly you press your own concern</text><text x="21.282" y="263" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle" transform="rotate(-90 21.282 263)">How far you go to meet theirs</text><ellipse cx="139.51" cy="115.026" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="139.51" y="102.668" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Give way</text><ellipse cx="524.49" cy="115.026" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="524.49" y="102.668" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Work it out together</text><ellipse cx="332" cy="263" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="342" y="250.642" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Split the difference</text><ellipse cx="139.51" cy="410.974" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="139.51" y="398.615" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Step away</text><ellipse cx="524.49" cy="410.974" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="524.49" y="398.615" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Insist</text></svg>
</figure><figure>
<figcaption><b>rings-scope</b> <span>rings</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 590.3" role="img" aria-labelledby="ds675b354d09-title ds675b354d09-desc"><title id="ds675b354d09-title">What is in scope</title><desc id="ds675b354d09-desc">The centre is fixed; the outer rings are where the arguments happen. The outermost ring names what it is and then says what that means; the two inside it only need naming, and are named the same way.</desc><ellipse cx="332" cy="277.65" rx="265.65" ry="265.65" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="332" cy="277.65" rx="177.1" ry="177.1" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="332" cy="277.65" rx="88.55" ry="88.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="44.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Everything a theme can</tspan></text><text x="332" y="59.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">express</tspan></text><text x="332" y="73.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>type, weight, shape, dash, fill</tspan></text><text x="332" y="140.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The nine diagram</tspan></text><text x="332" y="155.058" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">kinds</tspan></text><text x="332" y="273.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">One document, one</tspan></text><text x="332" y="287.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">SVG</tspan></text><text x="332" y="563.512" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Continuous consultation and review sit outside every ring.</tspan></text></svg>
