tspan>A</tspan></text><polygon points="350.466,73.7 495.233,73.7 495.233,110.55 350.466,110.55" fill="url(#ds03d7a6158e-dots)" stroke="currentColor" stroke-width="1.5"/><text x="422.849" y="94.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="495.233,73.7 640,73.7 640,110.55 495.233,110.55" fill="url(#ds03d7a6158e-hatch)" stroke="currentColor" stroke-width="1.5"/><text x="567.616" y="94.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="60.932,110.55 205.699,110.55 205.699,147.4 60.932,147.4" fill="url(#ds03d7a6158e-dots)" stroke="currentColor" stroke-width="1.5"/><text x="133.315" y="131.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A</tspan></text><polygon points="205.699,110.55 350.466,110.55 350.466,147.4 205.699,147.4" fill="url(#ds03d7a6158e-dots)" stroke="currentColor" stroke-width="1.5"/><text x="278.082" y="131.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>B</tspan></text><polygon points="350.466,110.55 495.233,110.55 495.233,147.4 350.466,147.4" fill="url(#ds03d7a6158e-dots)" stroke="currentColor" stroke-width="1.5"/><text x="422.849" y="131.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>C</tspan></text><polygon points="495.233,110.55 640,110.55 640,147.4 495.233,147.4" fill="url(#ds03d7a6158e-grid)" stroke="currentColor" stroke-width="1.5"/><text x="567.616" y="131.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>P</tspan></text><polygon points="60.932,147.4 205.699,147.4 205.699,184.25 60.932,184.25" fill="url(#ds03d7a6158e-dots)" stroke="currentColor" stroke-width="1.5"/><text x="133.315" y="168.633" font-family="'DejaVu Sans', sans-ser olor" stroke-width="1.5"/><text x="127.51" y="386.615" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Step away</text><ellipse cx="512.49" cy="398.974" rx="3.2" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="512.49" y="386.615" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">Insist</text></svg>

<figcaption><b>rings-scope</b> <span>rings</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 556.3" role="img" aria-labelledby="dsa7013b43b5-title dsa7013b43b5-desc"><title id="dsa7013b43b5-title">What is in scope</title><desc id="dsa7013b43b5-desc">The centre is fixed; the outer rings are where the arguments happen. The outermost ring names what it is and then says what that means; the two inside it only need naming, and are named the same way.</desc><ellipse cx="320" cy="265.65" rx="265.65" ry="265.65" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="320" cy="265.65" rx="177.1" ry="177.1" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="320" cy="265.65" rx="88.55" ry="88.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="32.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Everything a theme can</tspan></text><text x="320" y="47.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">express</tspan></text><text x="320" y="61.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>type, weight, shape, dash, fill</tspan></text><text x="320" y="128.208" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">The nine diagram</tspan></text><text x="320" y="143.058" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">kinds</tspan></text><text x="320" y="261.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">One document, one</tspan></text><text x="320" y="275.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">SVG</tspan></text><text x="320" y="551.512" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Continuous consultation and review sit outside every ring.</tspan></text></svg>
</figure><figure>
<figcaption><b>stack-decisions</b> <span>stack</span></figcaption>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 132.05" role="img" aria-labelledby="ds6871cfc8fb-title ds6871cfc8fb-desc"><title id="ds6871cfc8fb-title">Where a decision is taken</title><desc id="ds6871cfc8fb-desc">Each layer takes the decisions the one above it must not.</desc><rect x="0" y="0" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The author says what the diagram</tspan><tspan font-weight="bold"> means</tspan></text><rect x="0" y="46.85" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="68.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The theme decides what each semantic role looks like</tspan></text><rect x="0" y="93.7" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="114.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The tool decides every coordinate, line break and type size</tspan></text></svg>
</figure><figure>

 y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>back</tspan></text><path d="M 607.6 47.839 L 607.6 61.839" fill="none" stroke="currentColor" stroke-width="1"/><rect x="575.2" y="0" width="64.8" height="47.839" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="607.6" y="19.773" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>Working</tspan></text><text x="607.6" y="32.692" font-family="'DejaVu Sans', sans-serif" font-size="9.57" fill="currentColor" text-anchor="middle"><tspan>again</tspan></text><text x="32.4" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>02:00</tspan></text><text x="110.836" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="424.582" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="424.582" y="91.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>08:00</tspan></text><text x="607.6" y="79.915" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>Next day,</tspan></text><text x="607.6" y="91.66" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle"><tspan>22:00</tspan></text><path d="M 32.4 120.456 L 110.836 120.456" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 32.4 116.456 L 32.4 124.456" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 110.836 116.456 L 110.836 124.456" fill="none" stroke="currentColor" stroke-width="1"/><text x="71.618" y="113.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle">Data lost</text><path d="M 110.836 120.456 L 424.582 120.456" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 110.836 116.456 L 110.836 124.456" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 424.582 116.456 L 424.582 124.456" fill="none" stroke="currentColor" stroke-width="1"/><text x="267.709" y="113.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle">Recovery time</text><path d="M 424.582 120.456 L 607.6 120.456" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 424.582 116.456 L 424.582 124.456" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 607.6 116.456 L 607.6 124.456" fill="none" stroke="currentColor" stroke-width="1"/><text x="516.091" y="113.405" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle">Work recovery</text><path d="M 110.836 150.584 L 607.6 150.584" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 110.836 146.584 L 110.836 154.584" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 607.6 146.584 L 607.6 154.584" fill="none" stroke="currentColor" stroke-width="1"/><text x="359.218" y="143.532" font-family="'DejaVu Sans', sans-serif" font-size="8.7" fill="currentColor" text-anchor="middle">Maximum tolerable downtime</text></svg>
