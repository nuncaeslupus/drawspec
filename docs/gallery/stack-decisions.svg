<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130.55" role="img" aria-labelledby="dsd9ba8ebc97-title dsd9ba8ebc97-desc"><title id="dsd9ba8ebc97-title">Where a decision is taken</title><desc id="dsd9ba8ebc97-desc">Each layer takes the decisions the one above it must not.</desc><rect x="0" y="0" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="204.93" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">The author says what the diagram</text><text x="394.647" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" font-weight="bold"> means</text><rect x="0" y="46.85" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="170.748" y="68.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">The theme decides what each semantic role looks like</text><rect x="0" y="93.7" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="157.038" y="114.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">The tool decides every coordinate, line break and type size</text></svg>