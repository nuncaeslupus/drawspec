<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 665.5 156.05" role="img" aria-labelledby="ds21904a193f-title ds21904a193f-desc"><title id="ds21904a193f-title">Where a decision is taken</title><desc id="ds21904a193f-desc">Each layer takes the decisions the one above it must not.</desc><rect x="12" y="12" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The author says what the diagram</tspan><tspan font-weight="bold"> means</tspan></text><rect x="12" y="58.85" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="80.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The theme decides what each semantic role looks like</tspan></text><rect x="12" y="105.7" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="332" y="126.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The tool decides every coordinate, line break and type size</tspan></text></svg>