<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 132.05" role="img" aria-labelledby="ds7ece6ab7d4-title ds7ece6ab7d4-desc"><title id="ds7ece6ab7d4-title">Where a decision is taken</title><desc id="ds7ece6ab7d4-desc">Each layer takes the decisions the one above it must not.</desc><rect x="0" y="0" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="202.865" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">The author says what the diagram</text><text x="392.582" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" font-weight="bold"> means</text><rect x="0" y="46.85" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="170.748" y="68.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">The theme decides what each semantic role looks like</text><rect x="0" y="93.7" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="157.038" y="114.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">The tool decides every coordinate, line break and type size</text></svg>