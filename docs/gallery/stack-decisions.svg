<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.75 -0.75 641.5 132.05" role="img" aria-labelledby="ds1004c37d24-title ds1004c37d24-desc"><title id="ds1004c37d24-title">Where a decision is taken</title><desc id="ds1004c37d24-desc">Each layer takes the decisions the one above it must not.</desc><rect x="0" y="0" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The author says what the diagram</tspan><tspan font-weight="bold"> means</tspan></text><rect x="0" y="46.85" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="68.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The theme decides what each semantic role looks like</tspan></text><rect x="0" y="93.7" width="640" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="114.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>The tool decides every coordinate, line break and type size</tspan></text></svg>