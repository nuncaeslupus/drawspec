<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 461.95" role="img" aria-labelledby="ds988cb29f77-title ds988cb29f77-desc"><title id="ds988cb29f77-title">Every edge role, drawn</title><desc id="ds988cb29f77-desc">The seven roles a connector may take, each drawn between a pair of boxes: flow is the ordinary arrow; strong is the same relation at a heavier weight; link has no head at all and is the one role the default theme draws as a straight chord rather than routing; exchange has a head at both ends; weak is dashed with an open head; owns carries a diamond; and aside is dashed with no head, which is the pairing none of the other six could make. The head, the weight, the dash and the routing all follow from the role.</desc><path d="M 308 30.425 L 356 30.425" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,30.425 348,34.025 348,26.825" fill="currentColor" stroke="none"/><path d="M 308 91.275 L 356 91.275" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="356,91.275 342.667,97.275 342.667,85.275" fill="currentColor" stroke="none"/><path d="M 308 152.125 L 356 152.125" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 308 212.975 L 356 212.975" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,212.975 348,216.575 348,209.375" fill="currentColor" stroke="none"/><polygon points="308,212.975 316,209.375 316,216.575" fill="currentColor" stroke="none"/><path d="M 308 273.825 L 356 273.825" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 348 277.425 L 356 273.825 L 348 270.225" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 308 334.675 L 356 334.675" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="356,334.675 352,338.275 348,334.675 352,331.075" fill="currentColor" stroke="none"/><path d="M 308 395.525 L 356 395.525" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><rect x="155.319" y="377.1" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="231.66" y="398.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>aside</tspan></text><rect x="356" y="377.1" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.34" y="398.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>and this belongs with it</tspan></text><rect x="155.319" y="12" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="231.66" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>flow</tspan></text><rect x="356" y="12" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.34" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>then this</tspan></text><rect x="155.319" y="133.7" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="231.66" y="154.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>link</tspan></text><rect x="356" y="133.7" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.34" y="154.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>merely associated</tspan></text><rect x="155.319" y="316.25" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="231.66" y="337.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>owns</tspan></text><rect x="356" y="316.25" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.34" y="337.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a part of it</tspan></text><rect x="155.319" y="72.85" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="231.66" y="94.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>strong</tspan></text><rect x="356" y="72.85" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.34" y="94.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the path with no slack</tspan></text><rect x="155.319" y="255.4" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="231.66" y="276.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>weak</tspan></text><rect x="356" y="255.4" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.34" y="276.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a soft dependency</tspan></text><rect x="155.319" y="194.55" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="231.66" y="215.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>exchange</tspan></text><rect x="356" y="194.55" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="432.34" y="215.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>both ways</tspan></text><text x="332" y="434.162" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>An author says what the relation is; whether it has a head is the theme's answer.</tspan></text></svg>