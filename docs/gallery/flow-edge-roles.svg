<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 485.95" role="img" aria-labelledby="ds16599663b3-title ds16599663b3-desc"><title id="ds16599663b3-title">Every edge role, drawn</title><desc id="ds16599663b3-desc">The seven roles a connector may take, each drawn between a pair of boxes: flow is the ordinary arrow; strong is the same relation at a heavier weight; link has no head at all and is the one role the default theme draws as a straight chord rather than routing; exchange has a head at both ends; weak is dashed with an open head; owns carries a diamond; and aside is dashed with no head, which is the pairing none of the other six could make. The head, the weight, the dash and the routing all follow from the role.</desc><path d="M 296 42.425 L 344 42.425" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="344,42.425 336,46.025 336,38.825" fill="currentColor" stroke="none"/><path d="M 296 103.275 L 344 103.275" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="344,103.275 330.667,109.275 330.667,97.275" fill="currentColor" stroke="none"/><path d="M 296 164.125 L 344 164.125" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 296 224.975 L 344 224.975" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="344,224.975 336,228.575 336,221.375" fill="currentColor" stroke="none"/><polygon points="296,224.975 304,221.375 304,228.575" fill="currentColor" stroke="none"/><path d="M 296 285.825 L 344 285.825" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 336 289.425 L 344 285.825 L 336 282.225" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 296 346.675 L 344 346.675" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="344,346.675 340,350.275 336,346.675 340,343.075" fill="currentColor" stroke="none"/><path d="M 296 407.525 L 344 407.525" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><rect x="143.319" y="389.1" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.66" y="410.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>aside</tspan></text><rect x="344" y="389.1" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.34" y="410.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>and this belongs with it</tspan></text><rect x="143.319" y="24" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.66" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>flow</tspan></text><rect x="344" y="24" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.34" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>then this</tspan></text><rect x="143.319" y="145.7" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.66" y="166.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>link</tspan></text><rect x="344" y="145.7" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.34" y="166.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>merely associated</tspan></text><rect x="143.319" y="328.25" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.66" y="349.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>owns</tspan></text><rect x="344" y="328.25" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.34" y="349.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a part of it</tspan></text><rect x="143.319" y="84.85" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.66" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>strong</tspan></text><rect x="344" y="84.85" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.34" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the path with no slack</tspan></text><rect x="143.319" y="267.4" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.66" y="288.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>weak</tspan></text><rect x="344" y="267.4" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.34" y="288.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>a soft dependency</tspan></text><rect x="143.319" y="206.55" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="219.66" y="227.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>exchange</tspan></text><rect x="344" y="206.55" width="152.681" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="420.34" y="227.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>both ways</tspan></text><text x="320" y="470.162" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>An author says what the relation is; whether it has a head is the theme's answer.</tspan></text></svg>