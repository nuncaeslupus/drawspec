<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 663.8" role="img" aria-labelledby="ds6122480978-title ds6122480978-desc"><title id="ds6122480978-title">Request validation</title><desc id="ds6122480978-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 334.296 60.85 L 334.296 84.85 L 323 84.85 L 323 108.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="323,108.85 320.6,102.85 325.4,102.85" fill="currentColor" stroke="none"/><path d="M 307.757 228.64 L 307.757 265.95 L 323 265.95 L 323 289.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="323,289.95 320.6,283.95 325.4,283.95" fill="currentColor" stroke="none"/><path d="M 338.243 228.64 L 338.243 265.95 L 407.465 265.95 L 407.465 450.05 L 392.848 450.05 L 392.848 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="392.848,471.05 390.448,465.05 395.248,465.05" fill="currentColor" stroke="none"/><path d="M 307.757 409.74 L 307.757 447.05 L 237.912 447.05 L 237.912 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="237.912,471.05 235.512,465.05 240.312,465.05" fill="currentColor" stroke="none"/><path d="M 338.243 409.74 L 338.243 444.05 L 422.083 444.05 L 422.083 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="422.083,471.05 419.683,465.05 424.483,465.05" fill="currentColor" stroke="none"/><path d="M 237.912 522.75 L 237.912 550.462 L 224.281 550.462 L 224.281 578.175" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="224.281,578.175 221.881,572.175 226.681,572.175" fill="currentColor" stroke="none"/><path d="M 407.465 522.75 L 407.465 570.75" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 253.267 578.175 L 253.267 546.75 L 159.447 546.75 L 159.447 84.85 L 311.704 84.85 L 311.704 60.85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 314.104 66.85 L 311.704 60.85 L 309.304 66.85" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="266.52" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="323" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Request arrives</tspan></text><rect x="335.239" y="570.75" width="144.452" height="66.55" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><text x="407.465" y="591.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every rejection is</tspan></text><text x="407.465" y="606.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>audited, including the</tspan></text><text x="407.465" y="621.683" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>reason given</tspan></text><polygon points="323,289.95 399.214,356.5 323,423.05 246.786,356.5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="323" y="344.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the caller</tspan></text><text x="323" y="359.308" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>authorised for</tspan></text><text x="323" y="374.158" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>this resource?</tspan></text><rect x="165.447" y="471.05" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="237.912" y="499.708" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Queue for processing</tspan></text><rect x="166.309" y="578.175" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="238.774" y="599.408" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Record the outcome</tspan></text><text x="238.774" y="614.258" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>against the request id</tspan></text><rect x="334.378" y="471.05" width="146.175" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="407.465" y="492.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reject with a reason</tspan></text><text x="407.465" y="507.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the caller can act on</tspan></text><polygon points="323,108.85 399.214,175.4 323,241.95 246.786,175.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="323" y="170.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the payload</tspan></text><text x="323" y="185.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>well formed?</tspan></text><text x="244.125" y="250.757" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">well formed</text><text x="412.215" y="361.462" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">malformed</text><text x="246.114" y="439.942" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">authorised</text><text x="361.357" y="436.942" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">refused</text><text x="164.197" y="319.262" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">next request</text></svg>