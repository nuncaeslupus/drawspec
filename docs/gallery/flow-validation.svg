<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 559.85" role="img" aria-labelledby="ds81c88de719-title ds81c88de719-desc"><title id="ds81c88de719-title">Request validation</title><desc id="ds81c88de719-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 303.116 60.85 L 303.116 108.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="303.116,108.85 299.516,100.85 306.716,100.85" fill="currentColor" stroke="none"/><path d="M 279.39 175.18 L 279.39 206.55 L 303.116 206.55 L 303.116 230.55" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="303.116,230.55 299.516,222.55 306.716,222.55" fill="currentColor" stroke="none"/><path d="M 326.843 175.18 L 326.843 206.55 L 447.21 206.55 L 447.21 357.95 L 372.964 357.95 L 372.964 381.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="372.964,381.95 369.364,373.95 376.564,373.95" fill="currentColor" stroke="none"/><path d="M 279.39 323.61 L 279.39 361.663 L 218.029 361.663 L 218.029 389.375" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="218.029,389.375 214.429,381.375 221.629,381.375" fill="currentColor" stroke="none"/><path d="M 326.843 323.61 L 326.843 369.95 L 402.199 369.95 L 402.199 381.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="402.199,381.95 398.599,373.95 405.799,373.95" fill="currentColor" stroke="none"/><path d="M 206.043 426.225 L 206.043 481.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="206.043,481.65 202.443,473.65 209.643,473.65" fill="currentColor" stroke="none"/><path d="M 387.581 433.65 L 387.581 481.65" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 278.508 507.5 L 296.501 507.5 L 296.501 345.95 L 435.21 345.95 L 435.21 42.425 L 359.596 42.425" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 367.596 38.825 L 359.596 42.425 L 367.596 46.025" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="246.636" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="303.116" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Request arrives</tspan></text><text x="387.581" y="502.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every rejection is audited,</tspan></text><text x="387.581" y="517.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>including the reason given</tspan></text><polygon points="303.116,230.55 421.75,282.25 303.116,333.95 184.483,282.25" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="303.116" y="277.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the caller authorised for</tspan></text><text x="303.116" y="292.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>this resource?</tspan></text><rect x="145.564" y="389.375" width="144.93" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="218.029" y="410.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Queue for processing</tspan></text><rect x="133.578" y="481.65" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="206.043" y="502.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Record the outcome</tspan></text><text x="206.043" y="517.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>against the request id</tspan></text><rect x="314.494" y="381.95" width="146.175" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="387.581" y="403.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reject with a reason</tspan></text><text x="387.581" y="418.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the caller can act on</tspan></text><polygon points="303.116,108.85 421.75,145.7 303.116,182.55 184.483,145.7" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="303.116" y="148.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the payload well formed?</tspan></text><text x="215.758" y="194.327" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">well formed</text><text x="451.96" y="285.712" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">malformed</text><text x="221.988" y="354.554" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">authorised</text><text x="331.593" y="364.144" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">refused</text><text x="439.96" y="152.121" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">next request</text></svg>