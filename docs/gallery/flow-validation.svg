<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 365.605 663.8" role="img" aria-labelledby="dsa6a7805107-title dsa6a7805107-desc"><title id="dsa6a7805107-title">Request validation</title><desc id="dsa6a7805107-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 192.849 60.85 L 192.849 84.85 L 181.553 84.85 L 181.553 108.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="181.553,108.85 179.153,102.85 183.953,102.85" fill="currentColor" stroke="none"/><path d="M 166.31 228.64 L 166.31 265.95 L 181.553 265.95 L 181.553 289.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="181.553,289.95 179.153,283.95 183.953,283.95" fill="currentColor" stroke="none"/><path d="M 196.795 228.64 L 196.795 289.95 L 257.766 289.95 L 257.766 447.05 L 251.4 447.05 L 251.4 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="251.4,471.05 249,465.05 253.8,465.05" fill="currentColor" stroke="none"/><path d="M 166.31 409.74 L 166.31 447.05 L 96.465 447.05 L 96.465 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="96.465,471.05 94.065,465.05 98.865,465.05" fill="currentColor" stroke="none"/><path d="M 196.795 409.74 L 196.795 447.05 L 280.635 447.05 L 280.635 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="280.635,471.05 278.235,465.05 283.035,465.05" fill="currentColor" stroke="none"/><path d="M 96.465 522.75 L 96.465 574.462 L 82.834 574.462 L 82.834 578.175" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="82.834,578.175 80.434,572.175 85.234,572.175" fill="currentColor" stroke="none"/><path d="M 266.018 522.75 L 266.018 570.75" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 111.82 578.175 L 111.82 522.75 L 168.93 522.75 L 168.93 447.05 L 105.339 447.05 L 105.339 84.85 L 170.257 84.85 L 170.257 60.85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 172.657 66.85 L 170.257 60.85 L 167.857 66.85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="125.073" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="138.635" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Request arrives</text><rect x="193.792" y="570.75" width="144.452" height="66.55" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><text x="218.502" y="591.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Every rejection is</text><text x="205.792" y="606.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">audited, including the</text><text x="230.515" y="621.683" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">reason given</text><polygon points="181.553,289.95 257.766,356.5 181.553,423.05 105.339,356.5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="149.447" y="344.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Is the caller</text><text x="142.849" y="359.308" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">authorised for</text><text x="143.061" y="374.158" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">this resource?</text><rect x="24" y="471.05" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="37.697" y="499.708" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Queue for processing</text><rect x="24.861" y="578.175" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="41.663" y="599.408" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Record the outcome</text><text x="36.861" y="614.258" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">against the request id</text><rect x="192.93" y="471.05" width="146.175" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="210.072" y="492.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Reject with a reason</text><text x="209.621" y="507.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">the caller can act on</text><polygon points="181.553,108.85 257.766,175.4 181.553,241.95 105.339,175.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="142.671" y="170.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Is the payload</text><text x="146.248" y="185.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">well formed?</text><text x="117.921" y="281.412" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">well formed</text><text x="262.516" y="371.962" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">malformed</text><text x="104.666" y="461.082" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">authorised</text><text x="207.333" y="439.942" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">refused</text><text x="37.244" y="269.412" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">next request</text></svg>