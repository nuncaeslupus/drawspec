<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 589.55" role="img" aria-labelledby="ds5e7a639139-title ds5e7a639139-desc"><title id="ds5e7a639139-title">Request validation</title><desc id="ds5e7a639139-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 303.116 60.85 L 303.116 108.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="303.116,108.85 299.516,100.85 306.716,100.85" fill="currentColor" stroke="none"/><path d="M 279.39 201.91 L 279.39 236.25 L 303.116 236.25 L 303.116 260.25" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="303.116,260.25 299.516,252.25 306.716,252.25" fill="currentColor" stroke="none"/><path d="M 326.843 201.91 L 326.843 236.25 L 447.21 236.25 L 447.21 387.65 L 372.964 387.65 L 372.964 411.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="372.964,411.65 369.364,403.65 376.564,403.65" fill="currentColor" stroke="none"/><path d="M 279.39 353.31 L 279.39 387.65 L 218.029 387.65 L 218.029 411.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="218.029,411.65 214.429,403.65 221.629,403.65" fill="currentColor" stroke="none"/><path d="M 326.843 353.31 L 326.843 399.65 L 402.199 399.65 L 402.199 411.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="402.199,411.65 398.599,403.65 405.799,403.65" fill="currentColor" stroke="none"/><path d="M 206.043 463.35 L 206.043 511.35" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="206.043,511.35 202.443,503.35 209.643,503.35" fill="currentColor" stroke="none"/><path d="M 387.581 463.35 L 387.581 511.35" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 278.508 537.2 L 296.501 537.2 L 296.501 375.65 L 435.21 375.65 L 435.21 42.425 L 359.596 42.425" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 367.596 38.825 L 359.596 42.425 L 367.596 46.025" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="246.636" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="303.116" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Request arrives</tspan></text><text x="387.581" y="532.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every rejection is audited,</tspan></text><text x="387.581" y="547.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>including the reason given</tspan></text><polygon points="303.116,260.25 421.75,311.95 303.116,363.65 184.483,311.95" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="303.116" y="307.333" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the caller authorised for</tspan></text><text x="303.116" y="322.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>this resource?</tspan></text><rect x="145.564" y="411.65" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="218.029" y="440.308" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Queue for processing</tspan></text><rect x="133.578" y="511.35" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="206.043" y="532.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Record the outcome</tspan></text><text x="206.043" y="547.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>against the request id</tspan></text><rect x="314.494" y="411.65" width="146.175" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="387.581" y="432.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reject with a reason</tspan></text><text x="387.581" y="447.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the caller can act on</tspan></text><polygon points="303.116,108.85 421.75,160.55 303.116,212.25 184.483,160.55" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="303.116" y="163.358" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the payload well formed?</tspan></text><text x="215.758" y="222.542" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">well formed</text><text x="451.96" y="315.412" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">malformed</text><text x="221.988" y="380.542" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">authorised</text><text x="331.593" y="393.844" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">refused</text><text x="439.96" y="212.499" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">next request</text></svg>