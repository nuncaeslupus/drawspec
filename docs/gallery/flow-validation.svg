<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 559.85" role="img" aria-labelledby="dsdad0357b75-title dsdad0357b75-desc"><title id="dsdad0357b75-title">Request validation</title><desc id="dsdad0357b75-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 296.89 60.85 L 296.89 108.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="296.89,108.85 293.29,100.85 300.49,100.85" fill="currentColor" stroke="none"/><path d="M 273.163 175.18 L 273.163 206.55 L 296.89 206.55 L 296.89 230.55" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="296.89,230.55 293.29,222.55 300.49,222.55" fill="currentColor" stroke="none"/><path d="M 320.617 175.18 L 320.617 206.55 L 441.139 206.55 L 441.139 357.95 L 367.049 357.95 L 367.049 381.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="367.049,381.95 363.449,373.95 370.649,373.95" fill="currentColor" stroke="none"/><path d="M 273.163 323.61 L 273.163 361.663 L 212.114 361.663 L 212.114 389.375" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="212.114,389.375 208.514,381.375 215.714,381.375" fill="currentColor" stroke="none"/><path d="M 320.617 323.61 L 320.617 369.95 L 396.284 369.95 L 396.284 381.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="396.284,381.95 392.684,373.95 399.884,373.95" fill="currentColor" stroke="none"/><path d="M 227.315 426.225 L 227.315 481.65" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="227.315,481.65 223.715,473.65 230.915,473.65" fill="currentColor" stroke="none"/><path d="M 388.715 433.65 L 401.804 481.65" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 299.78 507.5 L 311.78 507.5 L 311.78 453.938 L 299.78 453.938 L 299.78 345.95 L 429.139 345.95 L 429.139 42.425 L 353.37 42.425" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 361.37 38.825 L 353.37 42.425 L 361.37 46.025" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="240.41" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="296.89" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Request arrives</tspan></text><text x="408.853" y="502.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every rejection is audited,</tspan></text><text x="408.853" y="517.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>including the reason given</tspan></text><polygon points="296.89,230.55 415.524,282.25 296.89,333.95 178.256,282.25" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="296.89" y="277.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the caller authorised for</tspan></text><text x="296.89" y="292.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>this resource?</tspan></text><rect x="139.648" y="389.375" width="144.93" height="36.85" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="212.114" y="410.608" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Queue for processing</tspan></text><rect x="154.849" y="481.65" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="227.315" y="502.883" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Record the outcome</tspan></text><text x="227.315" y="517.733" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>against the request id</tspan></text><rect x="308.579" y="381.95" width="146.175" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="381.666" y="403.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reject with a reason</tspan></text><text x="381.666" y="418.033" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the caller can act on</tspan></text><polygon points="296.89,108.85 415.524,145.7 296.89,182.55 178.256,145.7" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="296.89" y="148.508" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the payload well formed?</tspan></text><text x="209.531" y="194.327" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">well formed</text><text x="445.889" y="285.712" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">malformed</text><text x="215.917" y="354.554" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">authorised</text><text x="325.367" y="364.144" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">refused</text><text x="433.889" y="152.121" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">next request</text></svg>