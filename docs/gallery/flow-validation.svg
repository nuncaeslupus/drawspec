<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 663.8" role="img" aria-labelledby="ds8644054095-title ds8644054095-desc"><title id="ds8644054095-title">Request validation</title><desc id="ds8644054095-desc">An incoming request is validated, then either queued for processing or rejected with a reason the caller can act on.</desc><path d="M 331.296 60.85 L 331.296 84.85 L 320 84.85 L 320 108.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="320,108.85 317.6,102.85 322.4,102.85" fill="currentColor" stroke="none"/><path d="M 304.757 228.64 L 304.757 265.95 L 320 265.95 L 320 289.95" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="320,289.95 317.6,283.95 322.4,283.95" fill="currentColor" stroke="none"/><path d="M 335.243 228.64 L 335.243 265.95 L 404.465 265.95 L 404.465 441.05 L 389.848 441.05 L 389.848 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="389.848,471.05 387.448,465.05 392.248,465.05" fill="currentColor" stroke="none"/><path d="M 304.757 409.74 L 304.757 453.05 L 234.912 453.05 L 234.912 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="234.912,471.05 232.512,465.05 237.312,465.05" fill="currentColor" stroke="none"/><path d="M 335.243 409.74 L 335.243 453.05 L 419.083 453.05 L 419.083 471.05" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="419.083,471.05 416.683,465.05 421.483,465.05" fill="currentColor" stroke="none"/><path d="M 234.912 522.75 L 234.912 550.462 L 221.281 550.462 L 221.281 578.175" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="221.281,578.175 218.881,572.175 223.681,572.175" fill="currentColor" stroke="none"/><path d="M 404.465 522.75 L 404.465 570.75" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 250.267 578.175 L 250.267 546.75 L 319.378 546.75 L 319.378 441.05 L 234.912 441.05 L 234.912 84.85 L 308.704 84.85 L 308.704 60.85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 311.104 66.85 L 308.704 60.85 L 306.304 66.85" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="263.52" y="24" width="112.96" height="36.85" rx="18.425" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="45.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Request arrives</tspan></text><rect x="332.239" y="570.75" width="144.452" height="66.55" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><text x="404.465" y="591.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Every rejection is</tspan></text><text x="404.465" y="606.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>audited, including the</tspan></text><text x="404.465" y="621.683" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>reason given</tspan></text><polygon points="320,289.95 396.214,356.5 320,423.05 243.786,356.5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="344.458" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the caller</tspan></text><text x="320" y="359.308" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>authorised for</tspan></text><text x="320" y="374.158" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>this resource?</tspan></text><rect x="162.447" y="471.05" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="234.912" y="499.708" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Queue for processing</tspan></text><rect x="163.309" y="578.175" width="144.93" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="235.774" y="599.408" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Record the outcome</tspan></text><text x="235.774" y="614.258" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>against the request id</tspan></text><rect x="331.378" y="471.05" width="146.175" height="51.7" rx="25.85" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="404.465" y="492.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Reject with a reason</tspan></text><text x="404.465" y="507.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the caller can act on</tspan></text><polygon points="320,108.85 396.214,175.4 320,241.95 243.786,175.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="320" y="170.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Is the payload</tspan></text><text x="320" y="185.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>well formed?</tspan></text><text x="241.125" y="250.757" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">well formed</text><text x="409.215" y="356.962" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">malformed</text><text x="246.565" y="434.857" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">authorised</text><text x="345.781" y="445.942" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">refused</text><text x="166.818" y="266.412" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">next request</text></svg>