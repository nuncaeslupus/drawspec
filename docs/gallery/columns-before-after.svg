<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 51.7" role="img" aria-labelledby="ds69d299b754-title ds69d299b754-desc"><title id="ds69d299b754-title">What changed</title><desc id="ds69d299b754-desc">The same diagram, authored two ways.</desc><rect x="0" y="0" width="308" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><text x="19.905" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">Hand-written SVG, with every coordinate chosen</text><text x="57.433" y="36.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">by the author and reviewed by eye</text><rect x="332" y="0" width="308" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="356.704" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">A declarative document, with every coordinate</text><text x="390.491" y="36.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor">derived and checked mechanically</text></svg>