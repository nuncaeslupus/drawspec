<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 642.5 54.2" role="img" aria-labelledby="ds2634e5f6d0-title ds2634e5f6d0-desc"><title id="ds2634e5f6d0-title">What changed</title><desc id="ds2634e5f6d0-desc">The same diagram, authored two ways.</desc><text x="154" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Hand-written SVG, with every coordinate chosen</tspan></text><text x="154" y="36.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>by the author and reviewed by eye</tspan></text><rect x="332" y="0" width="308" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="486" y="21.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A declarative document, with every coordinate</tspan></text><text x="486" y="36.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>derived and checked mechanically</tspan></text></svg>