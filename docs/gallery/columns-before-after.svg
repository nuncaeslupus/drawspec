<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 78.2" role="img" aria-labelledby="dsfefc41cd56-title dsfefc41cd56-desc"><title id="dsfefc41cd56-title">What changed</title><desc id="dsfefc41cd56-desc">The same diagram, authored two ways.</desc><text x="166" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Hand-written SVG, with every coordinate chosen</tspan></text><text x="166" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>by the author and reviewed by eye</tspan></text><rect x="344" y="12" width="308" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="498" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>A declarative document, with every coordinate</tspan></text><text x="498" y="48.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>derived and checked mechanically</tspan></text></svg>