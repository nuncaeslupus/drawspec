<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 248.8" role="img" aria-labelledby="dsdf372a6a55-title"><title id="dsdf372a6a55-title">Why orders ship late</title><path d="M 356.36 73.05 L 475.718 73.05" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 343.642 98.4 L 490.353 98.4" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 451.931 31.85 L 494.972 106.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 348.502 172.95 L 456.55 172.95" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 451.931 180.95 L 494.972 106.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 183.578 58.2 L 303.079 58.2" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 190.066 83.55 L 317.715 83.55" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 287.866 31.85 L 330.908 106.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 193.182 172.95 L 292.485 172.95" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 287.866 180.95 L 330.908 106.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 23.933 73.05 L 167.138 73.05" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 143.351 31.85 L 186.393 106.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 60.242 172.95 L 147.97 172.95" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 143.351 180.95 L 186.393 106.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 143.351 106.4 L 514.972 106.4" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="514.972" y="80.55" width="125.095" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="451.55" y="51.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Picking by order,</tspan></text><text x="451.55" y="65.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>not by zone</tspan></text><text x="474.759" y="91.283" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Manual address checks</tspan></text><text x="451.931" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Method</tspan></text><text x="451.55" y="165.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Label printer jams</tspan></text><text x="451.931" y="197.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Machine</tspan></text><text x="287.485" y="51.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Boxes out of stock</tspan></text><text x="302.121" y="76.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Supplier ships short</tspan></text><text x="287.866" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Material</tspan></text><text x="287.485" y="150.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Peak-season</tspan></text><text x="287.485" y="165.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>temps untrained</tspan></text><text x="287.866" y="197.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Manpower</tspan></text><text x="142.97" y="51.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Promise date ignores</tspan></text><text x="142.97" y="65.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>stock location</tspan></text><text x="143.351" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Measurement</tspan></text><text x="142.97" y="150.983" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Courier cut-off</tspan></text><text x="142.97" y="165.833" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>moved earlier</tspan></text><text x="143.351" y="197.183" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Milieu</tspan></text><text x="577.52" y="101.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Orders ship after</tspan></text><text x="577.52" y="116.633" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>the promised date</tspan></text><text x="332" y="221.012" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Categories follow the 6M convention; any set of categories is allowed.</tspan></text></svg>