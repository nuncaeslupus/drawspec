 fill="currentColor" stroke="currentColor" stroke-width="1.5"/><polygon points="639,162.606 647.125,170.731 639,178.856 630.875,170.731" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M 259.933 198.497 L 639 198.497" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 259.933 198.497 L 259.933 206.497" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 354.7 198.497 L 354.7 206.497" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 449.467 198.497 L 449.467 206.497" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 544.233 198.497 L 544.233 206.497" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 639 198.497 L 639 206.497" fill="none" stroke="currentColor" stroke-width="1"/><text x="12" y="29.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Predictive</tspan><tspan> — fixed scope, one</tspan></text><text x="12" y="44.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>delivery</tspan></text><text x="12" y="74.583" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Iterative</tspan><tspan> — refined until right, one</tspan></text><text x="12" y="89.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan>delivery</tspan></text><text x="12" y="123.199" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Incremental</tspan><tspan> — a piece at a time</tspan></text><text x="12" y="174.539" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor"><tspan font-weight="bold">Agile</tspan><tspan> — refined and delivered often</tspan></text><text x="631.246" y="44.624" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Delivery</tspan></text><text x="631.246" y="97.607" font-family="'DejaVu Sans', sans-s