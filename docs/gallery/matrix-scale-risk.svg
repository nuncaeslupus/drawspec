<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 200.541" role="img" aria-labelledby="ds561f71f353-title ds561f71f353-desc"><title id="ds561f71f353-title">Risks to the payments migration</title><desc id="ds561f71f353-desc">A risk matrix: likelihood down the side, impact across the top, and each open risk written in the cell it was scored into. The cells are filled by how urgent that combination is, light to dark, so the corner that needs action now is the darkest wherever the eye lands.</desc><text x="175.58" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Minor impact</tspan></text><text x="366.148" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Moderate impact</tspan></text><text x="556.716" y="33.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Severe impact</tspan></text><text x="46.148" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Likely</tspan></text><text x="46.148" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Possible</tspan></text><text x="46.148" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Rare</tspan></text><polygon points="80.295,48.85 270.864,48.85 270.864,85.7 80.295,85.7" fill="currentColor" fill-opacity="0.28" stroke="currentColor" stroke-width="1.5"/><text x="175.58" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Dashboards lag a day</tspan></text><polygon points="270.864,48.85 461.432,48.85 461.432,85.7 270.864,85.7" fill="currentColor" fill-opacity="0.48" stroke="currentColor" stroke-width="1.5"/><text x="366.148" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Card retries double-charge</tspan></text><polygon points="461.432,48.85 652,48.85 652,85.7 461.432,85.7" fill="currentColor" fill-opacity="0.48" stroke="currentColor" stroke-width="2.5"/><text x="556.716" y="70.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Ledger totals disagree</tspan></text><polygon points="80.295,85.7 270.864,85.7 270.864,122.55 80.295,122.55" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="175.58" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Old receipts reformatted</tspan></text><polygon points="270.864,85.7 461.432,85.7 461.432,122.55 270.864,122.55" fill="currentColor" fill-opacity="0.28" stroke="currentColor" stroke-width="1.5"/><text x="366.148" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Refunds queue for hours</tspan></text><polygon points="461.432,85.7 652,85.7 652,122.55 461.432,122.55" fill="currentColor" fill-opacity="0.48" stroke="currentColor" stroke-width="1.5"/><text x="556.716" y="106.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Webhook signatures rejected</tspan></text><polygon points="80.295,122.55 270.864,122.55 270.864,159.4 80.295,159.4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="175.58" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Currency symbols misplaced</tspan></text><polygon points="270.864,122.55 461.432,122.55 461.432,159.4 270.864,159.4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="366.148" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Sandbox keys expire</tspan></text><polygon points="461.432,122.55 652,122.55 652,159.4 461.432,159.4" fill="currentColor" fill-opacity="0.28" stroke="currentColor" stroke-width="1.5"/><text x="556.716" y="143.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>Provider outage mid-switch</tspan></text><polygon points="12,169.982 30.858,169.982 30.858,180.459 12,180.459" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="35.858" y="178.682" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Accept and watch</text><polygon points="135.174,169.982 154.032,169.982 154.032,180.459 135.174,180.459" fill="currentColor" fill-opacity="0.28" stroke="currentColor" stroke-width="1.5"/><text x="159.032" y="178.682" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Mitigate this quarter</text><polygon points="271.4,169.982 290.258,169.982 290.258,180.459 271.4,180.459" fill="currentColor" fill-opacity="0.48" stroke="currentColor" stroke-width="1.5"/><text x="295.258" y="178.682" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Mitigate before cut-over</text></svg>