<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 185.6" role="img" aria-labelledby="ds9ed859c8f4-title"><title id="ds9ed859c8f4-title">What makes CI fail without a code change</title><path d="M 248.81 58.2 L 425.808 58.2" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 295.071 83.55 L 440.444 83.55" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 410.595 31.85 L 445.063 91.55" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 255.642 143.25 L 415.214 143.25" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 286.122 117.9 L 429.85 117.9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 410.595 151.25 L 445.063 91.55" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 65.974 58.2 L 230.64 58.2" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 215.427 31.85 L 249.895 91.55" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M 215.427 91.55 L 465.063 91.55" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="465.063" y="65.7" width="132.963" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="410.214" y="51.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Shared fixtures mutate state</tspan></text><text x="424.85" y="76.433" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Sleeps instead of waits</tspan></text><text x="410.595" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Tests</tspan></text><text x="410.214" y="136.133" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Runners differ in CPU count</tspan></text><text x="424.85" y="110.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Clock skew in containers</tspan></text><text x="410.595" y="167.483" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Environment</tspan></text><text x="215.046" y="51.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="end"><tspan>Live calls to a sandbox API</tspan></text><text x="215.427" y="23.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Dependencies</tspan></text><text x="531.545" y="86.933" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>1 in 12 runs fails</tspan></text><text x="531.545" y="101.783" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>and passes on retry</tspan></text></svg>