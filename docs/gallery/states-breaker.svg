<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 415.662" role="img" aria-labelledby="ds7cfb6dd90e-title"><title id="ds7cfb6dd90e-title">When we stop calling the provider</title><path d="M 322.188 22 L 322.188 70" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="322.188,70 318.588,62 325.788,62" fill="currentColor" stroke="none"/><path d="M 322.188 121.7 L 322.188 192.981" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="322.188,192.981 318.588,184.981 325.788,184.981" fill="currentColor" stroke="none"/><path d="M 322.188 244.681 L 322.188 315.962" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="322.188,315.962 318.588,307.962 325.788,307.962" fill="currentColor" stroke="none"/><path d="M 378.467 336.642 L 443.522 336.642 L 443.522 95.85 L 378.467 95.85" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="378.467,95.85 386.467,92.25 386.467,99.45" fill="currentColor" stroke="none"/><path d="M 378.467 346.983 L 431.522 346.983 L 431.522 218.831 L 368.692 218.831" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="368.692,218.831 376.692,215.231 376.692,222.431" fill="currentColor" stroke="none"/><path d="M 265.908 108.775 L 244.575 108.775 L 244.575 82.925 L 265.908 82.925" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="265.908,82.925 257.908,86.525 257.908,79.325" fill="currentColor" stroke="none"/><ellipse cx="322.188" cy="17" rx="5" ry="5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><rect x="265.908" y="70" width="112.559" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="322.188" y="91.233" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Closed</tspan></text><text x="322.188" y="106.083" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>calls go through</tspan></text><rect x="265.908" y="315.962" width="112.559" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="322.188" y="337.196" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Half-open</tspan></text><text x="322.188" y="352.046" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>one trial call</tspan></text><rect x="275.684" y="192.981" width="93.008" height="51.7" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="322.188" y="214.214" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan font-weight="bold">Open</tspan></text><text x="322.188" y="229.064" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" text-anchor="middle"><tspan>calls fail fast</tspan></text><text x="326.938" y="154.982" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">call fails</text><text x="326.938" y="166.623" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">[threshold reached]</text><text x="326.938" y="283.784" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">cool-down elapses</text><text x="448.272" y="213.888" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">trial succeeds</text><text x="448.272" y="225.528" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">/ reset the count</text><text x="383.461" y="305.591" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">trial fails</text><text x="132.872" y="87.671" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">call fails</text><text x="132.872" y="99.312" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">[under the threshold]</text><text x="132.872" y="110.953" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">/ count it</text><text x="332" y="387.874" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle"><tspan>Thresholds are in</tspan><tspan font-family="'DejaVu Sans Mono', monospace"> breaker.toml</tspan><tspan> ; the drawing names them, it does not restate them.</tspan></text></svg>