<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.25 -1.25 666.5 538.5" role="img" aria-labelledby="ds48fa9c42d9-title ds48fa9c42d9-desc"><title id="ds48fa9c42d9-title">This week's requests, sorted</title><desc id="ds48fa9c42d9-desc">An urgent-important grid for a small team's inbox. The quarter names say what to do with what lands there; the axis ends say which way is more.</desc><path d="M 55.281 33.641 L 55.281 470.719" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 55.281 470.719 L 630.359 470.719" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 55.281 252.18 L 630.359 252.18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 342.82 33.641 L 342.82 470.719" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="342.82" y="511.642" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle">How urgent</text><text x="21.282" y="252.18" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="middle" transform="rotate(-90 21.282 252.18)">How important</text><text x="55.281" y="490.001" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor">Can wait</text><text x="630.359" y="490.001" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="end">Today</text><text x="42.923" y="470.719" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" transform="rotate(-90 42.923 470.719)">Minor</text><text x="42.923" y="33.641" font-family="'DejaVu Sans', sans-serif" font-size="10" fill="currentColor" text-anchor="end" transform="rotate(-90 42.923 33.641)">Matters</text><text x="620.359" y="53.851" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="end">Do now</text><text x="65.281" y="53.851" font-family="'DejaVu Sans', sans-serif" font-size="11" fill="currentColor" fill-opacity="0.55