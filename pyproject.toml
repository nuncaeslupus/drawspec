[project]
name = "drawspec"
version = "0.1.0"
description = "Declarative diagram spec to clean, themeable SVG — writable by an LLM with no coordinates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fonttools>=4.53",
]

[project.scripts]
drawspec = "drawspec.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawspec"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored build output, regenerated by `make update-skills` — not ours to lint.
extend-exclude = [".claude/skills", "claude-arsenal"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "B",   # flake8-bugbear (real bug patterns)
    "SIM", # flake8-simplify (cleaner equivalents)
    "PTH", # flake8-use-pathlib (prefer Path.open over open)
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

# fontTools ships no py.typed marker, so every table access is untyped. The
# boundary is confined to `drawspec.text.fontlib`, which annotates what it
# returns — strict checking still applies to everything on our side of it.
[[tool.mypy.overrides]]
module = "fontTools.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
