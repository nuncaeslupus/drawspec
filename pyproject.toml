[project]
name = "drawspec"
version = "0.1.0"
description = "Declarative diagram spec to clean, themeable SVG — writable by an LLM with no coordinates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "nuncaeslupus", email = "imarcos@gmail.com" }]
# What someone would search for who has the problem but not the name: a diagram
# they want written rather than drawn, and an LLM that keeps getting the
# placement wrong.
keywords = [
    "diagram",
    "diagrams",
    "svg",
    "diagram-generator",
    "documentation",
    "json-schema",
    "llm",
    "declarative",
    "flowchart",
    "dataviz",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "fonttools>=4.53",
]

# The PyPI sidebar is the whole of a package's navigation for someone who found
# it by search. `Documentation` points at the guide rather than at the README,
# because the guide is the page written to be enough on its own.
[project.urls]
Homepage = "https://github.com/nuncaeslupus/drawspec"
Documentation = "https://github.com/nuncaeslupus/drawspec/blob/main/docs/guide.md"
Repository = "https://github.com/nuncaeslupus/drawspec"
Issues = "https://github.com/nuncaeslupus/drawspec/issues"
Changelog = "https://github.com/nuncaeslupus/drawspec/blob/main/CHANGELOG.md"

[project.scripts]
drawspec = "drawspec.cli:main"
# Declared whether or not the `mcp` extra is installed, because a client's config
# names a command before anything runs it — and a missing command and a missing
# extra are indistinguishable to whoever pasted the config. This way the failure
# is `pip install 'drawspec[mcp]'` in the last line of the log.
drawspec-mcp = "drawspec.mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]
spike = [
    "grandalf>=0.8",
]
# The MCP server, and the only dependency drawspec has beyond fonttools. It is
# an extra rather than a dependency because it is a delivery mechanism, not part
# of the format: nobody rendering a diagram from Python should pay for starlette.
# The floor is 2.0 rather than something older because `drawspec.mcp` is written
# against the callback API (`on_list_tools` / `on_call_tool`) 2.0 introduced —
# a wider range would resolve to something that imports and then fails to serve.
mcp = [
    "mcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawspec"]

# The published schema is committed once, at the documented path, and copied into
# the wheel from there. Two copies in the repository would drift.
[tool.hatch.build.targets.wheel.force-include]
"schema/drawspec-v1.schema.json" = "drawspec/schemas/drawspec-v1.schema.json"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored build output, regenerated by `make update-skills` — not ours to lint.
extend-exclude = [".claude/skills", "claude-arsenal"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "B",   # flake8-bugbear (real bug patterns)
    "SIM", # flake8-simplify (cleaner equivalents)
    "PTH", # flake8-use-pathlib (prefer Path.open over open)
]

[tool.mypy]
python_version = "3.12"
# `tools/` is not shipped, but the spike test imports it, so it is held to the
# same standard as everything else.
files = ["src", "tests", "tools"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

# fontTools ships no py.typed marker, so every table access is untyped. The
# boundary is confined to `drawspec.text.fontlib`, which annotates what it
# returns — strict checking still applies to everything on our side of it.
[[tool.mypy.overrides]]
module = "fontTools.*"
ignore_missing_imports = true

# grandalf ships no py.typed either. It is confined to one adapter module, which
# is the whole point of the LayoutEngine protocol.
[[tool.mypy.overrides]]
module = "grandalf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/` holds the T7 spike harness, which the spike test asserts against.
# Not shipped, so it is not on the package path — put it on the test path.
pythonpath = ["tools"]
