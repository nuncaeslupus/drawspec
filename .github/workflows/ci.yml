name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Test
        run: uv run pytest -q

  # Visual proof for review: the gallery rendered from this pull request's code,
  # uploaded as an artifact, so a reviewer can open the SVGs of the kinds a
  # change touched without checking the branch out. One Python, no matrix — the
  # drawings do not depend on the interpreter, and this is for eyes, not a gate.
  gallery:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --python 3.12

      - name: Render the gallery
        run: uv run python tools/gallery.py

      - name: Upload the renders
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-pr-${{ github.event.pull_request.number }}
          path: |
            docs/gallery/*.svg
            docs/gallery/index.html
          retention-days: 14
          if-no-files-found: error
