name: Release

# Two ways in, one path out. Pushing a tag `v0.1.0` publishes 0.1.0. A push to
# main whose package version has a dated CHANGELOG heading and no tag yet
# creates that tag here and publishes it, so a release is: bump the version,
# date the changelog, merge. A tag pushed with the workflow token does not start
# another run, so nothing is published twice. Nothing here reads a version from anywhere else, because the two
# classic release-day failures are a tag that disagrees with the package and a
# stale `dist/` — the first is checked below, and the second cannot happen
# because the runner has no `dist/` until this job builds one.
on:
  push:
    tags: ["v*"]
    branches: [main]
  # So the whole path except the upload can be exercised without cutting a tag.
  workflow_dispatch:

# Every action is pinned to a commit SHA with its tag in a trailing comment.
# A tag is mutable: `@release/v1` is whatever that ref points at on the day the
# job runs, and this workflow hands an action `id-token: write` against PyPI.
# `.github/dependabot.yml` moves the pins, because a pin nothing updates is a
# workflow quietly running old code.
permissions:
  contents: read

# Two merges in quick succession must not both decide to tag and publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Decide what, if anything, is released
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # On a tag push the tag is the release. On main the release is the
      # package version, but only once CHANGELOG.md has a heading for it and no
      # tag exists yet; anything else is an ordinary merge and stops here.
      - name: Decide
        id: decide
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_EVENT_NAME" == "push" ]] || exit 0
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            exit 0
          fi
          if ! grep -qE "^## \[${version//./\\.}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated heading for $version; nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          if git push origin "$tag"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
            echo "$tag was created by another run; nothing to release"
          else
            echo "failed to push $tag" >&2
            exit 1
          fi

  check:
    name: The suite, before anything is published
    needs: tag
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # The floor rather than the newest: a release gated on 3.12 is gated on
      # the oldest interpreter `requires-python` promises to support.
      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --python 3.12

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Test
        run: uv run pytest -q

      # A tag that disagrees with the package publishes a version nobody asked
      # for and cannot be withdrawn. Checked here rather than trusted.
      - name: The tag, the pyproject version and __version__ agree
        if: env.RELEASE_TAG != ''
        run: |
          uv run python - <<'PY'
          import os, re, tomllib, pathlib
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("src/drawspec/__init__.py").read_text()
          runtime = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          assert tag == declared == runtime, (
              f"tag {tag}, pyproject {declared}, __version__ {runtime} — all three must agree"
          )
          print(f"releasing {tag}")
          PY

  build:
    name: Build and check the distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build the wheel and the sdist
        run: uv build --python 3.12

      - name: twine check
        run: uv run --with twine twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [tag, build]
    # Only a release tag publishes. A manual run builds and checks and stops,
    # which is what makes the rest of this workflow safe to exercise.
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/drawspec
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity through
      # OIDC, so no API token is stored in the repository at all. It has to be
      # configured once on PyPI — see the Releasing section of CONTRIBUTING.md.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: dist/

      - name: Upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  mcp-registry:
    name: Publish to the MCP Registry
    needs: [tag, publish]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      # The registry checks io.github.nuncaeslupus/* against this workflow's OIDC
      # token, and the package by the `mcp-name:` line in the README now on PyPI.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - run: ./mcp-publisher login github-oidc

      - run: ./mcp-publisher publish

  announce:
    name: Cut the GitHub release
    needs: [tag, publish]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: dist/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --title "${RELEASE_TAG}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
