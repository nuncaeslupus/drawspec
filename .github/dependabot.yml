version: 2

# Actions only, and only because the release workflow pins them to commit SHAs.
# A SHA is immutable, which is the point — and it is also why a pinned action
# never picks up a security fix on its own. Pinning without something to move
# the pins is how a workflow ends up running two-year-old code with a comment
# next to it claiming it is `v4`.
#
# Python dependencies are deliberately absent: `uv.lock` upgrades are a
# judgement call about what breaks, not a stream of individual bumps, and there
# is a runbook for doing them together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
