# drawspec's default theme.
#
# A theme is data, not code: a consumer versions and diffs this file without
# importing drawspec, and any theme they write is merged over these values, so
# they declare only what they change.
#
# Two rules shape every value below.
#
# Colour is optional; legibility in greyscale is not. Every stroke here is
# `currentColor`, so a diagram pasted into a page inherits that page's ink and
# follows it into dark mode. That means colour carries no information at all,
# which is why every pair of roles is separated by shape, dash pattern or stroke
# weight instead — checked at load time, not at review time.
#
# One size per level. Four type sizes exist and no element may name its own.

version = 1
name = "default"

[canvas]
# Every diagram is drawn to one width, so type size and stroke weight are
# comparable across diagrams rather than only within one.
width = 640.0
# ...which only holds if a narrow drawing keeps the canvas instead of being
# cropped to its own ink. Cropped, a 360-wide flow and a 600-wide tree are two
# different canvases, and a page that gives both the same column scales them by
# different factors — so the same eleven-point label is read at two sizes. The
# cost is empty margin beside a small diagram; the gain is one type size across
# a document. Set to "ink" for a diagram that is meant to be sized on its own.
width_mode = "fixed"
# The channel between the drawing and the edge of the canvas, on all four sides.
# One number applied once: before it existed each family invented its own, so the
# same theme framed a flow in 24 units, a cycle in 10, and a stack in none, and a
# timeline above a flow chart bled to the edge beside a quarter-inch of white.
# It is [box] padding one level out — the gap a box gives its text, the figure
# gives the page — so the default is that padding's side value. It goes around
# the width above, so the emitted canvas is 640 + 12 * 2 and every kind is framed
# alike. Set 0 for a page that pads its own figures.
margin = 12.0
# Below this, type is not legible at the sizes these diagrams are read at.
# Content that cannot fit above it is a FitError, never a smaller size.
min_legible_size = 9.0

[font]
# The families to measure against, in preference order. These lead with the
# generics drawspec bundles, so the default theme resolves on every host and
# never warns about a substitution nobody asked for.
#
# A consumer theme should put the family its *page* is set in first — the SVG
# inherits the page's font stack, so measuring a different family is what makes
# a tight box overflow. Naming a family that is not installed is not an error;
# drawspec substitutes and says so.
sans = ["DejaVu Sans", "sans-serif"]
serif = ["DejaVu Serif", "serif"]
mono = ["DejaVu Sans Mono", "monospace"]
default = "sans"

[scale]
# Four sizes, not fourteen: diagram title, box heading, box body, edge label.
title = 15.0
heading = 13.0
body = 11.0
label = 10.0

[fit]
# How far the whole type scale may stretch to make content fit. One factor is
# applied to every level at once, so the hierarchy is preserved exactly and no
# diagram gains a new type size. scale_max = 1.0 means shrink to fit, never grow:
# growing would trade away the cross-diagram comparability [canvas] width buys.
scale_min = 0.85
scale_max = 1.0

[box]
# Top, right, bottom, left. The bottom is not the smallest value by accident —
# a starved bottom margin was the single most repeated failure in the corpus.
padding = [10.0, 12.0, 12.0, 12.0]
line_height = 1.35
corner_radius = 4.0

[edge]
stroke_width = 1.5
# An arrow with no visible shaft is not an arrow. This is a layout constraint,
# not a suggestion: it can force extra rank separation.
min_shaft_length = 16.0
# About the cap height of the body type, because that is what a head is read
# beside: at six it measured half a capital, and the corpus review's word for it
# was "arrow heads look small, maybe lines are thicker?" — the shaft was the
# suspect, but the head was the culprit.
head_length = 8.0
# Daylight a route keeps from a box it is only passing. A line flush against a
# border reads as part of that box rather than as a connector going elsewhere,
# and a line a few units off one still hugs it — this is the smallest gap that
# reads as "going past" rather than "attached to".
clearance = 6.0
# How far apart two routes running the same line are drawn. One head length was
# what this used to borrow, and three edges leaving one box came out as a bundle
# whose corners stacked within a few units of each other.
lane_spacing = 12.0

[title]
# Whether a diagram carries its own "Figure 1" style title. Raised with the
# consumer and left open, so drawspec supports it and adds none by default.
show = false
level = "title"

[mark]
# How a chart tells one mark from another. Fill patterns, never colour: these
# are what survives a black-and-white printer, and the loader refuses a repeat
# because two marks sharing a fill cannot be told apart. A mark takes the entry
# at its own index among the filled marks in its chart. Patterns are drawn faint
# on purpose — a fill that competes with the text over it makes the text
# illegible, which was the loudest complaint about the hand-drawn originals.
fills = ["dots", "hatch", "grid", "cross", "none"]
# How much of a category's band is left empty around its bars. Zero draws bars
# that touch, which reads as one wide bar rather than as several.
gap = 0.3
# The tones a matrix's ordered `scale` is filled with, lightest first: how much of
# the page's ink each step lays down. An order, which patterns cannot carry —
# dots and hatch are two things, not two amounts — so a heatmap reads by
# darkness, the channel greyscale keeps. The loader holds it to that: five steps
# or more, each at least 0.08 darker than the one before (the first measured from
# a blank cell), none past 0.4 so a cell's text stays readable on it on a white
# page and on a dark one.
ramp = [0.08, 0.16, 0.24, 0.32, 0.4]

[frames]
# A container — a group's frame, a composite state, a sequence group — is washed
# with this much of the page's ink (0 for outlines only). It is the ink at part
# opacity, never a colour, so it follows a dark page and prints as a light grey;
# a frame inside a frame lays its wash over its parent's, one step darker per
# level, for `levels` levels.
tone = 0.05
levels = 3

[levels]
# A pyramid's levels, a funnel's stages, rings and a stack's layers are graded
# from the ramp above: the first written lightest, one step darker per level, so
# the order the author wrote reads at a glance and in greyscale. The ink at part
# opacity, as a frame's wash is; false for outlines only.
shade = true

[classes]
# A flow's, tree's or swimlane's node classes, in the order the document declares
# them: the first a grey wash (the ink at `tone`), the rest faint patterns in the
# ink. The key under the drawing shows each beside its name.
fills = ["solid", "dots", "hatch", "grid"]
tone = 0.14

[states]
# A state machine's pseudo-states: the filled dot it starts from, and the ringed
# dot each final state leads to. Marks with no words, so sized here: the dot
# about the cap height of the body type, the ring a stroke's width clear of it.
dot = 10.0
ring = 3.0
# A fork or join bar: `bar` thick across the flow, and `bar_step` long for each
# arrow on its busy side, so it grows with the regions it splits into or joins.
bar = 6.0
bar_step = 44.0

[sequence]
# A sequence diagram's activation bar, inferred from a call and its reply: about
# the cap height of the body type across, so it reads as a bar and not a line. A
# lifeline is drawn in an edge role with no head; `aside` keeps it light.
activation = 10.0
lifeline = "aside"

[lanes]
# A swimlane diagram's lanes run across the page as rows, the way they are drawn
# by hand, when that fits the width; otherwise down it as columns. The line
# between two lanes is drawn in an edge role with no head: dashed, so the arrows
# crossing it — the hand-offs — are what the eye follows.
orientation = "auto"
separator = "link"
# Every second lane is washed with this much of the page's ink, so a row of five
# or six lanes reads as bands rather than as lines to count. 0 for none.
stripe = 0.04
# The line between two phases runs across every lane, so it is the lighter
# dashed role: the lanes stay the grid's first axis, the phases its second.
phase = "aside"

[entities]
# How an entity diagram draws a relation's cardinality — the author says `one`
# or `zero-or-many`, and this says how: crow's-foot marks across the line's end,
# or UML's numbers beside it ("numeric": 1, 0..1, *, 0..*, 1..*).
notation = "crowsfoot"

[gantt]
# A plan's milestone — a task with `at` rather than `start` and `end` — is drawn
# as a filled diamond, the way most plans draw one ("circle" for a dot). A mark
# (today, a deadline) is a line across every row in an edge role with no head:
# dashed, so it reads as a reference and not as a task.
milestone = "diamond"
marks = "weak"
# A task's `done` is a solid band through its bar, in the page's ink at this
# strength (0 to 1), so it reads on a dark page and in greyscale.
done = 0.7

[board]
# A story map's slices are told apart by a line across every column in an edge
# role with no head — dashed, so the cards and not the lines are what is read —
# and the cut under the first release by the one heavy line on the board.
separator = "weak"
cut = "strong"

[fishbone]
# A fishbone's bones slant into the spine by convention — the slant is the shape,
# so this is the one diagonal drawspec draws on purpose; 90 draws upright bones.
# The spine is the heavy line everything flows into; a bone is an ordinary line,
# and the tick a cause sits on the lightest, so the words are what is read.
slant = 60.0
spine = "strong"
bone = "flow"
cause = "link"

[journey]
# A journey map's feeling line is the one heavy line on it; the guide each level
# is named on is light and dashed, so the line reads over the grid, and the rule
# above each detail row is thin and solid, a table's line rather than a level's.
line = "strong"
guide = "aside"
separator = "link"

[numberline]
# Whether a range's end belongs to it is drawn as a filled (in) or hollow (out)
# dot, the school convention in most of the world; "brackets" draws "[" and "(",
# as most US and college algebra texts do. A point is a dot either way.
ends = "dots"

[flow]
# How a causal link's sign is written: "+-" (a plus and a true minus) or "so"
# (s for same, o for opposite, as some systems-thinking courses write it). The
# document says which links are negative either way.
polarity = "+-"

[pie]
# A pie is a disc, its labels inside a sector when they fit; "donut" draws a ring
# with a hole of about half the radius and every label outside on a leader. House
# style, set once for a report: the shares are the same either way.
shape = "pie"

[mindmap]
# A twig or a leaf sits on a line, its branch line running on under its words,
# the mind-map convention; true boxes them like the main branches. Lines thin
# from the centre outwards: the width each level's line leaves its parent at,
# narrowing to the next level's where it arrives.
boxes = false
taper = [6.0, 3.0, 1.5]

[sunburst]
# How boldly a sunburst's structure is drawn, as shares of the wheel's radius with a
# hairline floor, so a wide wheel reads as firmly as a small one: a first-ring divider
# and the rim, a ring boundary and the hub circle, a division two or more rings deep.
# Heaviest first; none heavier than the one before.
weights = [0.006, 0.0035, 0.002]

[network]
# How a network diagram is washed, as shares of the page's ink: a network's bus,
# with its name and address written on it, and a group's backdrop behind its
# hosts — lighter, so a group reads as ground and a bus as a thing.
bus = 0.16
group = 0.07

[argument]
# How an argument map shows which way a point bears, twice so greyscale holds: a
# tag in the box's top margin, read aloud down a chain (claim, because, but, but),
# and a faint fill on an objection's box; a reason's box is plain.
for_tag = "because"
against_tag = "but"
against_fill = "hatch"

[familytree]
# How a family tree marks a carrier. `dot` is the standard nomenclature's (a dot
# in the middle of the symbol); `half` fills its left half, as exam pedigrees do.
carrier = "dot"

[rag]
# How a RAG report draws a rating: its word and its shape, both always, so a
# greyscale print or a reader who cannot tell red from green loses nothing. The
# three words differ and so do the three shapes; a colour is added only when a
# theme names one (`red_colour`, …), which this one does not: marks are drawn in
# the page's ink. A trend's arrow (up, across, down) carries its word too.
red = "Red"
amber = "Amber"
green = "Green"
red_shape = "square"
amber_shape = "triangle"
green_shape = "circle"
better = "improving"
same = "no change"
worse = "worsening"

# ---------------------------------------------------------------------------
# Node roles. Shape and line treatment per semantic role. The author names the
# role; every appearance decision below is taken here, once, for all diagrams.
#
# No two roles below share a (shape, dash, stroke_width, fill_pattern) tuple,
# which is what makes them survive greyscale printing.
# ---------------------------------------------------------------------------

[role.start]
shape = "pill"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

[role.step]
shape = "rect"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

[role.decision]
shape = "diamond"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

# An end state reads as a heavier ring, not as a different colour.
[role.terminal]
shape = "pill"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 2.5

[role.emphasis]
shape = "rect"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 2.5

# A flowchart's three standard symbols beyond the box and the diamond, each told
# apart by its outline alone: data coming in or going out is a parallelogram, a
# process defined elsewhere is a box with doubled sides, and where data rests (a
# database, a queue, a file) is a drum.
[role.io]
shape = "parallelogram"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

[role.subroutine]
shape = "subroutine"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

[role.store]
shape = "cylinder"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

# A person — a user, a customer, a member of staff, as against a system — is a
# body with rounded shoulders under a round head, the C4 person shape; the name
# is written in the body, under the head.
[role.person]
shape = "person"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

# An aside is set beside the argument, not boxed off from it: a note is words on
# the page, and the box drawspec used to draw round them was a border with
# nothing on the other side of it. A grouping that *does* want a line round it is
# `group`, below — that is the role whose whole job is enclosing.
[role.note]
shape = "none"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "3 2"
stroke_width = 1.0

# A container drawn behind its members: a longer dash than a note, so the two
# are told apart by pattern rather than by weight alone.
[role.group]
shape = "rect"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "6 3"
stroke_width = 1.0

# ---------------------------------------------------------------------------
# Edge roles. Head, tail and line treatment per semantic role. This is where a
# connector that is *not* an arrow lives: the author says two things are merely
# associated (`link`), and the theme decides that means a line with no head.
# ---------------------------------------------------------------------------

[edge_role.flow]
head = "arrow"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

[edge_role.link]
head = "none"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.0
# The one role drawn straight rather than routed. `link` means "merely
# associated" — no head, no direction, no order — and that is the relation a
# mesh is made of: a spine-leaf fabric or a value chain is saying *everything
# connects to everything*, which a chord says at a glance and a ladder of
# parallel staircases makes the reader disentangle. Every role with a head keeps
# the right angles: a flow read down the page is a sequence, and a diagonal
# between two steps of it reads as a mistake.
routing = "direct"

[edge_role.exchange]
head = "arrow"
tail = "arrow"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

[edge_role.weak]
head = "open"
tail = "none"
stroke = "currentColor"
dash = "4 3"
stroke_width = 1.5

# Dashed and headless — the one pairing the other six could not make, and the
# gap an author kept falling into. `link` is headless but solid, so it states an
# association more firmly than a note deserves; `weak` is dashed but carries an
# open head, so it invents a direction the relation does not have. A dashed line
# to a metadata note is neither: it says *this belongs with that*, softly, and
# says nothing about which way. Drawn at `link`'s weight rather than `weak`'s,
# because it is the quiet relation and not the tentative one.
[edge_role.aside]
head = "none"
tail = "none"
stroke = "currentColor"
dash = "4 3"
stroke_width = 1.0

# The opposite end of the scale from `weak`: the one path through a network that
# matters — a critical path, the route a request actually took. Heavier than
# `flow` and otherwise identical, so it reads as the same relation drawn louder
# rather than as a different relation, and it survives greyscale because weight
# is not a colour.
[edge_role.strong]
head = "arrow"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 2.5

[edge_role.owns]
head = "diamond"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

# A class diagram's two "is a" relations, named only in an `entities` document:
# a hollow triangle at the general end, solid for a subclass and dashed for an
# interface it implements — told apart from each other by dash, and from every
# other role by the head's shape.
[edge_role.inherits]
head = "triangle"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

[edge_role.realizes]
head = "triangle"
tail = "none"
stroke = "currentColor"
dash = "4 3"
stroke_width = 1.5

# A sequence diagram's asynchronous message, named only in a `sequence`: sent,
# and the sender carries on. UML draws it as a solid line with an open (stick)
# head — `flow`'s line with `weak`'s head, so it is told from a call by the head
# and from a reply by the solid line.
[edge_role.async]
head = "open"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

# A funnel is a thing you pour into, and a reader already knows what one looks
# like: full width at the mouth, narrowing downward. `right` draws the same
# stages as a pipeline losing volume across the page, which suits long labels —
# a stage laid across the page has the whole band to write in.
[funnel]
direction = "down"
