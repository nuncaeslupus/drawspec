# drawspec's default theme.
#
# A theme is data, not code: a consumer versions and diffs this file without
# importing drawspec, and any theme they write is merged over these values, so
# they declare only what they change.
#
# Two rules shape every value below.
#
# Colour is optional; legibility in greyscale is not. Every stroke here is
# `currentColor`, so a diagram pasted into a page inherits that page's ink and
# follows it into dark mode. That means colour carries no information at all,
# which is why every pair of roles is separated by shape, dash pattern or stroke
# weight instead — checked at load time, not at review time.
#
# One size per level. Four type sizes exist and no element may name its own.

version = 1
name = "default"

[canvas]
# Every diagram is drawn to one width, so type size and stroke weight are
# comparable across diagrams rather than only within one.
width = 640.0
# ...which only holds if a narrow drawing keeps the canvas instead of being
# cropped to its own ink. Cropped, a 360-wide flow and a 600-wide tree are two
# different canvases, and a page that gives both the same column scales them by
# different factors — so the same eleven-point label is read at two sizes. The
# cost is empty margin beside a small diagram; the gain is one type size across
# a document. Set to "ink" for a diagram that is meant to be sized on its own.
width_mode = "fixed"
# The channel between the drawing and the edge of the canvas, on all four sides.
# One number applied once: before it existed each family invented its own, so the
# same theme framed a flow in 24 units, a cycle in 10, and a stack in none, and a
# timeline above a flow chart bled to the edge beside a quarter-inch of white.
# It is [box] padding one level out — the gap a box gives its text, the figure
# gives the page — so the default is that padding's side value. It goes around
# the width above, so the emitted canvas is 640 + 12 * 2 and every kind is framed
# alike. Set 0 for a page that pads its own figures.
margin = 12.0
# Below this, type is not legible at the sizes these diagrams are read at.
# Content that cannot fit above it is a FitError, never a smaller size.
min_legible_size = 9.0

[font]
# The families to measure against, in preference order. These lead with the
# generics drawspec bundles, so the default theme resolves on every host and
# never warns about a substitution nobody asked for.
#
# A consumer theme should put the family its *page* is set in first — the SVG
# inherits the page's font stack, so measuring a different family is what makes
# a tight box overflow. Naming a family that is not installed is not an error;
# drawspec substitutes and says so.
sans = ["DejaVu Sans", "sans-serif"]
serif = ["DejaVu Serif", "serif"]
mono = ["DejaVu Sans Mono", "monospace"]
default = "sans"

[scale]
# Four sizes, not fourteen: diagram title, box heading, box body, edge label.
title = 15.0
heading = 13.0
body = 11.0
label = 10.0

[fit]
# How far the whole type scale may stretch to make content fit. One factor is
# applied to every level at once, so the hierarchy is preserved exactly and no
# diagram gains a new type size. scale_max = 1.0 means shrink to fit, never grow:
# growing would trade away the cross-diagram comparability [canvas] width buys.
scale_min = 0.85
scale_max = 1.0

[box]
# Top, right, bottom, left. The bottom is not the smallest value by accident —
# a starved bottom margin was the single most repeated failure in the corpus.
padding = [10.0, 12.0, 12.0, 12.0]
line_height = 1.35
corner_radius = 4.0

[edge]
stroke_width = 1.5
# An arrow with no visible shaft is not an arrow. This is a layout constraint,
# not a suggestion: it can force extra rank separation.
min_shaft_length = 16.0
# About the cap height of the body type, because that is what a head is read
# beside: at six it measured half a capital, and the corpus review's word for it
# was "arrow heads look small, maybe lines are thicker?" — the shaft was the
# suspect, but the head was the culprit.
head_length = 8.0
# Daylight a route keeps from a box it is only passing. A line flush against a
# border reads as part of that box rather than as a connector going elsewhere,
# and a line a few units off one still hugs it — this is the smallest gap that
# reads as "going past" rather than "attached to".
clearance = 6.0
# How far apart two routes running the same line are drawn. One head length was
# what this used to borrow, and three edges leaving one box came out as a bundle
# whose corners stacked within a few units of each other.
lane_spacing = 12.0

[title]
# Whether a diagram carries its own "Figure 1" style title. Raised with the
# consumer and left open, so drawspec supports it and adds none by default.
show = false
level = "title"

[mark]
# How a chart tells one mark from another. Fill patterns, never colour: these
# are what survives a black-and-white printer, and the loader refuses a repeat
# because two marks sharing a fill cannot be told apart. A mark takes the entry
# at its own index among the filled marks in its chart. Patterns are drawn faint
# on purpose — a fill that competes with the text over it makes the text
# illegible, which was the loudest complaint about the hand-drawn originals.
fills = ["dots", "hatch", "grid", "cross", "none"]
# How much of a category's band is left empty around its bars. Zero draws bars
# that touch, which reads as one wide bar rather than as several.
gap = 0.3

# ---------------------------------------------------------------------------
# Node roles. Shape and line treatment per semantic role. The author names the
# role; every appearance decision below is taken here, once, for all diagrams.
#
# No two roles below share a (shape, dash, stroke_width, fill_pattern) tuple,
# which is what makes them survive greyscale printing.
# ---------------------------------------------------------------------------

[role.start]
shape = "pill"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

[role.step]
shape = "rect"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

[role.decision]
shape = "diamond"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 1.5

# An end state reads as a heavier ring, not as a different colour.
[role.terminal]
shape = "pill"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 2.5

[role.emphasis]
shape = "rect"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "none"
stroke_width = 2.5

# An aside is set beside the argument, not boxed off from it: a note is words on
# the page, and the box drawspec used to draw round them was a border with
# nothing on the other side of it. A grouping that *does* want a line round it is
# `group`, below — that is the role whose whole job is enclosing.
[role.note]
shape = "none"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "3 2"
stroke_width = 1.0

# A container drawn behind its members: a longer dash than a note, so the two
# are told apart by pattern rather than by weight alone.
[role.group]
shape = "rect"
stroke = "currentColor"
fill = "none"
fill_pattern = "none"
dash = "6 3"
stroke_width = 1.0

# ---------------------------------------------------------------------------
# Edge roles. Head, tail and line treatment per semantic role. This is where a
# connector that is *not* an arrow lives: the author says two things are merely
# associated (`link`), and the theme decides that means a line with no head.
# ---------------------------------------------------------------------------

[edge_role.flow]
head = "arrow"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

[edge_role.link]
head = "none"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.0
# The one role drawn straight rather than routed. `link` means "merely
# associated" — no head, no direction, no order — and that is the relation a
# mesh is made of: a spine-leaf fabric or a value chain is saying *everything
# connects to everything*, which a chord says at a glance and a ladder of
# parallel staircases makes the reader disentangle. Every role with a head keeps
# the right angles: a flow read down the page is a sequence, and a diagonal
# between two steps of it reads as a mistake.
routing = "direct"

[edge_role.exchange]
head = "arrow"
tail = "arrow"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

[edge_role.weak]
head = "open"
tail = "none"
stroke = "currentColor"
dash = "4 3"
stroke_width = 1.5

# Dashed and headless — the one pairing the other six could not make, and the
# gap an author kept falling into. `link` is headless but solid, so it states an
# association more firmly than a note deserves; `weak` is dashed but carries an
# open head, so it invents a direction the relation does not have. A dashed line
# to a metadata note is neither: it says *this belongs with that*, softly, and
# says nothing about which way. Drawn at `link`'s weight rather than `weak`'s,
# because it is the quiet relation and not the tentative one.
[edge_role.aside]
head = "none"
tail = "none"
stroke = "currentColor"
dash = "4 3"
stroke_width = 1.0

# The opposite end of the scale from `weak`: the one path through a network that
# matters — a critical path, the route a request actually took. Heavier than
# `flow` and otherwise identical, so it reads as the same relation drawn louder
# rather than as a different relation, and it survives greyscale because weight
# is not a colour.
[edge_role.strong]
head = "arrow"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 2.5

[edge_role.owns]
head = "diamond"
tail = "none"
stroke = "currentColor"
dash = "none"
stroke_width = 1.5

# A funnel is a thing you pour into, and a reader already knows what one looks
# like: full width at the mouth, narrowing downward. `right` draws the same
# stages as a pipeline losing volume across the page, which suits long labels —
# a stage laid across the page has the whole band to write in.
[funnel]
direction = "down"
